        };

        function highlightPlainCodeSegment(text, language) {
            const lang = (language || '').toLowerCase();
            let html = escapeHtml(text);
            html = html.replace(/\b(\d+\.?\d*)\b/g, '<span style="color:#b5cea8;">$1</span>');
            const keywords = codeKeywordMap[lang] || '';
            if (keywords) {
                html = html.replace(new RegExp(`\\b(${keywords})\\b`, 'g'), '<span style="color:#c586c0;">$1</span>');
            }
            return html;
        }

        function highlightCodeLine(line, language) {
            const lang = (language || '').toLowerCase();
            const commentMarkers = ['python', 'ruby', 'yaml', 'bash', 'shell'].includes(lang) ? ['#'] : ['//'];
            let html = '';
            let i = 0;

            while (i < line.length) {
                const marker = commentMarkers.find(item => line.startsWith(item, i));
                if (marker) {
                    html += `<span style="color:#6a9955;">${escapeHtml(line.slice(i))}</span>`;
                    break;
                }

                const char = line[i];
                if (char === '"' || char === "'" || char === '`') {
                    const quote = char;
                    let end = i + 1;
                    while (end < line.length) {
                        if (line[end] === '\\') {
                            end += 2;
                            continue;
                        }
                        if (line[end] === quote) {
                            end++;
                            break;
                        }
                        end++;
                    }
                    const rawString = line.slice(i, end);
                    const rest = line.slice(end).trimStart();
                    const color = rest.startsWith(':') ? '#9cdcfe' : '#ce9178';
                    html += `<span style="color:${color};">${escapeHtml(rawString)}</span>`;
                    i = end;
                    continue;
                }

                let next = i + 1;
                while (next < line.length) {
                    const startsComment = commentMarkers.some(item => line.startsWith(item, next));
                    if (startsComment || ['"', "'", '`'].includes(line[next])) break;
                    next++;
                }
                html += highlightPlainCodeSegment(line.slice(i, next), lang);
                i = next;
            }

            return html;
        }

        highlightCode = function(code, language) {
            return highlightCodeLine(code, language);
        };

                    <section style="margin: 10px 0%;box-sizing: border-box;">
                        <section style="text-align: center;color: ${textColor};font-size: 12px;box-sizing: border-box;">
                            <p><span style="font-size: 10px;color: ${textColor};"><span leaf="">${currentTaoKouLing}</span></span></p>
                            <p><span style="font-size: 10px;color: ${textColor};"><span leaf="">电脑直接访问链接，手机复制本段所有内容</span></span></p>
                        </section>
                    </section>
                </section>
            </section>`;
        }

        function processInlineFormatting(text, skipWrapper = false, styleNotes = false) {
            let processed = text || '';
            const inlineCodeTokens = [];
            const priceTokens = [];

            // 先保护行内代码（反引号 ` ` 包裹的内容），避免内部内容被自动加空格等规则改写
            processed = processed.replace(/`([^`\n]+)`/g, (match, content) => {
                const token = `%%INLINE_CODE_${inlineCodeTokens.length}%%`;
                inlineCodeTokens.push(
                    `<code style="font-family: Menlo, &quot;Operator Mono&quot;, monospace; background-color: rgb(243, 243, 243); padding: 2px 5px; border-radius: 3px; font-size: 0.85em; color: rgb(232, 62, 140); visibility: visible;"><span leaf="" style="visibility: visible;">${escapeHtml(content)}</span></code>`
                );
                return token;
            });

            // 中英文混排加空格、中文引号转换
            processed = processTextSpacing(processed);
            processed = protectAutoPriceStyles(processed, priceTokens);
            if (styleNotes) {
                processed = styleParentheticalNotes(processed);
            }
            
            // 先处理组合格式 ==**...**== 和 **==...==**（避免被后面的空格处理破坏）
            processed = processed.replace(/==\*\*(.+?)\*\*==/g, (match, content) => {
                if (isPersonalMode) {
                    return `<em style="letter-spacing: normal; background: linear-gradient(transparent 50%, rgb(255, 242, 168) 0px); padding: 0px 2px; color: rgb(51, 51, 51); font-style: normal !important;"><span leaf="" style="font-weight: bold; color: rgb(0, 0, 0);">${content}</span></em>`;
                }
                return `<span textstyle="" style="letter-spacing: normal; color: rgb(51, 173, 255); font-weight: bold;">${content}</span>`;
            });
            processed = processed.replace(/\*\*==(.+?)==\*\*/g, (match, content) => {
                if (isPersonalMode) {
                    return `<em style="letter-spacing: normal; background: linear-gradient(transparent 50%, rgb(255, 242, 168) 0px); padding: 0px 2px; color: rgb(51, 51, 51); font-style: normal !important;"><span leaf="" style="font-weight: bold; color: rgb(0, 0, 0);">${content}</span></em>`;
                }
                return `<span textstyle="" style="letter-spacing: normal; color: rgb(51, 173, 255); font-weight: bold;">${content}</span>`;
            });
            
            // 处理 ==：如果一边是中文，另一边是数字/英文，就在==右侧加空格
            processed = processed.replace(/([\u4e00-\u9fa5\d_a-zA-Z]?)==([\u4e00-\u9fa5\d_a-zA-Z]?)/g, (match, left, right) => {
                const isLeftCN = /[\u4e00-\u9fa5]/.test(left);
                const isLeftEN = /[\d_a-zA-Z]/.test(left);
                const isRightCN = /[\u4e00-\u9fa5]/.test(right);
                const isRightEN = /[\d_a-zA-Z]/.test(right);
                
                // 一边是中文，另一边是数字/英文 → 加空格
                if ((isLeftEN && isRightCN) || (isLeftCN && isRightEN)) {
                    return left + '== ' + right;
                }
                return match;
            });
            
            // 处理 ==文本== - 高亮/标蓝
            processed = processed.replace(/==([^=]+)==/g, (match, content) => {
                const fontWeight = isYuanPriceText(content) ? ' font-weight: bold;' : '';
                if (isPersonalMode) {
                    return `<em style="letter-spacing: normal; background: linear-gradient(transparent 50%, rgb(255, 242, 168) 0px); padding: 0px 2px; color: rgb(51, 51, 51); font-style: normal !important;"><span leaf="" style="color: rgb(0, 0, 0);${fontWeight}">${content}</span></em>`;
                }
                return `<span textstyle="" style="letter-spacing: normal; color: rgb(51, 173, 255);${fontWeight}">${content}</span>`;
            });
            
            // 处理 **文本** - 加粗
            if (isPersonalMode) {
                // 个人模式：仅加粗
                processed = processed.replace(/\*\*(.+?)\*\*/g, (match, content) => {
                    return `<span textstyle="" style="letter-spacing: normal; font-weight: bold; color: rgb(0, 0, 0);">${content}</span>`;
                });
            } else {
                // 默认模式：仅加粗
                processed = processed.replace(/\*\*(.+?)\*\*/g, (match, content) => {
                    return `<span textstyle="" style="letter-spacing: normal; font-weight: bold;">${content}</span>`;
                });
            }
            // 恢复自动价格样式
            processed = processed.replace(/%%AUTO_PRICE_(\d+)%%/g, (match, index) => {
                return priceTokens[Number(index)] || match;
            });
            processed = applyInlineHtmlBoundarySpacing(processed);

            // 恢复行内代码原文
            processed = processed.replace(/%%INLINE_CODE_(\d+)%%/g, (match, index) => {
                return inlineCodeTokens[Number(index)] || match;
            });
            
            // 基础span包装
            if (!skipWrapper && !processed.includes('textstyle=""') && processed) {
                processed = `<span textstyle="" style="letter-spacing: normal;">${processed}</span>`;
            }
            return processed;
        }

        /* ==================== Markdown 解析与渲染 ==================== */
        
        /**
         * 处理标题中的平台标签 [xxx]，将其设置为 15px 黑色
         * @param {string} content - 标题内容
         * @returns {string} 处理后的HTML
         */
        function processPlatformTags(content) {
            // 先用 processInlineFormatting 处理加粗、标蓝等
            let processed = processInlineFormatting(content, true).trim();
            // 平台标签：15px 黑色
            processed = processed.replace(/\[([^\]]+)\]/g, '<span style="font-size: 15px; color: rgb(0, 0, 0);">[$1]</span>');
            return processed;
        }

        function shouldSkipSpacingBetweenBlocks(prevBlock, block) {
            return block.type === 'caption-note'
                && ['referenced-image', 'side-by-side-images', 'image-placeholder'].includes(prevBlock.type);
        }

        function appendRenderedContentBlocks(contentBlocks, renderBlock, spacing) {
            let html = '';
            contentBlocks.forEach((block, index) => {
                const blockHTML = renderBlock(block);
                if (!blockHTML) return;

                if (index > 0) {
                    const prevBlock = contentBlocks[index - 1];
                    if (shouldSkipSpacingBetweenBlocks(prevBlock, block)) {
                        // 图片和说明文本之间不加空行
                    } else if ((block.type === 'h1' || block.type === 'h2') && !isPersonalMode) {
                        html += spacing.doubleBr;
                    } else {
                        html += spacing.singleBr;
                    }
                }

                html += blockHTML;
            });
            return html;
        }
        
        /**
         * Markdown转微信预览HTML
         * @param {string} markdown - Markdown文本
         * @returns {string} 微信样式的HTML
         */
        function markdownToWeChatHTML(markdown, includeFixedContent = true) {
            let rawLines = markdown.split('\n');
            let contentBlocks = [];
            let inList = false;
            let currentList = [];
            let i = 0;
            
            // 获取当前模式对应的空行HTML
            const { singleBr, doubleBr } = getBrHtml(isPersonalMode);
            
            // 第一步：解析内容块
            while (i < rawLines.length) {
                const line = rawLines[i];
                const trimmedLine = line.trim();

                // 代码块（```语言 开始，``` 结束）
                const codeBlockOpen = trimmedLine.match(/^```(\w*)$/);
                if (codeBlockOpen) {
                    if (inList) {
                        contentBlocks.push({ type: 'ul', content: currentList });
                        inList = false;
                        currentList = [];
                    }
                    const lang = codeBlockOpen[1] || '';
                    const codeLines = [];
                    i++;
                    while (i < rawLines.length) {
                        if (rawLines[i].trim() === '```') { i++; break; }
                        codeLines.push(rawLines[i]);
                        i++;
                    }
                    contentBlocks.push({ type: 'code-block', language: lang, code: codeLines.join('\n') });
                    continue;
                }

                // 多行灰色底框开始（以 ` 开头但不以 ` 结尾）
                if (trimmedLine.startsWith('`') && !trimmedLine.endsWith('`')) {
                    // 如果正在处理列表，先结束列表
                    if (inList) {
                        contentBlocks.push({
                            type: 'ul',
                            content: currentList
                        });
                        inList = false;
                        currentList = [];
                    }
                    let boxLines = [];

                    // 收集开始行
                    boxLines.push(trimmedLine.slice(1).trim());
                    i++;

                    // 收集中间行
                    while (i < rawLines.length) {
                        const nextLine = rawLines[i].trim();
                        if (nextLine.endsWith('`')) {
                            boxLines.push(nextLine.slice(0, -1).trim());
                            i++;
                            break;
                        } else {
                            boxLines.push(nextLine);
                            i++;
                        }
                    }
                    
                    contentBlocks.push({
                        type: 'box',
                        content: boxLines.join('\n')
                    });
                    continue;
                }



                // 单行灰色底框
                if (trimmedLine.startsWith('`') && trimmedLine.endsWith('`')) {
                    // 如果正在处理列表，先结束列表
                    if (inList) {
                        contentBlocks.push({
                            type: 'ul',
                            content: currentList
                        });
                        inList = false;
                        currentList = [];
                    }
                    // 保留反引号标记，让渲染时的 processInlineFormatting 能正确处理斜杠保护
                    contentBlocks.push({
                        type: 'box',
                        content: trimmedLine
                    });
                    i++;
                    continue;
                }

                // 大标题 (## )
                if (trimmedLine.startsWith('## ') && !trimmedLine.startsWith('### ')) {
                    // 如果正在处理列表，先结束列表
                    if (inList) {
                        contentBlocks.push({
                            type: 'ul',
                            content: currentList
                        });
                        inList = false;
                        currentList = [];
                    }
                    contentBlocks.push({
                        type: 'h1',
                        content: trimmedLine.substring(3)
                    });
                    i++;
                    continue;
                }

                // 小标题 (### )
                if (trimmedLine.startsWith('### ')) {
                    // 如果正在处理列表，先结束列表
                    if (inList) {
                        contentBlocks.push({
                            type: 'ul',
                            content: currentList
                        });
                        inList = false;
                        currentList = [];
                    }
                    contentBlocks.push({
                        type: 'h2',
                        content: trimmedLine.substring(4)
                    });
                    i++;
                    continue;
                }

                // 分隔线（>=3个连续短横线）
                if (/^-{3,}$/.test(trimmedLine)) {
                    // 如果正在处理列表，先结束列表
                    if (inList) {
                        contentBlocks.push({
                            type: 'ul',
                            content: currentList
                        });
                        inList = false;
                        currentList = [];
                    }
                    contentBlocks.push({
                        type: 'divider'
                    });
                    i++;
                    continue;
                }

                // 无序列表项
                if (trimmedLine.startsWith('- ') || trimmedLine.startsWith('* ')) {
                    if (!inList) {
                        inList = true;
                        currentList = [];
                    }
                    // 清理末尾标点后再存入
                    const cleanItem = trimmedLine.substring(2).trim();
                    currentList.push(cleanItem);
                    i++;
                    continue;
                }

                // 列表中的空行：跳过，但不结束当前列表
                if (inList && !trimmedLine) {
                    i++;
                    continue;
                }

                // 结束列表
                if (inList) {
                    contentBlocks.push({
                        type: 'ul',
                        content: currentList
                    });
                    inList = false;
                    currentList = [];
                    // 不 continue，让当前行继续被其他块类型处理
                }

                // 普通段落
                if (trimmedLine) {
                    // 检测活动卡片：二维码卡片 + 渐变小长条 + 淘口令
                    const activityCardMatch = trimmedLine.match(/^活动卡片：(.*)$/);
                    if (activityCardMatch) {
                        const activitySpec = parseActivityCardSpec(activityCardMatch[1]);
                        contentBlocks.push({
                            type: 'activity-card',
                            ...activitySpec
                        });
                        i++;
                        continue;
                    }

                    // 检测商品小卡片：仅保留二维码卡片
                    const compactProductCardMatch = trimmedLine.match(/^商品小卡片：(.*)$/);
                    if (compactProductCardMatch) {
                        const productName = normalizeProductImageName(compactProductCardMatch[1]);
                        contentBlocks.push({
                            type: 'product-card',
                            productName: productName,
                            compact: true
                        });
                        i++;
                        continue;
                    }

                    // 检测商品卡片
                    const productCardMatch = trimmedLine.match(/^商品卡片：(.*)$/);
                    if (productCardMatch) {
                        let productName = productCardMatch[1];
                        
                        // 提取淘口令
                        const taoMatch = productName.match(/(77《[^》]+》.*?)(\s+https?:\/\/s\.tb\.cn\/)?$/);
                        if (taoMatch && taoMatch[1]) {
                            currentTaoKouLing = taoMatch[1].trim();
                        }
                        
                        // 去掉图片扩展名和【】用于匹配
                        productName = normalizeProductImageName(productName);
                        
                        contentBlocks.push({
                            type: 'product-card',
                            productName: productName
                        });
                        i++;
                        continue;
                    }
                    
                    // 检测并排图片：【图1】|【图2】 或 【图1】｜【图2】｜【图3】
                    const sideBySideMatch = trimmedLine.match(/^【([^【】]+)】[|｜]【([^【】]+)】(?:[|｜]【([^【】]+)】)?$/);
                    if (sideBySideMatch) {
                        const images = [];
                        for (let j = 1; j <= 3; j++) {
                            if (!sideBySideMatch[j]) continue;
                            const refText = sideBySideMatch[j].trim();
                            const matched = findImageByReference(refText);
                            if (matched) {
                                images.push({
                                    filename: matched.filename, dataUrl: matched.dataUrl,
                                    width: matched.width, height: matched.height,
                                    mimeType: matched.mimeType, displayName: matched.displayName, alt: refText
                                });
                                incrementImageUseCount(matched.filename);
                            } else {
                                images.push({ placeholder: true, text: refText });
                            }
                        }
                        contentBlocks.push({ type: 'side-by-side-images', images });
                        i++;
                        continue;
                    }

                    // 检测【图1】、【动图演示】等图片引用
                    const imageRefMatch = trimmedLine.match(/^【([^【】]+)】$/);
                    if (imageRefMatch) {
                        const refText = imageRefMatch[1].trim();
                        const matchedImg = findImageByReference(refText);
                        if (matchedImg) {
                            // 检查下一行是否是图片标注
                            let caption = null;
                            if (i + 1 < rawLines.length) {
                                const nextLine = rawLines[i + 1].trim();
                                const captionMatch = nextLine.match(/^｜｜(.+)｜｜$/);
                                if (captionMatch) {
                                    caption = captionMatch[1].trim();
                                    i++; // 跳过标注行
                                }
                            }
                            contentBlocks.push({
                                type: 'referenced-image',
                                filename: matchedImg.filename,
                                dataUrl: matchedImg.dataUrl,
                                width: matchedImg.width,
                                height: matchedImg.height,
                                mimeType: matchedImg.mimeType,
                                displayName: matchedImg.displayName,
                                alt: refText,
                                caption: caption
                            });
                            incrementImageUseCount(matchedImg.filename);
                        } else {
                            contentBlocks.push({
                                type: 'image-placeholder',
                                text: refText
                            });
                        }
                        i++;
                        continue;
                    }
                    
                    // 检测图片标注语法：｜｜文字｜｜（独立一行，作为前一个图片的标注）
                    const imageCaptionMatch = trimmedLine.match(/^｜｜(.+)｜｜$/);
                    if (imageCaptionMatch) {
                        contentBlocks.push({
                            type: 'image-caption',
                            caption: imageCaptionMatch[1].trim()
                        });
                        i++;
                        continue;
                    }
                    
                    // 检测说明文本：▲ 开头（与上方图片紧接，无空行）
                    if (trimmedLine.startsWith('▲ ')) {
                        contentBlocks.push({
                            type: 'caption-note',
                            content: trimmedLine
                        });
                        i++;
                        continue;
                    }
                    
                    contentBlocks.push({
                        type: 'p',
                        content: trimmedLine
                    });
                }
                i++;
            }

            // 处理最后一个列表
            if (inList) {
                contentBlocks.push({
                    type: 'ul',
                    content: currentList
                });
            }

            // 统计一级标题数量
            let h1Counter = 0;
            
            // 第二步：生成块HTML
            function generateBlockHTML(block) {
                switch (block.type) {
                    case 'code-block': {
                        return generateCodeBlockHTML(block.language, block.code);
                    }
                    case 'caption-note': {
                        return `<p style="margin: 0; padding: 0; text-align: center;"><span style="font-size: 12px; color: rgb(136, 136, 136);">${block.content}</span></p>`;
                    }
                    case 'h1': {
                        h1Counter++;
                        
                        // 个人模式：使用虚线样式（只有上下边框）
                        if (isPersonalMode) {
                            // 处理平台标签 [xxx]，使其为 15px 黑色
                            let titleContent = processPlatformTags(block.content);

                            return `<section class="level1-title-dashed personal-mode" style="box-sizing: border-box;font-size: 16px;margin: 20px 0px 20px;float: none !important;padding: 12px 0px;background: transparent;text-align: center;">
                                <section style="display: inline-block;font-weight: 900;color: rgb(43, 43, 43);letter-spacing: 2px;border: none;visibility: visible;text-align: center;box-sizing: border-box;font-size: 20px;border-top: 1.5px dashed rgb(192, 204, 92);border-bottom: 1.5px dashed rgb(192, 204, 92);padding: 8px 20px;min-width: 100px;">
                                    <span leaf="" style="visibility: visible;">${titleContent}</span>
                                </section>
                            </section>`;
                        }
                        
                        // 数码荔枝模式：使用图片
                        const imgIndex = (h1Counter - 1) % titleImages.length;
                        const imgUrl = titleImages[imgIndex];

                        // 处理平台标签 [xxx]，使其为 15px 黑色
                        let titleContent = processPlatformTags(block.content);

                        return `<div class="level1-title">
                            <img src="${imgUrl}" width="50" height="50" alt="标题图标" style="margin-right: 8px;float: none;">
                            <span class="title-text">${titleContent}</span>
                        </div>`;
                    }
                    case 'h2': {
                        // 个人模式小标题：带底色的小标题
                        if (isPersonalMode) {
                            return `<div class="level2-title" style="text-align: center; margin: 20px 0 15px 0;">
                                <section style="display: inline-block; max-width: 92%; padding: 8px 24px; background: linear-gradient(135deg, #c0d860 0%, #9ab94a 100%); color: white; border-radius: 4px; box-sizing: border-box;">
                                    <p style="margin: 0; color: white; font-size: 17px; line-height: 1.8; font-weight: bold; letter-spacing: 2px; text-align: center; word-break: normal; overflow-wrap: break-word;">
                                        ${processInlineFormatting(block.content, true).trim()}
                                    </p>
                                </section>
                            </div>`;
                        }
                        return `<div class="level2-title">
                            <div class="title-box">
                                <div class="title-box-inner">
                                    <div class="title-text">${processInlineFormatting(block.content, true).trim()}</div>
                                </div>
                            </div>
                        </div>`;
                    }
                    case 'product-card': {
                        return generateProductCardHTML(block);
                    }
                    case 'activity-card': {
                        return generateActivityCardHTML(block);
                    }
                    case 'referenced-image': {
                        const captionHTML = block.caption ? `<p style="margin: 0; padding: 0; text-align: center;"><span style="font-size: 12px; color: rgb(136, 136, 136);">${block.caption}</span></p>` : '';
                        const imageStyle = isPersonalMode ? 'width: 100% !important; height: auto !important; border: 2px solid rgb(192, 204, 92); border-style: dashed; padding: 8px; background: #ffffff; box-sizing: border-box; visibility: visible !important;' : 'width: 100% !important; height: auto !important; visibility: visible !important;';
                        const adaptiveAttrs = getWeChatAdaptiveImageAttrs(block);
                        return `<section style="text-align: center; margin: 0; padding: 0;"><img data-src="${block.dataUrl}" class="rich_pages wxw-img" style="${imageStyle}" src="${block.dataUrl}" alt="${block.alt}" ${adaptiveAttrs}>${captionHTML}</section>`;
                    }
                    case 'side-by-side-images': {
                        return generateSideBySideImagesHTML(block.images, false, isPersonalMode);
                    }
                    case 'image-placeholder': {
                        return `<div style="text-align: center; padding: 20px; background: #f5f5f5; border: 1px dashed rgb(192, 204, 92); margin: 10px 0; color: #999; font-size: 14px;">
                            【${block.text}】<span style="color: #e74c3c;">（未找到匹配图片）</span>
                        </div>`;
                    }
                    case 'box': {
                        let innerContent = block.content;
                        const lines = innerContent.split('\n');
                        let boxHTML = '<div class="link-box">';

                        // 检查第一行是否是反引号包裹的内联代码格式
                        const inlineCodePattern = /^`([^`]+)`$/;
                        let hasInlineCode = false;
                        let inlineCodeContent = '';

                        if (lines.length === 1) {
                            const match = lines[0].match(inlineCodePattern);
                            if (match) {
                                hasInlineCode = true;
                                inlineCodeContent = match[1];
                            }
                        }

                        // 查找第一行的标签和后续行的URL
                        let label = '';
                        let url = '';
                        let hasUrlInFirstLine = false;
                        let hasLabelWithPath = false;
                        let labelPathContent = '';

                        // 检查第一行是否有标签和URL在同一行
                        const linkReg = /^(.*?)[:：]\s*(http|https):\/\/\S+/;
                        // 检查标签+路径格式（无协议，如：开源地址：github.com/foo/bar）
                        const labelPathReg = /^(.*?)[:：]\s*([^\s]+)$/;
                        const readMoreReg = /阅读原文/;

                        if (lines[0].match(linkReg)) {
                            hasUrlInFirstLine = true;
                            const match = lines[0].match(linkReg);
                            label = match[1].trim();
                            const fullUrl = match[0];
                            url = fullUrl.replace(`${label}：`, '').replace(`${label}:`, '').trim();
                        } else if (!hasInlineCode) {
                            // 检查是否是标签+路径格式（无协议）
                            const labelPathMatch = lines[0].match(labelPathReg);
                            if (labelPathMatch) {
                                const possibleLabel = labelPathMatch[1].trim();
                                const possiblePath = labelPathMatch[2];
                                if (possibleLabel && possiblePath && possiblePath.includes('/')) {
                                    hasLabelWithPath = true;
                                    label = possibleLabel;
                                    labelPathContent = possiblePath;
                                }
                            }
                        }

                        // 查找URL（可能在任意一行）
                        const urlReg = /(http|https):\/\/\S+/;
                        for (let j = 0; j < lines.length; j++) {
                            const urlMatch = lines[j].match(urlReg);
                            if (urlMatch) {
                                url = urlMatch[0];
                                break;
                            }
                        }

                        // 生成内容HTML
                        lines.forEach((line, index) => {
                            let trimmedLine = line.trim();

                            // 如果是反引号包裹的内联代码格式
                            if (hasInlineCode && index === 0) {
                                // 检查内容是否包含带协议的 URL（标签：https://xxx）
                                const urlMatch = inlineCodeContent.match(/^(.*?)[:：]\s*(https?:\/\/\S+)$/);
                                if (urlMatch) {
                                    // 有标签+URL（带协议）：加粗标签，URL 不处理
                                    const label = urlMatch[1].trim();
                                    const url = urlMatch[2];
                                    // 排除 http/https 开头的情况（这种情况没有标签）
                                    if (label === 'http' || label === 'https') {
                                        boxHTML += `<a href="${url}" target="_blank">${url}</a>`;
                                    } else {
                                        const colonMatch = inlineCodeContent.match(/[:：]/);
                                        const originalColon = colonMatch ? colonMatch[0] : ':';
                                        boxHTML += `<span textstyle="" style="letter-spacing: normal; font-weight: bold;">${label}${originalColon}</span>${url}`;
                                    }
                                } else {
                                    // 检查是否有标签+路径格式（标签：xxx/xxx）
                                    const labelPathMatch = inlineCodeContent.match(/^(.*?)[:：]\s*([^\s]+)$/);
                                    if (labelPathMatch) {
                                        const label = labelPathMatch[1].trim();
                                        const path = labelPathMatch[2];
                                        // 排除 http/https 开头的情况（这是纯 URL，没有标签）
                                        if (label === 'http' || label === 'https') {
                                            let protected = inlineCodeContent
                                                .replace(/\//g, '__PROTECTED_SLASH__');
                                            protected = protected
                                                .replace(REGEX_PATTERNS.cnEnBefore, '$1 $2')
                                                .replace(REGEX_PATTERNS.enCnBefore, '$1 $2')
                                                .replace(REGEX_PATTERNS.multiSpace, ' ');
                                            protected = protected
                                                .replace(/__PROTECTED_SLASH__/g, '/');
                                            boxHTML += protected;
                                        } else {
                                            const colonMatch = inlineCodeContent.match(/[:：]/);
                                            const originalColon = colonMatch ? colonMatch[0] : ':';
                                            // 如果路径包含斜杠，说明是路径，需要保护斜杠
                                            if (path.includes('/')) {
                                                boxHTML += `<span textstyle="" style="letter-spacing: normal; font-weight: bold;">${label}${originalColon}</span>${path}`;
                                            } else {
                                                boxHTML += `<span textstyle="" style="letter-spacing: normal; font-weight: bold;">${label}${originalColon}</span>${path}`;
                                            }
                                        }
                                    } else {
                                        // 纯内容（无标签）：保护斜杠
                                        let protected = inlineCodeContent
                                            .replace(/\//g, '__PROTECTED_SLASH__');
                                        protected = protected
                                            .replace(REGEX_PATTERNS.cnEnBefore, '$1 $2')
                                            .replace(REGEX_PATTERNS.enCnBefore, '$1 $2')
                                            .replace(REGEX_PATTERNS.multiSpace, ' ');
                                        protected = protected
                                            .replace(/__PROTECTED_SLASH__/g, '/');
                                        boxHTML += protected;
                                    }
                                }
                                return;
                            }

                            if (index === 0) {
                                if (hasUrlInFirstLine) {
                                    // 第一行有完整标签+URL（带协议）
                                    const match = trimmedLine.match(linkReg);
                                    label = match[1].trim();
                                    url = match[0].replace(`${label}：`, '').replace(`${label}:`, '').trim();
                                    // 排除空标签或 http/https 开头的情况（这种情况没有标签）
                                    if (!label || label === 'http' || label === 'https') {
                                        boxHTML += `<a href="${url}" target="_blank">${url}</a>`;
                                    } else {
                                        const originalColon = match[0].includes(':') && !match[0].includes('：') ? ':' : '：';
                                        boxHTML += `<span textstyle="" style="letter-spacing: normal; font-weight: bold;">${label}${originalColon}</span><a href="${url}" target="_blank">${url}</a>`;
                                    }
                                } else if (hasLabelWithPath) {
                                    // 第一行有标签+路径（无协议）
                                    boxHTML += `<span textstyle="" style="letter-spacing: normal; font-weight: bold;">${label}：</span>${labelPathContent}`;
                                } else if (trimmedLine.endsWith('：') || trimmedLine.endsWith(':')) {
                                    // 第一行只有标签（以冒号结尾的行都加粗）
                                    label = trimmedLine.slice(0, -1); // 去掉冒号作为标签
                                    boxHTML += `<span textstyle="" style="letter-spacing: normal; font-weight: bold;">${trimmedLine}</span>`;
                                } else if (trimmedLine.match(readMoreReg)) {
                                    const cleanContent = trimmedLine.replace(/\s+/g, '');
                                    boxHTML += processInlineFormatting(cleanContent);
                                } else {
                                    boxHTML += processInlineFormatting(trimmedLine);
                                }
                            } else {
                                // 后续行
                                const lineUrlMatch = trimmedLine.match(urlReg);
                                if (lineUrlMatch) {
                                    // 这一行有URL
                                    if (url && index === 1 && label) {
                                        // 如果是第一行后续且有标签，加<br>后直接显示URL
                                        boxHTML += `<br><a href="${lineUrlMatch[0]}" target="_blank">${lineUrlMatch[0]}</a>`;
                                    } else if (url && label) {
                                        // 标签和URL分别在不同行的情况：输出标签（加粗）+ 之前的内容 + URL
                                        boxHTML += `<span textstyle="" style="letter-spacing: normal; font-weight: bold;">${label}：</span>${labelPathContent || ''}<a href="${lineUrlMatch[0]}" target="_blank">${lineUrlMatch[0]}</a>`;
                                    } else if (label) {
                                        // 有标签但URL在后续行：输出标签（加粗）+ URL
                                        boxHTML += `<br><span textstyle="" style="letter-spacing: normal; font-weight: bold;">${label}：</span><a href="${lineUrlMatch[0]}" target="_blank">${lineUrlMatch[0]}</a>`;
                                    } else {
                                        // 当前行是URL但没有标签：直接输出URL（不加处理）
                                        boxHTML += `<br><a href="${lineUrlMatch[0]}" target="_blank">${lineUrlMatch[0]}</a>`;
                                    }
                                } else if (label && labelPathContent) {
                                    // 有标签且有路径内容：输出标签（加粗）+ 路径内容 + 当前行
                                    boxHTML += `<br><span textstyle="" style="letter-spacing: normal; font-weight: bold;">${label}：</span>${labelPathContent}${trimmedLine}`;
                                } else if (label) {
                                    // 有标签但没有路径内容（标签行和内容行分开）：只输出当前行内容（标签已在第一行输出）
                                    boxHTML += `<br>${trimmedLine}`;
                                } else {
                                    boxHTML += '<br>' + processInlineFormatting(trimmedLine);
                                }
                            }
                        });

                        boxHTML += '</div>';
                        return boxHTML;
                    }
                    case 'ul': {
                        const itemCount = block.content.length;
                        const listFontFamily = "mp-quote, 'PingFang SC', -apple-system-font, BlinkMacSystemFont, 'Helvetica Neue', 'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', Arial, sans-serif";
                        const bodyStyle = getBodyTypographyStyle();
                        let listHTML = `<ul style="list-style-type: disc; padding-left: 20px !important; margin: 10px ${typographySettings.marginX}px 10px 0 !important; box-sizing: border-box;" class="list-paddingleft-1" id="wechat-list">`;
                        block.content.forEach((item, index) => {
                            const punct = hasTerminalPunctuation(item) ? '' : ((index === itemCount - 1) ? '。' : '；');
                            listHTML += `<li style="list-style-type: disc; margin-bottom: 6px !important; color: ${bodyStyle.color};"><p style="margin: 0px; text-align: ${bodyStyle.textAlign}; ${bodyStyle.textJustify} line-height: ${bodyStyle.lineHeight}; font-family: ${listFontFamily}; font-size: ${bodyStyle.fontSize}; letter-spacing: ${bodyStyle.letterSpacing}; color: ${bodyStyle.color};">
                                    ${processInlineFormatting(item, true, true)}${punct}
                            </p></li>`;
                        });
                        listHTML += '</ul>';
                        return listHTML;
                    }
                    case 'p': {
                        const bodyStyle = getBodyTypographyStyle();
                        const pFontFamily = isPersonalMode ? "Optima, PingFangSC-light, 'PingFang SC', Georgia, serif" : "mp-quote, 'PingFang SC', -apple-system-font, BlinkMacSystemFont, 'Helvetica Neue', 'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', Arial, sans-serif";
                        return `<p style="margin: ${bodyStyle.margin}; text-align: ${bodyStyle.textAlign}; ${bodyStyle.textJustify} line-height: ${bodyStyle.lineHeight}; font-family: ${pFontFamily}; font-size: ${bodyStyle.fontSize}; letter-spacing: ${bodyStyle.letterSpacing}; color: ${bodyStyle.color};">
                            ${processInlineFormatting(block.content, true, true)}
                        </p>`;
                    }
                    case 'divider': {
                        return `<hr style="border-style: solid; border-width: 1px 0 0; border-color: rgba(0,0,0,0.1); margin: 10px 0;">`;
                    }
                    default:
                        return '';
                }
            }

            // 第三步：拼接HTML并添加空行 - 根据模式选择不同的 header
            let html = '';
            if (includeFixedContent) {
                html += isPersonalMode ? personalHeaderHTML : headerImageHTML;
                // 开头配图下方添加空行（个人模式不需要）
                if (!isPersonalMode) {
                    html += singleBr;
                }
            }

            html += appendRenderedContentBlocks(contentBlocks, generateBlockHTML, { singleBr, doubleBr });

            // 添加底部（根据模式选择）
            if (includeFixedContent) {
                if (isPersonalMode) {
                    html += personalFooterHTML;
                } else {
                    html += footerHTML;
                }
            }

            return html;
        }

        /**
         * 生成微信编辑器专用完整HTML
         * @param {string} markdown - Markdown文本
         * @returns {string} 适合微信编辑器的完整HTML
         */
        function createWeChatFullHTML(markdown, includeFixedContent = true) {
            let rawLines = markdown.split('\n');
            let contentBlocks = [];
            let inList = false;
            let currentList = [];
            let i = 0;
            
            // 获取当前模式对应的空行HTML
            const { singleBr, doubleBr } = getBrHtml(isPersonalMode);
            
            // 解析内容块（支持多行灰色底框）
            while (i < rawLines.length) {
                const line = rawLines[i];
                const trimmedLine = line.trim();

                // 代码块（```语言 开始，``` 结束）
                const codeBlockOpen = trimmedLine.match(/^```(\w*)$/);
                if (codeBlockOpen) {
                    if (inList) {
                        contentBlocks.push({ type: 'ul', content: currentList });
                        inList = false;
                        currentList = [];
                    }
                    const lang = codeBlockOpen[1] || '';
                    const codeLines = [];
                    i++;
                    while (i < rawLines.length) {
                        if (rawLines[i].trim() === '```') { i++; break; }
                        codeLines.push(rawLines[i]);
                        i++;
                    }
                    contentBlocks.push({ type: 'code-block', language: lang, code: codeLines.join('\n') });
                    continue;
                }

                // 多行灰色底框开始（以 ` 开头但不以 ` 结尾）
                if (trimmedLine.startsWith('`') && !trimmedLine.endsWith('`')) {
                    // 如果正在处理列表，先结束列表
                    if (inList) {
                        contentBlocks.push({
                            type: 'ul',
                            content: currentList
                        });
                        inList = false;
                        currentList = [];
                    }
                    let boxLines = [];

                    // 收集开始行（去掉开头的 `）
                    boxLines.push(trimmedLine.slice(1).trim());
                    i++;

                    // 收集中间行，直到遇到以 ` 结尾的行
                    while (i < rawLines.length) {
                        const nextLine = rawLines[i].trim();
                        if (nextLine.endsWith('`')) {
                            boxLines.push(nextLine.slice(0, -1).trim());
                            i++;
                            break;
                        } else {
                            boxLines.push(nextLine);
                            i++;
                        }
                    }
                    
                    contentBlocks.push({
                        type: 'box',
                        content: boxLines.join('\n')
                    });
                    continue;
                }

                // 单行灰色底框
                if (trimmedLine.startsWith('`') && trimmedLine.endsWith('`')) {
                    // 如果正在处理列表，先结束列表
                    if (inList) {
                        contentBlocks.push({
                            type: 'ul',
                            content: currentList
                        });
                        inList = false;
                        currentList = [];
                    }
                    // 保留反引号标记，让渲染时的处理逻辑能正确识别并保护斜杠
                    contentBlocks.push({
                        type: 'box',
                        content: trimmedLine
                    });
                    i++;
                    continue;
                }

                // 大标题 (## )
                if (trimmedLine.startsWith('## ') && !trimmedLine.startsWith('### ')) {
                    // 如果正在处理列表，先结束列表
                    if (inList) {
                        contentBlocks.push({
                            type: 'ul',
                            content: currentList
                        });
                        inList = false;
                        currentList = [];
                    }
                    contentBlocks.push({
                        type: 'h1',
                        content: trimmedLine.substring(3)
                    });
                    i++;
                    continue;
                }

                // 小标题 (### )
                if (trimmedLine.startsWith('### ')) {
                    // 如果正在处理列表，先结束列表
                    if (inList) {
                        contentBlocks.push({
                            type: 'ul',
                            content: currentList
                        });
                        inList = false;
                        currentList = [];
                    }
                    contentBlocks.push({ type: 'h2', content: trimmedLine.substring(4) });
                    i++;
                    continue;
                }

                // 分隔线（>=3个连续短横线）
                if (/^-{3,}$/.test(trimmedLine)) {
                    // 如果正在处理列表，先结束列表
                    if (inList) {
                        contentBlocks.push({
                            type: 'ul',
                            content: currentList
                        });
                        inList = false;
                        currentList = [];
                    }
                    contentBlocks.push({ type: 'divider' });
                    i++;
                    continue;
                }

                if (trimmedLine.startsWith('- ') || trimmedLine.startsWith('* ')) {
                    if (!inList) { inList = true; currentList = []; }
                    // 清理末尾标点后再存入
                    const cleanItem = trimmedLine.substring(2).trim();
                    currentList.push(cleanItem);
                    i++;
                    continue;
                }

                // 列表中的空行：跳过，但不结束当前列表
                if (inList && !trimmedLine) {
                    i++;
                    continue;
                }

                if (inList) {
                    contentBlocks.push({ type: 'ul', content: currentList });
                    inList = false;
                    currentList = [];
                    // 不 continue，让当前行继续被其他块类型处理
                }

                if (trimmedLine) {
                    // 检测活动卡片：二维码卡片 + 渐变小长条 + 淘口令
                    const activityCardMatch = trimmedLine.match(/^活动卡片：(.*)$/);
                    if (activityCardMatch) {
                        const activitySpec = parseActivityCardSpec(activityCardMatch[1]);
                        contentBlocks.push({
                            type: 'activity-card',
                            ...activitySpec
                        });
                        i++;
                        continue;
                    }

                    // 检测商品小卡片：仅保留二维码卡片
                    const compactProductCardMatch = trimmedLine.match(/^商品小卡片：(.*)$/);
                    if (compactProductCardMatch) {
                        const productName = normalizeProductImageName(compactProductCardMatch[1]);
                        contentBlocks.push({
                            type: 'product-card',
                            productName: productName,
                            compact: true
                        });
                        i++;
                        continue;
                    }

                    // 检测商品卡片（支持冒号后无内容的情况）
                    const productCardMatch = trimmedLine.match(/^商品卡片：(.*)$/);
                    if (productCardMatch) {
                        let productName = productCardMatch[1];
                        // 提取淘口令（格式：产品名 淘口令 URL）
                        const taoMatch = productName.match(/(77《[^》]+》.*?)(\s+https?:\/\/s\.tb\.cn\/)?$/);
                        if (taoMatch && taoMatch[1]) {
                            currentTaoKouLing = taoMatch[1].trim();
                        }
                        // 去掉图片扩展名和【】（用于和上传的图片文件名匹配）
                        productName = normalizeProductImageName(productName);
                        contentBlocks.push({
                            type: 'product-card',
                            productName: productName
                        });
                        i++;
                        continue;
                    }
                    
                    // 检测并排图片：【图1】|【图2】 或 【图1】｜【图2】｜【图3】
                    const sideBySideMatch = trimmedLine.match(/^【([^【】]+)】[|｜]【([^【】]+)】(?:[|｜]【([^【】]+)】)?$/);
                    if (sideBySideMatch) {
                        const images = [];
                        for (let j = 1; j <= 3; j++) {
                            if (!sideBySideMatch[j]) continue;
                            const refText = sideBySideMatch[j].trim();
                            const matched = findImageByReference(refText, true);
                            if (matched) {
                                images.push({
                                    filename: matched.filename, dataUrl: matched.dataUrl,
                                    width: matched.width, height: matched.height,
                                    mimeType: matched.mimeType, displayName: matched.displayName, alt: refText
                                });
                            } else {
                                images.push({ placeholder: true, text: refText });
                            }
                        }
                        contentBlocks.push({ type: 'side-by-side-images', images });
                        i++;
                        continue;
                    }

                    // 检测【图1】、【动图演示】等图片引用
                    const imageRefMatch = trimmedLine.match(/^【([^【】]+)】$/);
                    if (imageRefMatch) {
                        const refText = imageRefMatch[1].trim();
                        const matchedImg = findImageByReference(refText, true);
                        if (matchedImg) {
                            // 检查下一行是否是图片标注
                            let caption = null;
                            if (i + 1 < rawLines.length) {
                                const nextLine = rawLines[i + 1].trim();
                                const captionMatch = nextLine.match(/^｜｜(.+)｜｜$/);
                                if (captionMatch) {
                                    caption = captionMatch[1].trim();
                                    i++; // 跳过标注行
                                }
                            }
                            contentBlocks.push({
                                type: 'referenced-image',
                                filename: matchedImg.filename,
                                dataUrl: matchedImg.dataUrl,
                                width: matchedImg.width,
                                height: matchedImg.height,
                                mimeType: matchedImg.mimeType,
                                displayName: matchedImg.displayName,
                                alt: refText,
                                caption: caption
                            });
                        } else {
                            contentBlocks.push({
                                type: 'image-placeholder',
                                text: refText
                            });
                        }
                        i++;
                        continue;
                    }
                    
                    // 检测说明文本：▲ 开头（与上方图片紧接，无空行）
                    if (trimmedLine.startsWith('▲ ')) {
                        contentBlocks.push({
                            type: 'caption-note',
                            content: trimmedLine
                        });
                        i++;
                        continue;
                    }
                    
                    contentBlocks.push({ type: 'p', content: trimmedLine });
                }
                i++;
            }
            
            if (inList) contentBlocks.push({ type: 'ul', content: currentList });
            
            // 统计一级标题数量
            let h1Counter = 0;

            // 生成微信专用块HTML
            function generateWeChatBlockHTML(block) {
                switch (block.type) {
                    case 'code-block': {
                        return generateCodeBlockHTML(block.language, block.code);
                    }
                    case 'caption-note': {
                        return `<p style="margin: 0; padding: 0; text-align: center;"><span style="font-size: 12px; color: rgb(136, 136, 136);">${block.content}</span></p>`;
                    }
                    case 'h1': {
                        h1Counter++;

                        // 个人模式：使用虚线样式（只有上下边框）
                        if (isPersonalMode) {
                            // 处理平台标签 [xxx]，使其为 15px 黑色
                            let titleContent = processPlatformTags(block.content);

                            return `<section class="level1-title-dashed personal-mode" style="box-sizing: border-box;font-size: 16px;margin: 20px 0px 20px;float: none !important;padding: 12px 0px;background: transparent;text-align: center;">
                                <section style="display: inline-block;font-weight: 900;color: rgb(43, 43, 43);letter-spacing: 2px;border: none;visibility: visible;text-align: center;box-sizing: border-box;font-size: 20px;border-top: 1.5px dashed rgb(192, 204, 92);border-bottom: 1.5px dashed rgb(192, 204, 92);padding: 8px 20px;min-width: 100px;">
                                    <span leaf="" style="visibility: visible;">${titleContent}</span>
                                </section>
                            </section>`;
                        }

                        // 数码荔枝模式：使用图片
                        const imgIndex = (h1Counter - 1) % titleImages.length;
                        const imgUrl = titleImages[imgIndex];

                        // 处理平台标签 [xxx]，使其为 15px 黑色
                        let titleContent = processPlatformTags(block.content);

                        const titleHTML = `<p style="white-space: normal;text-align: left;margin-bottom: 0px;float: none !important;">
                            <span leaf="">
                                <img data-src="${imgUrl}" class="rich_pages wxw-img" data-ratio="1" data-s="300,640" data-type="png" data-w="79" style="width: 50px !important; height: auto !important; visibility: visible !important; float: none !important; margin-right: 8px;" src="${imgUrl}&amp;tp=webp&amp;wxfrom=5&amp;wx_lazy=1" _width="50px" alt="标题图标">
                            </span>
                            <span style="font-size: 16px;color: rgb(33, 150, 243);font-weight: bold;float: none !important;display: inline;">
                                ${titleContent}
                            </span>
                            <span leaf=""><br></span>
                        </p>`;
                    
                        return titleHTML;
                    }
                    case 'h2': {
                        // 个人模式小标题：带底色的小标题
                        if (isPersonalMode) {
                            return `<section style="text-align: center; margin: 20px 0 15px 0;">
                                <section style="display: inline-block; max-width: 92%; padding: 8px 24px; background: linear-gradient(135deg, #c0d860 0%, #9ab94a 100%); color: white; border-radius: 4px; box-sizing: border-box;">
                                    <p style="margin: 0; color: white; font-size: 17px; line-height: 1.8; font-weight: bold; letter-spacing: 2px; text-align: center; word-break: normal; overflow-wrap: break-word;">
                                        ${processInlineFormatting(block.content, true).trim()}
                                    </p>
                                </section>
                            </section>`;
                        }
                        const titleContent = processInlineFormatting(block.content, true).trim();
                        const titleHTML = `<section style="box-sizing: border-box;font-size: 16px;margin: 6px 0px 0px;text-align: center;float: none !important;">
                            <section style="display: inline-block;max-width: 92%;vertical-align: top;background-color: rgb(51, 173, 255);box-sizing: border-box;">
                                <section style="display: inline-block;max-width: 100%;vertical-align: top;background-color: rgb(39, 218, 241);box-sizing: border-box;transform: translate(-6px, -6px);padding: 0px 10px;">
                                    <p style="box-sizing: border-box;text-align: center;margin: 0px;font-size: 15px;color: rgb(242, 249, 255);line-height: 2;font-weight: bold;word-break: normal;overflow-wrap: break-word;">
                                        <span leaf="">${titleContent}</span>
                                    </p>
                                </section>
                            </section>
                        </section>`;
                    
                        // 不在标题内部添加空行，由外部统一控制
                        return titleHTML;
                    }
                    case 'product-card': {
                        return generateProductCardHTML(block);
                    }
                    case 'activity-card': {
                        return generateActivityCardHTML(block);
                    }
                    case 'referenced-image': {
                        if (isGifImageBlock(block)) {
                            return createGifPlaceholderHTML(block);
                        }
                        const captionHTML = block.caption ? `<p style="margin: 0; padding: 0; text-align: center;"><span style="font-size: 12px; color: rgb(136, 136, 136);">${block.caption}</span></p>` : '';
                        const imageStyle = isPersonalMode ? 'width: 100% !important; height: auto !important; border: 2px solid rgb(192, 204, 92); border-style: dashed; padding: 8px; background: #ffffff; box-sizing: border-box; visibility: visible !important;' : 'width: 100% !important; height: auto !important; visibility: visible !important;';
                        const adaptiveAttrs = getWeChatAdaptiveImageAttrs(block);
                        return `<section style="text-align: center; margin: 0; padding: 0;"><img data-src="${block.dataUrl}" class="rich_pages wxw-img" style="${imageStyle}" src="${block.dataUrl}" alt="${block.alt}" ${adaptiveAttrs}>${captionHTML}</section>`;
                    }
                    case 'side-by-side-images': {

                        const inlineCodePattern = /^`([^`]+)`$/;
                        let hasInlineCode = false;
                        let inlineCodeContent = '';

                        if (lines.length === 1) {
                            const match = lines[0].match(inlineCodePattern);
                            if (match) {
                                hasInlineCode = true;
                                inlineCodeContent = match[1];

                            // 检查标签+路径格式（无协议，如：开源地址：github.com/foo/bar）
                            const labelPathReg = /^(.*?)[:：]\s*([^\s]+)$/;

                            if (labelPathMatch) {
                                const possibleLabel = labelPathMatch[1].trim();
                                const possiblePath = labelPathMatch[2];
                                if (possibleLabel && possiblePath && possiblePath.includes('/')) {

                        // 生成内容HTML

                                const urlMatch = inlineCodeContent.match(/^(.*?)[:：]\s*(https?:\/\/\S+)$/);
                                if (urlMatch) {
                                    // 有标签+URL（带协议）：加粗标签，URL 不处理
                                    const label = urlMatch[1].trim();
                                    const url = urlMatch[2];
                                    // 排除 http/https 开头的情况（这种情况没有标签）
                                    if (label === 'http' || label === 'https') {
                                        boxContentHTML += `<a href="${url}" target="_blank">${url}</a>`;
                                    } else {
                                        const colonMatch = inlineCodeContent.match(/[:：]/);
                                        const originalColon = colonMatch ? colonMatch[0] : ':';
                                        boxContentHTML += `<span leaf="" style="font-weight: bold !important;">${label}${originalColon}</span>${url}`;
                                    }
                                } else {
                                    // 检查是否有标签+路径格式（标签：xxx/xxx）
                                    const labelPathMatch = inlineCodeContent.match(/^(.*?)[:：]\s*([^\s]+)$/);

                                        const label = labelPathMatch[1].trim();
                                        const path = labelPathMatch[2];
                                        // 排除 http/https 开头的情况（这是纯 URL，没有标签）
                                        if (label === 'http' || label === 'https') {
                                            let protected = inlineCodeContent
                                                .replace(/\//g, '__PROTECTED_SLASH__');
                                            protected = protected
                                                .replace(REGEX_PATTERNS.cnEnBefore, '$1 $2')
                                                .replace(REGEX_PATTERNS.enCnBefore, '$1 $2')
                                                .replace(REGEX_PATTERNS.multiSpace, ' ');
                                            protected = protected
                                                .replace(/__PROTECTED_SLASH__/g, '/');
                                            boxContentHTML += protected;
                                        } else {
                                            const colonMatch = inlineCodeContent.match(/[:：]/);
                                            const originalColon = colonMatch ? colonMatch[0] : ':';
                                            boxContentHTML += `<span leaf="" style="font-weight: bold !important;">${label}${originalColon}</span>${path}`;
                                        }
                                    } else {
                                        // 纯内容（无标签）：保护斜杠
                                        let protected = inlineCodeContent
                                            .replace(/\//g, '__PROTECTED_SLASH__');
                                        protected = protected
                                            .replace(REGEX_PATTERNS.cnEnBefore, '$1 $2')
                                            .replace(REGEX_PATTERNS.enCnBefore, '$1 $2')
                                            .replace(REGEX_PATTERNS.multiSpace, ' ');
                                        protected = protected
                                            .replace(/__PROTECTED_SLASH__/g, '/');
                                        boxContentHTML += protected;
                                    }
                                }
                                return;
                            }

                            if (index === 0) {
                                if (hasUrlInFirstLine) {
                                    const match = trimmedLine.match(linkReg);
                                    label = match[1].trim();
                                    const url = match[0].replace(`${label}：`, '').replace(`${label}:`, '').trim();
                                    // 排除空标签或 http/https 开头的情况（这种情况没有标签）
                                    if (!label || label === 'http' || label === 'https') {
                                        boxContentHTML += `<a href="${url}" target="_blank">${url}</a>`;
                                    } else {
                                        const originalColon = match[0].includes(':') && !match[0].includes('：') ? ':' : '：';
                                        boxContentHTML += `<span leaf="" style="font-weight: bold !important;">${label}${originalColon}</span>${url}`;
                                    }
                                } else if (hasLabelWithPath) {
                                    // 标签+路径（无协议）
                                    boxContentHTML += `<span leaf="" style="font-weight: bold !important;">${label}：</span>${labelPathContent}`;
                                } else if (trimmedLine.endsWith('：') || trimmedLine.endsWith(':')) {
                                    label = trimmedLine.slice(0, -1); // 去掉冒号作为标签

                                } else if (trimmedLine.match(readMoreReg)) {

                            } else {

                                    boxContentHTML += `<br><span leaf="" style="font-weight: bold !important;">${lineUrlMatch[1].trim()}：</span>${lineUrlMatch[0].replace(lineUrlMatch[1], '').replace(/[:：]\s*/, '')}`;
                                } else if (label && labelPathContent) {
                                    // 有标签且有路径内容：输出标签（加粗）+ 路径内容 + 当前行
                                    boxContentHTML += `<br><span leaf="" style="font-weight: bold !important;">${label}：</span>${labelPathContent}${trimmedLine}`;
                                } else if (label) {

                                    boxContentHTML += `<br>${trimmedLine}`;
                                } else {
                                    boxContentHTML += '<br>' + processInlineFormatting(trimmedLine);
                                }
                            }
                        });

                        return `<section style="white-space: normal;box-sizing: border-box;font-size: 16px;margin-bottom: 0px;">

        /**
         * 剪贴板只接受字符串；如果误传数组，浏览器会把它转成逗号分隔字符，粘贴后就会变成乱码。
         */
        function normalizeClipboardHtml(content) {
            if (Array.isArray(content)) {
                console.warn('复制内容被传入数组，已自动合并为 HTML 字符串。', content);
                return content.join('');
            }
            if (content === null || content === undefined) return '';
            return String(content);
        }

        function decodeHtmlEntities(text) {
            const parser = document.createElement('textarea');
            parser.innerHTML = text;
            return parser.value;
        }

        function createClipboardPlainText(html) {
            const lightText = normalizeClipboardHtml(html)
                .replace(/<img\b[^>]*>/gi, '[图片]')
                .replace(/<br\s*\/?>/gi, '\n')
                .replace(/<\/(?:p|div|section|li|tr|h[1-6])>/gi, '\n')
                .replace(/<[^>]+>/g, '')
                .replace(/\n[ \t]+/g, '\n')
                .replace(/[ \t]+\n/g, '\n')
                .replace(/\n{3,}/g, '\n\n')
                .trim();
            return decodeHtmlEntities(lightText);
        }

        /**
         * 富文本复制到剪贴板
         * @param {string} html - 需要复制的HTML内容
         */
        function copyAsRichText(html, successMessage = '内容已复制到剪贴板，可直接粘贴到微信公众号编辑器！') {
            // 复制前将 GitHub 链接替换为微信链接
            const htmlForWeChat = normalizeClipboardHtml(replaceImageLinks(normalizeClipboardHtml(html), true));
            const plainTextForClipboard = createClipboardPlainText(htmlForWeChat);
            
            const container = document.getElementById('copy-container');
            container.innerHTML = htmlForWeChat;
            
            // 创建选区
            const range = document.createRange();
            range.selectNodeContents(container);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);

            try {
                // 尝试execCommand复制
                let successful = document.execCommand('copy');
                if (!successful) {
                    throw new Error('execCommand copy failed');
                }
                showStatus(successMessage, 'success');
            } catch (err) {
                // 降级使用Clipboard API
                navigator.clipboard.write([
                    new ClipboardItem({
                        'text/html': new Blob([htmlForWeChat], { type: 'text/html' }),
                        'text/plain': new Blob([plainTextForClipboard], { type: 'text/plain' })
                    })
                ]).then(() => {
                    showStatus(successMessage, 'success');
                }).catch(err => {
                    console.error('复制失败: ', err);
                    showStatus('复制失败，请尝试手动复制右侧预览内容', 'error');
                });
            } finally {
                selection.removeAllRanges();
            }
        }

        /**
         * 显示状态提示消息（小窗口形式）
         * @param {string} message - 提示消息
         * @param {string} type - 类型：success/error/info/warning
         */
        function showStatus(message, type = 'info') {
            const container = document.getElementById('status-container');
            const statusKey = message.startsWith('正在处理图片') ? 'image-progress' : '';
            let item = statusKey ? container.querySelector(`[data-status-key="${statusKey}"]`) : null;

            if (!item) {
                item = document.createElement('div');
                item.className = `status-item ${type}`;
                if (statusKey) item.dataset.statusKey = statusKey;
                container.prepend(item);
                requestAnimationFrame(() => item.classList.add('show'));
            } else {
                item.className = `status-item ${type} show`;
            }

            item.textContent = message;
            clearTimeout(item._statusTimer);

            // 最多保留4条，避免挡住编辑区
            const items = container.querySelectorAll('.status-item');
            if (items.length > 4) {
                removeStatusItem(items[items.length - 1]);
            }

            const duration = type === 'error' ? 5200 : 3200;
            item._statusTimer = setTimeout(() => removeStatusItem(item), duration);
        }

        function removeStatusItem(item) {
            if (!item || !item.parentNode) return;
            clearTimeout(item._statusTimer);
            item.classList.add('removing');
            setTimeout(() => {
                if (item.parentNode) item.remove();
            }, 220);
        }

        /**

        async function copyToClipboard(includeFixedContent = true) {
            await ensureDefaultProductImagesForCopy();

            // 先调整需要处理的图片尺寸
            const filenames = Object.keys(uploadedImages);
            let processed = 0;
            const total = filenames.length;

            for (const filename of filenames) {
                const img = uploadedImages[filename];
                // QR替换过的图片或GIF不处理
                if (img.qrReplaced || img.displayName.toLowerCase().endsWith('.gif')) {
                    processed++;
                    continue;
                }
                // 仅限制图片尺寸并更新 displayDataUrl
                const processedImage = await compressImageForCopy(img.originalDataUrl, true);
                img.displayDataUrl = processedImage.dataUrl;
                if (processedImage.width && processedImage.height) {
                    img.width = processedImage.width;
                    img.height = processedImage.height;
                    img.mimeType = processedImage.mimeType;
                }
                processed++;
                const progress = Math.round((processed / total) * 100);
                showStatus(`正在处理图片：${progress}%`, 'info');
            }

            // 复制
            const markdown = document.getElementById('markdown-input').value;
            await ensureActivityCardsForMarkdown(markdown);

        function replaceMarkdownMarker(fromMarker, toMarker, label) {
            const textarea = document.getElementById('markdown-input');
            const original = textarea.value;
            const replaced = original.split(fromMarker).join(toMarker);
            if (replaced === original) {
                showStatus(`没有找到 ${fromMarker} 标记`, 'warning');
                return;
            }
            textarea.value = replaced;
            saveDraftNow();
            immediateUpdatePreview();
            showStatus(`已完成${label}`, 'success');
        }
