                        contentBlocks.push({
                            type: currentListType,
                            content: currentList
                        });
                        inList = false;
                        currentList = [];
                        currentListType = 'ul';
                    }
                    contentBlocks.push({ type: 'h2', content: trimmedLine.substring(4) });
                    i++;
                    continue;
                }

                // Markdown 表格：表头行 + 分隔行
                if (isMarkdownTableStart(rawLines, i)) {
                    if (inList) {
                        contentBlocks.push({
                            type: currentListType,
                            content: currentList
                        });
                        inList = false;
                        currentList = [];
                        currentListType = 'ul';
                    }
                    const tableResult = parseMarkdownTableBlock(rawLines, i);
                    contentBlocks.push(tableResult.block);
                    i = tableResult.nextIndex;
                    continue;
                }

                // 分隔线（>=3个连续短横线）
                if (/^-{3,}$/.test(trimmedLine)) {
                    // 如果正在处理列表，先结束列表
                    if (inList) {
                        contentBlocks.push({
                            type: currentListType,
                            content: currentList
                        });
                        inList = false;
                        currentList = [];
                        currentListType = 'ul';
                    }
                    contentBlocks.push({ type: 'divider' });
                    i++;
                    continue;
                }

                const listItem = getListItemMatch(trimmedLine);
                if (listItem) {
                    if (!inList || currentListType !== listItem.type) {
                        if (inList) {
                            contentBlocks.push({ type: currentListType, content: currentList });
                        }
                        inList = true;
                        currentList = [];
                        currentListType = listItem.type;
                    }
                    currentList.push(listItem.content);
                    i++;
                    continue;
                }

                // 列表中的空行：跳过，但不结束当前列表
                if (inList && !trimmedLine) {
                    i++;
                    continue;
                }

                if (inList) {
                    contentBlocks.push({ type: currentListType, content: currentList });
                    inList = false;
                    currentList = [];
                    currentListType = 'ul';
                    // 不 continue，让当前行继续被其他块类型处理
                }

                if (trimmedLine) {
                    // 检测活动卡片：二维码卡片 + 渐变小长条 + 淘口令
                    const activityCardMatch = trimmedLine.match(/^活动卡片：(.*)$/);
                    if (activityCardMatch) {
                        const activitySpec = parseActivityCardSpec(activityCardMatch[1]);
                        contentBlocks.push({
                            type: 'activity-card',
                            ...activitySpec
                        });
                        i++;
                        continue;
                    }

                    // 检测商品小卡片：仅保留二维码卡片
                    const compactProductCardMatch = trimmedLine.match(/^商品小卡片：(.*)$/);
                    if (compactProductCardMatch) {
                        const productName = normalizeProductImageName(compactProductCardMatch[1]);
                        contentBlocks.push({
                            type: 'product-card',
                            productName: productName,
                            compact: true
                        });
                        i++;
                        continue;
                    }

                    // 检测商品卡片（支持冒号后无内容的情况）
                    const productCardMatch = trimmedLine.match(/^商品卡片：(.*)$/);
                    if (productCardMatch) {
                        let productName = productCardMatch[1];
                        // 提取淘口令（格式：产品名 淘口令 URL）
                        const taoMatch = productName.match(/(77《[^》]+》.*?)(\s+https?:\/\/s\.tb\.cn\/)?$/);
                        if (taoMatch && taoMatch[1]) {
                            currentTaoKouLing = taoMatch[1].trim();
                        }
                        // 去掉图片扩展名和【】（用于和上传的图片文件名匹配）
                        productName = normalizeProductImageName(productName);
                        contentBlocks.push({
                            type: 'product-card',
                            productName: productName
                        });
                        i++;
                        continue;
                    }

                    // 检测特殊图片语法：不可选中：【图1】、无缝拼接：【图1】｜【图2】｜……
                    const specialImageSyntax = parseSpecialImageSyntax(trimmedLine);
                    if (specialImageSyntax) {
                        if (specialImageSyntax.mode === 'seamless') {
                            const images = specialImageSyntax.refs.map((refText) => {
                                const matched = findImageByReference(refText, true);
                                if (!matched) return { placeholder: true, text: refText };
                                return {
                                    filename: matched.filename, dataUrl: matched.dataUrl,
                                    width: matched.width, height: matched.height,
                                    mimeType: matched.mimeType, displayName: matched.displayName, alt: refText
                                };
                            });
                            contentBlocks.push({ type: 'seamless-images', images });
                        } else {
                            const matchedImg = findImageByReference(specialImageSyntax.refText, true);
                            if (matchedImg) {
                                let caption = null;
                                if (i + 1 < rawLines.length) {
                                    const nextLine = rawLines[i + 1].trim();
                                    const captionMatch = nextLine.match(/^｜｜(.+)｜｜$/);
                                    if (captionMatch) {
                                        caption = captionMatch[1].trim();
                                        i++;
                                    }
                                }
                                contentBlocks.push(buildReferencedImageBlock(matchedImg, specialImageSyntax.refText, {
                                    caption,
                                    specialMode: specialImageSyntax.mode
                                }));
                            } else {
                                contentBlocks.push({
                                    type: 'image-placeholder',
                                    text: `${specialImageSyntax.label}：${specialImageSyntax.refText}`
                                });
                            }
                        }
                        i++;
                        continue;
                    }
                    
                    // 检测并排图片：【图1】|【图2】 或 【图1】｜【图2】｜【图3】
                    const sideBySideMatch = trimmedLine.match(/^【([^【】]+)】\s*[|｜]\s*【([^【】]+)】(?:\s*[|｜]\s*【([^【】]+)】)?$/);
                    if (sideBySideMatch) {
                        const images = [];
                        for (let j = 1; j <= 3; j++) {
                            if (!sideBySideMatch[j]) continue;
                            const refText = sideBySideMatch[j].trim();
                            const matched = findImageByReference(refText, true);
                            if (matched) {
                                images.push({
                                    filename: matched.filename, dataUrl: matched.dataUrl,
                                    width: matched.width, height: matched.height,
                                    mimeType: matched.mimeType, displayName: matched.displayName, alt: refText
                                });
                            } else {
                                images.push({ placeholder: true, text: refText });
                            }
                        }
                        contentBlocks.push({ type: 'side-by-side-images', images });
                        i++;
                        continue;
                    }

                    // 检测【图1】、【动图演示】等图片引用
                    const imageRefMatch = trimmedLine.match(/^【([^【】]+)】$/);
                    if (imageRefMatch) {
                        const refText = imageRefMatch[1].trim();
                        const matchedImg = findImageByReference(refText, true);
                        if (matchedImg) {
                            // 检查下一行是否是图片标注
                            let caption = null;
                            if (i + 1 < rawLines.length) {
                                const nextLine = rawLines[i + 1].trim();
                                const captionMatch = nextLine.match(/^｜｜(.+)｜｜$/);
                                if (captionMatch) {
                                    caption = captionMatch[1].trim();
                                    i++; // 跳过标注行
                                }
                            }
                            contentBlocks.push({
                                ...buildReferencedImageBlock(matchedImg, refText, { caption })
                            });
                        } else {
                            contentBlocks.push({
                                type: 'image-placeholder',
                                text: refText
                            });
                        }
                        i++;
                        continue;
                    }
                    
                    // 检测说明文本：▲ 开头（与上方图片紧接，无空行）
                    if (trimmedLine.startsWith('▲ ')) {
                        contentBlocks.push({
                            type: 'caption-note',
                            content: trimmedLine
                        });
                        i++;
                        continue;
                    }
                    
                    contentBlocks.push({ type: 'p', content: trimmedLine });
                }
                i++;
            }
            
            if (inList) contentBlocks.push({ type: currentListType, content: currentList });
            
            // 统计一级标题数量
            let h1Counter = 0;

            // 生成微信专用块HTML
            function generateWeChatBlockHTML(block) {
                switch (block.type) {
                    case 'code-block': {
                        return generateCodeBlockHTML(block.language, block.code);
                    }
                    case 'caption-note': {
                        return `<p style="margin: 0; padding: 0; text-align: center;"><span style="font-size: 12px; color: rgb(136, 136, 136);">${block.content}</span></p>`;
                    }
                    case 'h1': {
                        h1Counter++;

                        // 个人模式：使用虚线样式（只有上下边框）
                        if (isPersonalMode) {
                            // 处理平台标签 [xxx]，使其为 15px 黑色
                            let titleContent = processPlatformTags(block.content);

                            return `<section class="level1-title-dashed personal-mode" style="box-sizing: border-box;font-size: 16px;margin: 20px 0px 20px;float: none !important;padding: 12px 0px;background: transparent;text-align: center;">
                                <section style="display: inline-block;font-weight: 900;color: rgb(43, 43, 43);letter-spacing: 2px;border: none;visibility: visible;text-align: center;box-sizing: border-box;font-size: 20px;border-top: 1.5px dashed rgb(192, 204, 92);border-bottom: 1.5px dashed rgb(192, 204, 92);padding: 8px 20px;min-width: 100px;">
                                    <span leaf="" style="visibility: visible;">${titleContent}</span>
                                </section>
                            </section>`;
                        }

                        // 数码荔枝模式：使用图片
                        const imgIndex = (h1Counter - 1) % titleImages.length;
                        const imgUrl = titleImages[imgIndex];

                        // 处理平台标签 [xxx]，使其为 15px 黑色
                        let titleContent = processPlatformTags(block.content);

                        const titleHTML = `<p style="white-space: normal;text-align: left;margin-bottom: 0px;float: none !important;">
                            <span leaf="">
                                <img data-src="${imgUrl}" class="rich_pages wxw-img" data-ratio="1" data-s="300,640" data-type="png" data-w="79" style="width: 50px !important; height: auto !important; visibility: visible !important; float: none !important; margin-right: 8px;" src="${imgUrl}&amp;tp=webp&amp;wxfrom=5&amp;wx_lazy=1" _width="50px" alt="标题图标">
                            </span>
                            <span style="font-size: 16px;color: rgb(33, 150, 243);font-weight: bold;float: none !important;display: inline;">
                                ${titleContent}
                            </span>
                            <span leaf=""><br></span>
                        </p>`;
                    
                        return titleHTML;
                    }
                    case 'h2': {
                        // 个人模式小标题：带底色的小标题
                        if (isPersonalMode) {
                            return `<section style="text-align: center; margin: 20px 0 15px 0;">
                                <section style="display: inline-block; max-width: 92%; padding: 8px 24px; background: linear-gradient(135deg, #c0d860 0%, #9ab94a 100%); color: white; border-radius: 4px; box-sizing: border-box;">
                                    <p style="margin: 0; color: white; font-size: 17px; line-height: 1.8; font-weight: bold; letter-spacing: 2px; text-align: center; word-break: normal; overflow-wrap: break-word;">
                                        ${processInlineFormatting(block.content, true).trim()}
                                    </p>
                                </section>
                            </section>`;
                        }
                        const titleContent = processInlineFormatting(block.content, true).trim();
                        const titleHTML = `<section style="box-sizing: border-box;font-size: 16px;margin: 6px 0px 0px;text-align: center;float: none !important;">
                            <section style="display: inline-block;max-width: 92%;vertical-align: top;background-color: rgb(51, 173, 255);box-sizing: border-box;">
                                <section style="display: inline-block;max-width: 100%;vertical-align: top;background-color: rgb(39, 218, 241);box-sizing: border-box;transform: translate(-6px, -6px);padding: 0px 10px;">
                                    <p style="box-sizing: border-box;text-align: center;margin: 0px;font-size: 15px;color: rgb(242, 249, 255);line-height: 2;font-weight: bold;word-break: normal;overflow-wrap: break-word;">
                                        <span leaf="">${titleContent}</span>
                                    </p>
                                </section>
                            </section>
                        </section>`;
                    
                        // 不在标题内部添加空行，由外部统一控制
                        return titleHTML;
                    }
                    case 'product-card': {
                        return generateProductCardHTML(block);
                    }
                    case 'activity-card': {
                        return generateActivityCardHTML(block);
                    }
                    case 'markdown-table': {
                        return renderMarkdownTableHTML(block);
                    }
                    case 'referenced-image': {
                        if (isGifImageBlock(block)) {
                            return createGifPlaceholderHTML(block);
                        }
                        return generateReferencedImageHTML(block);
                    }
                    case 'seamless-images': {
                        return generateSeamlessImagesHTML(block.images, true);
                    }
                    case 'side-by-side-images': {
                        return generateSideBySideImagesHTML(block.images, true, isPersonalMode);
                    }
                    case 'image-placeholder': {
                        return `<div style="text-align: center; padding: 20px; background: #f5f5f5; border: 1px dashed rgb(192, 204, 92); margin: 10px 0; color: #999; font-size: 14px;">
                            【${block.text}】<span style="color: #e74c3c;">（未找到匹配图片）</span>
                        </div>`;
                    }
                    case 'box': {
                        let innerContent = block.content;
                        const lines = innerContent.split('\n');
                        const linkReg = /^(.*?)[:：]\s*(http|https):\/\/\S+/;
                        const readMoreReg = /阅读原文/;

                        // 检查第一行是否是反引号包裹的内联代码格式
                        const inlineCodePattern = /^`([^`]+)`$/;
                        let hasInlineCode = false;
                        let inlineCodeContent = '';

                        if (lines.length === 1) {
                            const match = lines[0].match(inlineCodePattern);
                            if (match) {
                                hasInlineCode = true;
                                inlineCodeContent = match[1];
                            }
                        }

                        let boxContentHTML = '';

                        // 查找第一行的标签和后续行的URL
                        let label = '';
                        let hasUrlInFirstLine = false;
                        let hasLabelWithPath = false;
                        let labelPathContent = '';

                        if (lines[0].match(linkReg)) {
                            hasUrlInFirstLine = true;
                        } else if (!hasInlineCode) {
                            // 检查标签+路径格式（无协议，如：开源地址：github.com/foo/bar）
                            const labelPathReg = /^(.*?)[:：]\s*([^\s]+)$/;
                            const labelPathMatch = lines[0].match(labelPathReg);
                            if (labelPathMatch) {
                                const possibleLabel = labelPathMatch[1].trim();
                                const possiblePath = labelPathMatch[2];
                                if (possibleLabel && possiblePath && possiblePath.includes('/')) {
                                    hasLabelWithPath = true;
                                    label = possibleLabel;
                                    labelPathContent = possiblePath;
                                }
                            }
                        }

                        // 生成内容HTML
                        lines.forEach((line, index) => {
                            let trimmedLine = line.trim();

                            // 如果是反引号包裹的内联代码格式
                            if (hasInlineCode && index === 0) {
                                // 检查内容是否包含带协议的 URL（标签：https://xxx）
                                const urlMatch = inlineCodeContent.match(/^(.*?)[:：]\s*(https?:\/\/\S+)$/);
                                if (urlMatch) {
                                    // 有标签+URL（带协议）：加粗标签，URL 不处理
                                    const label = urlMatch[1].trim();
                                    const url = urlMatch[2];
                                    // 排除 http/https 开头的情况（这种情况没有标签）
                                    if (label === 'http' || label === 'https') {
                                        boxContentHTML += `<a href="${url}" target="_blank">${url}</a>`;
                                    } else {
                                        const colonMatch = inlineCodeContent.match(/[:：]/);
                                        const originalColon = colonMatch ? colonMatch[0] : ':';
                                        boxContentHTML += `<span leaf="" style="font-weight: bold !important;">${label}${originalColon}</span>${url}`;
                                    }
                                } else {
                                    // 检查是否有标签+路径格式（标签：xxx/xxx）
                                    const labelPathMatch = inlineCodeContent.match(/^(.*?)[:：]\s*([^\s]+)$/);
                                    if (labelPathMatch) {
                                        const label = labelPathMatch[1].trim();
                                        const path = labelPathMatch[2];
                                        // 排除 http/https 开头的情况（这是纯 URL，没有标签）
                                        if (label === 'http' || label === 'https') {
                                            let protected = inlineCodeContent
                                                .replace(/\//g, '__PROTECTED_SLASH__');
                                            protected = protected
                                                .replace(REGEX_PATTERNS.cnEnBefore, '$1 $2')
                                                .replace(REGEX_PATTERNS.enCnBefore, '$1 $2')
                                                .replace(REGEX_PATTERNS.multiSpace, ' ');
                                            protected = protected
                                                .replace(/__PROTECTED_SLASH__/g, '/');
                                            boxContentHTML += protected;
                                        } else {
                                            const colonMatch = inlineCodeContent.match(/[:：]/);
                                            const originalColon = colonMatch ? colonMatch[0] : ':';
                                            boxContentHTML += `<span leaf="" style="font-weight: bold !important;">${label}${originalColon}</span>${path}`;
                                        }
                                    } else {
                                        // 纯内容（无标签）：保护斜杠
                                        let protected = inlineCodeContent
                                            .replace(/\//g, '__PROTECTED_SLASH__');
                                        protected = protected
                                            .replace(REGEX_PATTERNS.cnEnBefore, '$1 $2')
                                            .replace(REGEX_PATTERNS.enCnBefore, '$1 $2')
                                            .replace(REGEX_PATTERNS.multiSpace, ' ');
                                        protected = protected
                                            .replace(/__PROTECTED_SLASH__/g, '/');
                                        boxContentHTML += protected;
                                    }
                                }
                                return;
                            }

                            if (index === 0) {
                                if (hasUrlInFirstLine) {
                                    const match = trimmedLine.match(linkReg);
                                    label = match[1].trim();
                                    const url = match[0].replace(`${label}：`, '').replace(`${label}:`, '').trim();
                                    // 排除空标签或 http/https 开头的情况（这种情况没有标签）
                                    if (!label || label === 'http' || label === 'https') {
                                        boxContentHTML += `<a href="${url}" target="_blank">${url}</a>`;
                                    } else {
                                        const originalColon = match[0].includes(':') && !match[0].includes('：') ? ':' : '：';
                                        boxContentHTML += `<span leaf="" style="font-weight: bold !important;">${label}${originalColon}</span>${url}`;
                                    }
                                } else if (hasLabelWithPath) {
                                    // 标签+路径（无协议）
                                    boxContentHTML += `<span leaf="" style="font-weight: bold !important;">${label}：</span>${labelPathContent}`;
                                } else if (trimmedLine.endsWith('：') || trimmedLine.endsWith(':')) {
                                    label = trimmedLine.slice(0, -1); // 去掉冒号作为标签
                                    boxContentHTML += `<span leaf="" style="font-weight: bold !important;">${trimmedLine}</span>`;
                                } else if (trimmedLine.match(readMoreReg)) {
                                    const cleanContent = trimmedLine.replace(/\s+/g, '');
                                    boxContentHTML += processInlineFormatting(cleanContent);
                                } else {
                                    boxContentHTML += processInlineFormatting(trimmedLine);
                                }
                            } else {
                                const lineUrlMatch = trimmedLine.match(linkReg);
                                if (lineUrlMatch) {
                                    boxContentHTML += `<br><span leaf="" style="font-weight: bold !important;">${lineUrlMatch[1].trim()}：</span>${lineUrlMatch[0].replace(lineUrlMatch[1], '').replace(/[:：]\s*/, '')}`;
                                } else if (label && labelPathContent) {
                                    // 有标签且有路径内容：输出标签（加粗）+ 路径内容 + 当前行
                                    boxContentHTML += `<br><span leaf="" style="font-weight: bold !important;">${label}：</span>${labelPathContent}${trimmedLine}`;
                                } else if (label) {
                                    // 有标签但没有路径内容（标签行和内容行分开）：只输出当前行内容（标签已在第一行输出）
                                    boxContentHTML += `<br>${trimmedLine}`;
                                } else {
                                    boxContentHTML += '<br>' + processInlineFormatting(trimmedLine);
                                }
                            }
                        });

                        return `<section style="white-space: normal;box-sizing: border-box;font-size: 16px;margin-bottom: 0px;">
                            <section style="margin: 0 auto;box-sizing: border-box;text-align: center;">
                                <section style="padding: 10px;display: inline-block;width: 556px;border-width: 2px;border-style: none;border-color: rgb(192, 200, 209);background-color: rgb(239, 239, 239);border-radius: 11px;overflow: hidden;box-sizing: border-box;">
                                    <section style="box-sizing: border-box;">

        /**
         * 剪贴板只接受字符串；如果误传数组，浏览器会把它转成逗号分隔字符，粘贴后就会变成乱码。
         */
        function normalizeClipboardHtml(content) {
            if (Array.isArray(content)) {
                console.warn('复制内容被传入数组，已自动合并为 HTML 字符串。', content);
                return content.join('');
            }
            if (content === null || content === undefined) return '';
            return String(content);
        }

        function decodeHtmlEntities(text) {
            const parser = document.createElement('textarea');
            parser.innerHTML = text;
            return parser.value;
        }

        function createClipboardPlainText(html) {
            const lightText = normalizeClipboardHtml(html)
                .replace(/<img\b[^>]*>/gi, '[图片]')
                .replace(/<br\s*\/?>/gi, '\n')
                .replace(/<\/(?:p|div|section|li|tr|h[1-6])>/gi, '\n')
                .replace(/<[^>]+>/g, '')
                .replace(/\n[ \t]+/g, '\n')
                .replace(/[ \t]+\n/g, '\n')
                .replace(/\n{3,}/g, '\n\n')
                .trim();
            return decodeHtmlEntities(lightText);
        }

        /**
         * 富文本复制到剪贴板
         * @param {string} html - 需要复制的HTML内容
         */
        function copyAsRichText(html, successMessage = '内容已复制到剪贴板，可直接粘贴到微信公众号编辑器！') {
            // 复制前将 GitHub 链接替换为微信链接
            const htmlForWeChat = normalizeClipboardHtml(replaceImageLinks(normalizeClipboardHtml(html), true));
            const plainTextForClipboard = createClipboardPlainText(htmlForWeChat);
            
            const container = document.getElementById('copy-container');
            container.innerHTML = htmlForWeChat;
            
            // 创建选区
            const range = document.createRange();
            range.selectNodeContents(container);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);

            try {
                // 尝试execCommand复制
                let successful = document.execCommand('copy');
                if (!successful) {
                    throw new Error('execCommand copy failed');
                }
                showStatus(successMessage, 'success');
            } catch (err) {
                // 降级使用Clipboard API
                navigator.clipboard.write([
                    new ClipboardItem({
                        'text/html': new Blob([htmlForWeChat], { type: 'text/html' }),
                        'text/plain': new Blob([plainTextForClipboard], { type: 'text/plain' })
                    })
                ]).then(() => {
                    showStatus(successMessage, 'success');
                }).catch(err => {
                    console.error('复制失败: ', err);
                    showStatus('复制失败，请尝试手动复制右侧预览内容', 'error');
                });
            } finally {
                selection.removeAllRanges();
            }
        }

        /**
         * 显示状态提示消息（小窗口形式）
         * @param {string} message - 提示消息
         * @param {string} type - 类型：success/error/info/warning
         */
        function showStatus(message, type = 'info') {
            const container = document.getElementById('status-container');
            const statusKey = message.startsWith('正在处理图片') ? 'image-progress' : '';
            let item = statusKey ? container.querySelector(`[data-status-key="${statusKey}"]`) : null;

            if (!item) {
                item = document.createElement('div');
                item.className = `status-item ${type}`;
                if (statusKey) item.dataset.statusKey = statusKey;
                container.prepend(item);
                requestAnimationFrame(() => item.classList.add('show'));
            } else {
                item.className = `status-item ${type} show`;
            }

            item.textContent = message;
            clearTimeout(item._statusTimer);

            // 最多保留4条，避免挡住编辑区
            const items = container.querySelectorAll('.status-item');
            if (items.length > 4) {
                removeStatusItem(items[items.length - 1]);
            }

            const duration = type === 'error' ? 5200 : 3200;
            item._statusTimer = setTimeout(() => removeStatusItem(item), duration);
        }

        function removeStatusItem(item) {
            if (!item || !item.parentNode) return;
            clearTimeout(item._statusTimer);
            item.classList.add('removing');
            setTimeout(() => {
                if (item.parentNode) item.remove();
            }, 220);
        }
        
        /* ==================== 预览与复制 ==================== */

        function normalizeScrollAnchorText(text) {
            return String(text || '')
                .replace(/!\[([^\]]*)\]\([^)]+\)/g, '$1')
                .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
                .replace(/^#{1,6}\s+/, '')
                .replace(/^[-*+]\s+/, '')
                .replace(/^\d+(?:[.)、）])\s*/, '')
                .replace(/^(?:商品小卡片|商品卡片|活动卡片)[:：]\s*/, '')
                .replace(/^｜｜|｜｜$/g, '')
                .replace(/[【】`*_~=<>\s]/g, '')
                .toLowerCase();
        }

        function getScrollAnchorElementText(element) {
            const imageText = Array.from(element.querySelectorAll?.('img') || [])
                .map((img) => `${img.alt || ''}${img.dataset.imgFilename || ''}`)
                .join('');
            return normalizeScrollAnchorText(`${element.textContent || ''}${imageText}`);
        }

        function findBestScrollAnchorElement(block, needle) {
            const candidates = [block, ...block.querySelectorAll('p, li, div, section, span, img, table')];
            let bestMatch = null;
            let bestTextLength = Infinity;

            candidates.forEach((candidate) => {
                const candidateText = candidate.tagName === 'IMG'
                    ? normalizeScrollAnchorText(`${candidate.alt || ''}${candidate.dataset.imgFilename || ''}`)
                    : getScrollAnchorElementText(candidate);
                if (candidateText.includes(needle) && candidateText.length < bestTextLength) {
                    bestMatch = candidate;
                    bestTextLength = candidateText.length;
                }
            });
            return bestMatch;
        }

        function rebuildEditorLineOffsets() {
            if (!scrollSyncMirror) {
                scrollSyncMirror = document.createElement('div');
                scrollSyncMirror.setAttribute('aria-hidden', 'true');
                document.body.appendChild(scrollSyncMirror);
            }

            const styles = getComputedStyle(textarea);
            Object.assign(scrollSyncMirror.style, {
                position: 'fixed',
                visibility: 'hidden',
                pointerEvents: 'none',
                left: '-100000px',
                top: '0',
                width: `${textarea.clientWidth}px`,
                padding: styles.padding,
                border: '0',
                fontFamily: styles.fontFamily,
                fontSize: styles.fontSize,
                fontWeight: styles.fontWeight,
                fontStyle: styles.fontStyle,
                lineHeight: styles.lineHeight,
                letterSpacing: styles.letterSpacing,
                whiteSpace: 'pre-wrap',
                overflowWrap: 'break-word',
                wordBreak: styles.wordBreak,
                boxSizing: 'border-box'
            });

            const fragment = document.createDocumentFragment();
            textarea.value.split('\n').forEach((line) => {
                const lineElement = document.createElement('div');
                lineElement.textContent = line || '\u200b';
                fragment.appendChild(lineElement);
            });
            scrollSyncMirror.replaceChildren(fragment);

            const mirrorTop = scrollSyncMirror.getBoundingClientRect().top;
            return Array.from(scrollSyncMirror.children).map((lineElement) => {
                const rect = lineElement.getBoundingClientRect();
                return {
                    top: rect.top - mirrorTop,
                    center: rect.top - mirrorTop + rect.height / 2
                };
            });
        }

        function rebuildScrollSyncAnchors() {
            const previewContent = document.getElementById('preview-content');
            const previewBlocks = Array.from(document.querySelectorAll('#wx-preview [data-scroll-block-index]'));
            const lineOffsets = rebuildEditorLineOffsets();
            const markdownLines = textarea.value.split('\n');
            const anchors = [];
            let blockCursor = 0;

            markdownLines.forEach((line, lineIndex) => {
                const needle = normalizeScrollAnchorText(line);
                if (needle.length < 2) return;

                for (let blockIndex = blockCursor; blockIndex < previewBlocks.length; blockIndex++) {
                    const matchedElement = findBestScrollAnchorElement(previewBlocks[blockIndex], needle);
                    if (!matchedElement) continue;

                    anchors.push({
                        sourceCenter: lineOffsets[lineIndex]?.center || 0,
                        previewElement: matchedElement
                    });
                    blockCursor = blockIndex;
                    break;
                }
            });

            scrollSyncAnchors = anchors;
            // 读取一次，确保调用方在下一帧同步时能获得更新后的布局。
            void previewContent.scrollHeight;
        }

        function scheduleScrollAnchorRebuild(delay = 120) {
            if (scrollAnchorRebuildTimer) clearTimeout(scrollAnchorRebuildTimer);
            scrollAnchorRebuildTimer = setTimeout(() => {
                scrollAnchorRebuildTimer = null;
                requestAnimationFrame(rebuildScrollSyncAnchors);
            }, delay);
        }

        function getPreviewElementCenter(element, previewContent) {
            const elementRect = element.getBoundingClientRect();
            const previewRect = previewContent.getBoundingClientRect();
            return previewContent.scrollTop
                + elementRect.top - previewRect.top
                + elementRect.height / 2;
        }

        function getScrollSyncPoints(previewContent) {
            const points = [{ source: 0, preview: 0 }];
            scrollSyncAnchors.forEach((anchor) => {
                if (!anchor.previewElement.isConnected) return;
                points.push({
                    source: anchor.sourceCenter,
                    preview: getPreviewElementCenter(anchor.previewElement, previewContent)
                });
            });
            points.push({
                source: textarea.scrollHeight,
                preview: previewContent.scrollHeight
            });
            return points;
        }

        function interpolateScrollPosition(points, value, fromKey, toKey) {
            for (let index = 1; index < points.length; index++) {
                const previous = points[index - 1];
                const next = points[index];
                if (value > next[fromKey]) continue;

                const distance = next[fromKey] - previous[fromKey];
                if (distance <= 0) return next[toKey];
                const progress = Math.max(0, Math.min(1, (value - previous[fromKey]) / distance));
                return previous[toKey] + (next[toKey] - previous[toKey]) * progress;
            }
            return points[points.length - 1][toKey];
        }

        function synchronizeScrollPosition(source, target) {
            const previewContent = document.getElementById('preview-content');
            const points = getScrollSyncPoints(previewContent);
            const sourceScrollableHeight = Math.max(0, source.scrollHeight - source.clientHeight);
            const targetScrollableHeight = Math.max(0, target.scrollHeight - target.clientHeight);

            if (source.scrollTop <= 1) {
                target.scrollTop = 0;
                return;
            }
            if (sourceScrollableHeight > 0 && source.scrollTop >= sourceScrollableHeight - 1) {
                target.scrollTop = targetScrollableHeight;
                return;
            }

            if (scrollSyncAnchors.length < 2) {
                const ratio = sourceScrollableHeight > 0 ? source.scrollTop / sourceScrollableHeight : 0;
                target.scrollTop = ratio * targetScrollableHeight;
                return;
            }

            if (source === textarea) {
                const sourceCenter = textarea.scrollTop + textarea.clientHeight / 2;
                const previewCenter = interpolateScrollPosition(points, sourceCenter, 'source', 'preview');
                previewContent.scrollTop = Math.max(0, previewCenter - previewContent.clientHeight / 2);
            } else {
                const previewCenter = previewContent.scrollTop + previewContent.clientHeight / 2;
                const sourceCenter = interpolateScrollPosition(points, previewCenter, 'preview', 'source');
                textarea.scrollTop = Math.max(0, sourceCenter - textarea.clientHeight / 2);
            }
        }

        function scheduleSynchronizedScroll(source, target) {
            if (isSynchronizingScroll) return;

            if (scrollSyncFrame) {
                cancelAnimationFrame(scrollSyncFrame);
            }

            scrollSyncFrame = requestAnimationFrame(() => {
                isSynchronizingScroll = true;
                synchronizeScrollPosition(source, target);
                scrollSyncFrame = null;

                // 等目标容器的 scroll 事件处理完毕后再解除锁，避免双向监听互相触发。
                requestAnimationFrame(() => {
                    isSynchronizingScroll = false;
                });
            });
        }

        function setupSynchronizedScrolling() {
            const previewContent = document.getElementById('preview-content');

            textarea.addEventListener('scroll', () => {
                scheduleSynchronizedScroll(textarea, previewContent);
            }, { passive: true });

            previewContent.addEventListener('scroll', () => {
                scheduleSynchronizedScroll(previewContent, textarea);
            }, { passive: true });

            window.addEventListener('resize', () => {
                // 仅重建映射；不能在窗口变化时擅自重设用户正在看的预览位置。
                scheduleScrollAnchorRebuild(80);
            });
        }

        function tightenFooterPreviewSpacing() {
            document.querySelectorAll('#wx-preview .footer-jump-image, #wx-preview .footer-img').forEach((el) => {
                el.style.setProperty('margin', '4px 0', 'important');
                el.style.setProperty('line-height', '0');
            });
        }
        
        /**
         * 防抖更新预览（避免输入时频繁更新导致卡顿）
         */
        function debouncedUpdatePreview() {
            if (previewUpdateTimer) {
                clearTimeout(previewUpdateTimer);
            }
            previewUpdateTimer = setTimeout(function() {
                previewUpdateTimer = null;
                // 键入只走快速文本渲染；图片识别和 Canvas 合成留给空闲后的后台任务。
                updatePreview({ deferImagePreparation: true });
            }, PREVIEW_UPDATE_DELAY);
        }
        
        /**
         * 立即更新预览（用于需要立即响应的场景）
         */
        function immediateUpdatePreview() {
            if (previewUpdateTimer) {
                clearTimeout(previewUpdateTimer);
                previewUpdateTimer = null;
            }
            return updatePreview();
        }
        
        function renderPreviewMarkup(markdown) {
            const previewContent = document.getElementById('preview-content');
            const preview = document.getElementById('wx-preview');
            // innerHTML 替换会让滚动容器在内容变短时被浏览器钳到 0。先记住位置，
            // 再恢复到新内容允许的最近位置，避免编辑时无故跳到页头或页尾。
            const previousScrollTop = previewContent.scrollTop;
            preview.innerHTML = markdownToWeChatHTML(markdown);
            previewContent.scrollTop = Math.max(0, Math.min(
                previousScrollTop,
                Math.max(0, previewContent.scrollHeight - previewContent.clientHeight)
            ));
            tightenFooterPreviewSpacing();
            bindPreviewImageBackdropControls();

            const wxArticle = document.querySelector('.wx-article');
            if (isPersonalMode) {
                previewContent.style.background = '#fafafa';
                if (wxArticle) wxArticle.style.backgroundColor = 'transparent';
            } else {
                previewContent.style.background = '#ffffff';
                if (wxArticle) wxArticle.style.backgroundColor = 'white';
            }

            // 锚点测量会遍历所有行和预览块，延迟到用户短暂停止输入后再做。
            scheduleScrollAnchorRebuild();
            document.querySelectorAll('#wx-preview img').forEach((img) => {
                if (!img.complete) {
                    img.addEventListener('load', () => scheduleScrollAnchorRebuild(40), { once: true });
                }
            });
            updatePreviewStats();
            updateImagePreviewUseCounts();
        }

        async function prepareImagesForPreview(markdown, renderVersion) {
            const preparationVersion = ++imagePreparationVersion;
            await ensureActivityCardsForMarkdown(markdown);
            await ensureImageBackdropEligibility(markdown);
            await prepareImageBackdropData(markdown);
            // 只允许最新的一次后台结果刷新预览，防止旧任务覆盖新输入。
            if (renderVersion !== previewRenderVersion
                || preparationVersion !== imagePreparationVersion
                || document.getElementById('markdown-input').value !== markdown) return;
            renderPreviewMarkup(markdown);
        }

        function queueImagePreparation(markdown, renderVersion) {
            if (imagePreparationTimer) clearTimeout(imagePreparationTimer);
            imagePreparationTimer = setTimeout(() => {
                imagePreparationTimer = null;
                prepareImagesForPreview(markdown, renderVersion).catch((error) => {
                    console.warn('图片后台预处理失败，已保留即时预览：', error);
                });
            }, 180);
        }

        /**
         * 更新预览区域内容。文本立即更新，图片合成不阻塞输入。
         */
        async function updatePreview(options = {}) {
            try {
                const renderVersion = ++previewRenderVersion;
                for (const filename of Object.keys(uploadedImages)) uploadedImages[filename].useCount = 0;
                const markdown = document.getElementById('markdown-input').value;
                renderPreviewMarkup(markdown);

                if (options.deferImagePreparation) {
                    queueImagePreparation(markdown, renderVersion);
                    return;
                }
                if (imagePreparationTimer) {
                    clearTimeout(imagePreparationTimer);
                    imagePreparationTimer = null;
                }
                await prepareImagesForPreview(markdown, renderVersion);
            } catch (e) {
                console.error('预览更新失败:', e);
                document.getElementById('wx-preview').innerHTML = `<div style="padding: 20px; color: red;">渲染出错：${e.message}</div>`;
            }
        }

        function bindPreviewImageBackdropControls() {

        let activeBackdropSettingKey = '';
        let activeBackdropContext = '';

        function getActiveBackdropImageRecord() {
            return activeBackdropContext === 'side-by-side'
                ? sideBySideBackdropRecords[activeBackdropFilename]
                : uploadedImages[activeBackdropFilename];
        }

        function getBackdropDialogSettings() {
            const activeSideBySideCount = sideBySideBackdropRecords[activeBackdropFilename]?.imageCount || 2;
            return {
                scale: getImageBackdropScale({ scale: document.getElementById('image-backdrop-scale').value }),
                aspect: document.querySelector('[data-backdrop-dialog-option="aspect"].is-active')?.dataset.value || getImageBackdropAspect(activeBackdropFilename, activeBackdropSettingKey || activeBackdropFilename),
                enabled: document.querySelector('[data-backdrop-dialog-option="enabled"].is-active')?.dataset.value === 'on',
                shadow: document.querySelector('[data-backdrop-dialog-option="shadow"].is-active')?.dataset.value === 'on',
                radius: document.querySelector('[data-backdrop-dialog-option="radius"].is-active')?.dataset.value === 'on',
                radiusSize: getImageBackdropRadiusSize({ radiusSize: document.getElementById('image-backdrop-radius-size').value }),
                background: document.querySelector('[data-backdrop-background].is-active')?.dataset.backdropBackground || 'lizhi',
                ...(activeBackdropContext === 'side-by-side' ? {

                } : {})

        function updateBackdropDialogValues() {
            const scale = getImageBackdropScale({ scale: document.getElementById('image-backdrop-scale').value });
            const radius = getImageBackdropRadiusSize({ radiusSize: document.getElementById('image-backdrop-radius-size').value });
            document.getElementById('image-backdrop-scale').value = scale;
            document.getElementById('image-backdrop-scale-value').textContent = `${scale}%`;
            document.getElementById('image-backdrop-radius-size').value = radius;
            document.getElementById('image-backdrop-radius-value').textContent = `${radius} px`;
            const backdropEnabled = document.querySelector('[data-backdrop-dialog-option="enabled"].is-active')?.dataset.value === 'on';
            const radiusEnabled = backdropEnabled && document.querySelector('[data-backdrop-dialog-option="radius"].is-active')?.dataset.value === 'on';
            const radiusRow = document.getElementById('image-backdrop-radius-row');
            radiusRow.classList.toggle('is-disabled', !radiusEnabled);
            radiusRow.querySelector('input').disabled = !radiusEnabled;
            const background = document.querySelector('[data-backdrop-background].is-active')?.dataset.backdropBackground || 'lizhi';
            const foregroundScalingEnabled = backdropEnabled && background !== 'none';
            ['image-backdrop-scale-row', 'image-backdrop-aspect-row'].forEach((id) => {
                const row = document.getElementById(id);
                row.classList.toggle('is-disabled', !foregroundScalingEnabled);
                row.setAttribute('aria-disabled', foregroundScalingEnabled ? 'false' : 'true');
                row.querySelectorAll('button, input').forEach((control) => {
                    control.disabled = !foregroundScalingEnabled;
                });
            });
        }

        function setBackdropDialogBackground(value) {
            document.querySelectorAll('[data-backdrop-background]').forEach((button) => {
                button.classList.toggle('is-active', button.dataset.backdropBackground === value);
            });

        function scheduleBackdropDialogPreview() {
            cancelAnimationFrame(backdropPreviewFrame);
            backdropPreviewFrame = requestAnimationFrame(renderBackdropDialogPreview);
        }

        function renderBackdropDialogPreview() {
            if (!activeBackdropFilename) return;
            const record = getActiveBackdropImageRecord();
            const sourceDataUrl = record?.rawDataUrl || record?.displayDataUrl || record?.originalDataUrl || '';
            if (!record || !sourceDataUrl) return;
            const settings = getBackdropDialogSettings();
            const stage = document.getElementById('image-backdrop-preview-stage');
            const previewImage = document.getElementById('image-backdrop-preview-image');
            const width = Math.max(1, Number(record.rawWidth || record.width) || 1);
            const height = Math.max(1, Number(record.rawHeight || record.height) || 1);
            stage.style.aspectRatio = settings.aspect === '4:3' ? '4 / 3' : `${width} / ${height}`;
            stage.classList.toggle('is-transparent', settings.background === 'none');
            stage.style.backgroundImage = 'none';
            if (IMAGE_BACKDROP_GRADIENTS[settings.background]) {
                const [from, to] = IMAGE_BACKDROP_GRADIENTS[settings.background];
                stage.style.background = `linear-gradient(135deg, ${from}, ${to})`;
            } else if (settings.background === 'blue') {
                stage.style.background = '#3FB9FF';
            } else if (settings.background === 'lizhi') {
                const assets = window.__IMAGE_BACKDROP_ASSETS__;
                stage.style.backgroundColor = '#8CC6FF';
                stage.style.backgroundImage = `url(${assets.header}), url(${assets.footer})`;
                stage.style.backgroundRepeat = 'no-repeat';
                stage.style.backgroundPosition = 'top center, bottom center';
                stage.style.backgroundSize = '100% auto, 100% auto';
            } else {
                stage.style.background = 'transparent';
            }
            previewImage.src = sourceDataUrl;

            const mode = context === 'product-card' ? 'manual' : image?.backdropMode;

            const fallbackScale = context === 'product-card' ? 90 : (image?.backdropAutoScale || 90);

            document.getElementById('image-backdrop-radius-size').value = getImageBackdropRadiusSize(setting);

            setBackdropDialogValue('aspect', getImageBackdropAspect(filename, activeBackdropSettingKey, {

        /**

         */
        async function copyToClipboard(includeFixedContent = true) {
            await ensureDefaultProductImagesForCopy();

            // 先调整需要处理的图片尺寸
            const filenames = Object.keys(uploadedImages);
            let processed = 0;
            const total = filenames.length;

            for (const filename of filenames) {
                const img = uploadedImages[filename];
                // QR替换过的图片或GIF不处理
                if (img.qrReplaced || img.displayName.toLowerCase().endsWith('.gif')) {
                    processed++;
                    continue;
                }
                // 仅限制图片尺寸并更新 displayDataUrl
                const processedImage = await compressImageForCopy(img.originalDataUrl, true);
                img.displayDataUrl = processedImage.dataUrl;
                if (processedImage.width && processedImage.height) {
                    img.width = processedImage.width;
                    img.height = processedImage.height;
                    img.mimeType = processedImage.mimeType;
                }
                processed++;
                const progress = Math.round((processed / total) * 100);
                showStatus(`正在处理图片：${progress}%`, 'info');
            }

            // 复制
            const markdown = document.getElementById('markdown-input').value;
            await ensureActivityCardsForMarkdown(markdown);
            await prepareImageBackdropData(markdown);
            // 复制预览/正文时同步执行一次打包下载，使用同一份最终图片处理结果。
            await downloadPackageFromOptions();
            const fullHTML = createWeChatFullHTML(markdown, includeFixedContent);
            const successMessage = includeFixedContent

        function replaceMarkdownMarker(fromMarker, toMarker, label) {

                            const prefix = match[1].trim();

                    return line;

                textarea.value = updatedLines.join('\n');

        /**
         * 切换标记（添加/移除包裹符）
         * @param {string} text - 目标文本
         * @param {string} wrapper - 包裹符（如 "==" 或 "`"）
         * @returns {string} 处理后的文本
         */
        function toggleWrapper(text, wrapper) {
            const wrapperLen = wrapper.length;
            // 检查是否已被包裹
            if (text.startsWith(wrapper) && text.endsWith(wrapper)) {
                // 移除包裹符
                return text.substring(wrapperLen, text.length - wrapperLen);
            } else {
                // 添加包裹符
                return wrapper + text + wrapper;
            }
        }

        function toggleCodeBlock(text) {
            const trimmed = text.trim();
            const codeBlockMatch = trimmed.match(/^```[^\n]*\n([\s\S]*?)\n```$/);
            if (codeBlockMatch) {
                return codeBlockMatch[1];
            }
            return `\`\`\`text\n${text.replace(/^\n+|\n+$/g, '')}\n\`\`\``;
        }

        /**
         * 设置快捷键（Cmd+Z 撤销，Cmd+Y 重做）
         */
         function setupShortcuts() {
             textarea.addEventListener('keydown', function(e) {
                 // 撤销/重做
                 if (e.metaKey) {
                    if (e.key.toLowerCase() === 'z') {
                        e.preventDefault();
                        // Cmd+Z：撤销
                        if (undoStack.length > 1) {
                            redoStack.push(this.value);
                            this.value = undoStack.pop();
                            this.selectionStart = this.selectionEnd = this.value.length;
                            immediateUpdatePreview();
                            showStatus('已撤销上一步操作', 'success');
                        } else {
                            showStatus('没有可撤销的操作', 'error');
                        }
                        return;
                    } else if (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z')) {
                        e.preventDefault();
                        // Cmd+Y / Cmd+Shift+Z：重做
                        if (redoStack.length > 0) {
                            undoStack.push(this.value);
                            this.value = redoStack.pop();
                            this.selectionStart = this.selectionEnd = this.value.length;
                            immediateUpdatePreview();
                            showStatus('已重做上一步操作', 'success');
                        } else {
                            showStatus('没有可重做的操作', 'error');
                        }
                        return;
                    }
                }
        
                // 只处理 Cmd+B（加粗）、Cmd+K（行内代码）、Cmd+Shift+K（代码块）、Cmd+E（高亮）、Cmd+U（加粗+高亮）
                if (!e.metaKey || !['b', 'k', 'u', 'e'].includes(e.key.toLowerCase())) {
                    return;
                }
                
                e.preventDefault();
                
                const start = this.selectionStart;
                const end = this.selectionEnd;
                const selectedText = this.value.substring(start, end);
                
                if (selectedText.length === 0) return;
        
                let newText = '';
                let action = '';
                
                // 匹配快捷键
                if (e.key.toLowerCase() === 'b') {
                    // Cmd+B: 加粗 **文本** / 取消加粗
                    if (selectedText.startsWith('**') && selectedText.endsWith('**')) {
                        newText = selectedText.slice(2, -2);
                        action = '取消加粗';
                    } else {
                        newText = '**' + selectedText + '**';
                        action = '加粗';
                    }
                } else if (e.key.toLowerCase() === 'k' && e.shiftKey) {
                    // Cmd+Shift+K: 代码块 ```text ... ``` / 取消代码块
                    newText = toggleCodeBlock(selectedText);
                    action = newText === selectedText ? '取消代码块' : (selectedText.trim().startsWith('```') ? '取消代码块' : '添加代码块');
                } else if (e.key.toLowerCase() === 'k') {
                    // Cmd+K: 行内代码 `文本` / 移除行内代码
                    if (selectedText.startsWith('`') && selectedText.endsWith('`') && !selectedText.startsWith('```')) {
                        newText = selectedText.slice(1, -1);
                        action = '取消行内代码';
                    } else {
                        newText = '`' + selectedText + '`';
                        action = '添加行内代码';
                    }
                } else if (e.key.toLowerCase() === 'u') {
                    // Cmd+U: 加粗+高亮 **==文本==** / 取消
                    if (selectedText.startsWith('**==') && selectedText.endsWith('==**')) {
                        newText = selectedText.slice(4, -4);
                        action = '取消加粗高亮';
                    } else {
                        newText = '**==' + selectedText + '==**';
                        action = '加粗高亮';
                    }
                } else if (e.key.toLowerCase() === 'e') {
                    // Cmd+E: 高亮 ==文本== / 取消高亮
                    if (selectedText.startsWith('==') && selectedText.endsWith('==')) {
                        newText = selectedText.slice(2, -2);
                        action = '取消高亮';
                    } else {
                        newText = '==' + selectedText + '==';
                        action = '高亮';
                    }
                }
        
                // 记录到撤销栈
                undoStack.push(this.value);
                redoStack.length = 0;
                if (undoStack.length > 50) undoStack.shift();
                
                // 2. 标记为快捷键操作
                this.dataset.isShortcutAction = 'true';
                
                // 3. 修改文本
                const beforeText = this.value.substring(0, start);
                const afterText = this.value.substring(end);
                this.value = beforeText + newText + afterText;
                this.selectionStart = this.selectionEnd = start + newText.length;
                
                // 更新预览
                saveDraftNow();
                updatePreview();
                
                // 提示
                showStatus(`已${action}选中文本`, 'success');
            });
        }
