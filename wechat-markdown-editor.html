<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信公众号 Markdown 渲染编辑器</title>
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/wechat-markdown-editor/assets/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/wechat-markdown-editor/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/wechat-markdown-editor/assets/icons/favicon-16x16.png">
    <link rel="manifest" href="/wechat-markdown-editor/assets/icons/site.webmanifest">
    <!-- 
        微信公众号 Markdown 渲染编辑器
        
        功能特性：
        - Markdown 到微信公众号 HTML 的转换
        - 商品卡片组件支持（自动匹配二维码图片）
        - 图片上传与 QR 码自动替换
        - 淘口令批量更新
        - 快捷键支持 (Cmd+B 加粗、Cmd+E 高亮、Cmd+U 加粗高亮、Cmd+K 行内代码、Cmd+Shift+K 代码块)
        - 撤销/重做功能
        
        技术栈：
        - 原生 HTML/CSS/JavaScript
        - Font Awesome 图标库
        - jsQR 二维码识别
        - QRCode.js 二维码生成
    -->
    
    <!-- 外部资源 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    
    <!-- ==================== 样式区域 ==================== -->
    <style>
        :root {
            --radius-sm: 7px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --border-subtle: rgba(255, 255, 255, 0.10);
            --border-strong: rgba(255, 255, 255, 0.16);
            --shadow-panel: 0 20px 70px rgba(0, 0, 0, 0.34);
            --shadow-float: 0 22px 70px rgba(0, 0, 0, 0.42);
            --surface: rgba(17, 20, 29, 0.74);
            --surface-solid: rgba(18, 21, 30, 0.94);
            --surface-raised: rgba(255, 255, 255, 0.055);
            --control-bg: rgba(255, 255, 255, 0.045);
            --text-strong: #f6f7fb;
            --text-muted: #9aa4b2;
            --accent: #8b5cf6;
            --accent-2: #22d3ee;
        }

        /* 全局基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", Arial, sans-serif;
        }
        
        /* 页面主体 */
        body {
            background:
                linear-gradient(135deg, rgba(139, 92, 246, 0.18), transparent 34%),
                linear-gradient(215deg, rgba(34, 211, 238, 0.13), transparent 36%),
                linear-gradient(180deg, #080a12 0%, #0d101a 48%, #11131e 100%);
            color: var(--text-strong);
            line-height: 1.6;
            padding: 15px;
            max-width: 1600px;
            margin: 0 auto;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.55), transparent 72%);
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.035);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.16);
            border: 3px solid transparent;
            border-radius: 999px;
            background-clip: padding-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.24);
            border: 3px solid transparent;
            background-clip: padding-box;
        }
        
        /* 页面标题区域 */
        header {
            flex-shrink: 0;
            text-align: center;
            padding: 10px 0;
            border-bottom: 1px solid #eaeaea;
            margin-bottom: 10px;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 4px;
            font-size: 20px;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 12px;
            line-height: 1.4;
        }

        /* ==================== 布局样式 ==================== */
        /* 编辑区与预览区容器 */
        .container {
            display: flex;
            flex-wrap: nowrap;
            gap: 16px;
            flex: 1;
            min-height: 0;
        }
        
        /* 编辑器/预览容器通用样式 */
        .editor-container, .preview-container {
            flex: 1;
            min-width: 300px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-panel);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.035)),
                var(--surface);
            backdrop-filter: blur(22px) saturate(1.1);
            display: flex;
            flex-direction: column;
        }

        /* 面板头部 */
        .panel-header {
            flex-shrink: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.03));
            color: var(--text-strong);
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            border-bottom: 1px solid var(--border-subtle);
            backdrop-filter: blur(22px);
        }

        .panel-header h2 {
            font-size: 13px;
            font-weight: 650;
            letter-spacing: 0;
        }
        
        /* 头部内的小按钮 */
        .panel-header .btn-sm {
            padding: 4px 10px;
            font-size: 12px;
            border-radius: var(--radius-sm);
        }
        
        .panel-header i {
            font-size: 16px;
            color: rgba(246, 247, 251, 0.82);
        }
        
        /* 面板内容区 */
        .panel-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .editor-container .panel-content {
            overflow: hidden;
        }
        
        /* Markdown 输入框 */
        #markdown-input {
            width: 100%;
            height: 100%;
            border: none;
            padding: 15px;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            outline: none;
            background-color: rgba(7, 10, 18, 0.42);
            color: #e8ecf4;
            caret-color: var(--accent-2);
            overflow-y: auto;
            scrollbar-width: none;
        }

        #markdown-input::-webkit-scrollbar {
            display: none;
        }

        #markdown-input::placeholder {
            color: rgba(154, 164, 178, 0.72);
        }
        
        #preview-content {
            padding: 24px 32px;
            height: 100%;
            overflow-y: auto;
            background: #ffffff;
            font-size: 13px;
        }

        /* ========== 微信公众号样式模拟 ========== */
        .wx-article {
            max-width: 677px;
            margin: 0 auto;
            background-color: white;
            color: #333333;
            padding: 10px;
            box-shadow: none;
        }
        
        .wx-article img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        
        .wx-article p {
            margin: 10px 0;
            line-height: 1.8;
            font-size: 14px;
        }
        
        .wx-article .product-card-section p,
        .wx-article .activity-card-section p {
            margin: 4px 0;
            line-height: 1.5;
        }
        
        /* 一级标题样式 */
        .wx-article .level1-title {
            white-space: normal;
            text-align: left !important;
            margin: 0 !important;
            display: flex;
            align-items: flex-end;
            width: 100%;
            clear: both;
            float: none !important;
        }
        
        .wx-article .level1-title img {
            width: 50px !important;
            height: 50px !important;
            margin-right: 8px;
            vertical-align: middle;
            float: none !important;
            flex-shrink: 0;
        }
        
        .wx-article .level1-title .title-text {
            font-size: 16px;
            color: rgb(33, 150, 243);
            font-weight: bold;
            text-align: left !important;
            display: inline-block;
            vertical-align: middle;
            line-height: 1.4;
            flex: 1;
        }
        
        /* 二级标题样式 */
        .wx-article .level2-title {
            margin: 0 !important;
            text-align: center;
            width: 100%;
            clear: both;
            float: none !important;
        }
        
        .wx-article .level2-title .title-box {
            display: inline-block;
            background-color: rgb(51, 173, 255);
            padding: 0;
            border-radius: 0;
            position: relative;
            height: auto;
        }
        
        .wx-article .level2-title .title-box-inner {
            background-color: rgb(39, 218, 241);
            padding: 0 10px;
            margin: 0;
            transform: translate(-6px, -6px);
        }
        
        .wx-article .level2-title .title-text {
            font-size: 15px;
            color: rgb(242, 249, 255);
            line-height: 2;
            padding: 0;
            margin: 0;
            font-weight: bold;
        }
        
        /* 列表样式 */
        .wx-article ul {
            list-style-type: disc !important;
            class: "list-paddingleft-1" !important;
            margin: 10px 0 !important;
            padding-left: 20px !important;
        }
        
        .wx-article li {
            margin-bottom: 6px !important;
            line-height: 1.6;
            font-size: 14px;
        }
        
        .wx-article li p {
            margin: 0px !important;
            text-align: left !important;
            line-height: 1.6em !important;
        }
        
        .wx-article .highlight {
            color: #33adff;
            font-weight: bold;
        }
        
        /* 灰色底框 */
        .wx-article .link-box {
            margin: 0 auto !important;
            padding: 10px;
            background-color: rgb(239, 239, 239);
            border-radius: 11px;
            text-align: center;
            font-size: 12px;
            line-height: 1.6;
            width: 556px;
            max-width: 100%;
            border-width: 2px;
            border-style: none;
            border-color: rgb(192, 200, 209);
            clear: both;
            float: none !important;
        }
        
        .wx-article .link-box strong {
            color: #333;
            font-weight: bold;
        }
        
        .wx-article .link-box a {
            color: #2196F3;
            text-decoration: none;
            word-break: break-all;
        }
        
        /* 分隔线样式 */
        .wx-article .divider {
            border-style: solid;
            border-width: 1px 0 0;
            border-color: rgba(0,0,0,0.1);
            -webkit-transform-origin: 0 0;
            -webkit-transform: scale(1, 0.5);
            transform-origin: 0 0;
            transform: scale(1, 0.5);
            margin: 0 0 10px 0 !important;
        }
        
        /* 底部样式 */
        .wx-article .footer-disclosure-line {
            display: block;
            width: 100%;
            box-sizing: border-box;
            text-align: right;
            text-indent: 0em;
            margin: 0 !important;
            padding: 0 0 2px 0;
            height: 20px;
            line-height: 18px;
            color: #888888;
            font-size: 12px;
            overflow: visible;
        }
        
        .wx-article .footer-img {
            text-align: center;
            margin: 4px 0 !important;
            line-height: 0;
        }

        .wx-article .footer-jump-image {
            margin: 4px 0 !important;
            font-size: 0;
            line-height: 0;
        }

        .wx-article .footer-jump-image .ProseMirror-separator,
        .wx-article .footer-jump-image .ProseMirror-trailingBreak {
            display: none !important;
        }
        
        .wx-article .footer-text {
            text-align: right;
            margin: 5px 0;
        }
        
        .wx-article .footer-text .heart-text {
            font-size: 12px;
            background-color: rgb(0, 179, 255);
            color: rgb(255, 255, 255);
            padding: 2px 6px;
            border-radius: 3px;
        }
        
        .wx-article .footer-gif {
            text-align: right;
            margin: 2px 0 10px 0;
        }
        
        .wx-article .footer-gif img {
            width: 72px !important;
            height: auto !important;
            display: inline-block;
            float: right;
        }

        /* ========== 功能区样式 ========== */
        .controls {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 14px 16px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.025)),
                rgba(8, 10, 16, 0.56);
            border-top: 1px solid var(--border-subtle);
            position: relative;
            margin-top: 0;
        }

        .editor-container .controls {
            border-radius: 0;
            box-shadow: none;
        }

        .controls .btn {
            padding: 9px 13px;
            font-size: 13px;
        }
        
        /* 图片上传区域 */
        .image-upload-area {
            position: relative;
        }
        
        .image-upload-input {
            display: none;
        }

        .typography-area {
            position: relative;
        }

        .typography-popover {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 10px);
            width: 260px;
            padding: 12px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-lg);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.055)),
                rgba(14, 17, 26, 0.94);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.24);
            backdrop-filter: blur(22px) saturate(1.15);
            opacity: 0;
            visibility: hidden;
            transform: translate(-50%, 6px);
            transition: opacity 0.16s ease, transform 0.16s ease, visibility 0.16s ease;
            z-index: 20;
        }

        .typography-popover.is-open {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
        }

        .typography-popover-title {
            margin: 0 34px 12px 0;
            color: rgba(255, 255, 255, 0.92);
            font-size: 13px;
            font-weight: 700;
        }

        .typography-reset {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 28px;
            height: 28px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.78);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.16s ease, color 0.16s ease, transform 0.16s ease;
        }

        .typography-reset:hover {
            background: linear-gradient(135deg, #2ea8ff, #1677ff);
            color: #ffffff;
            transform: rotate(-18deg);
        }

        .typography-style-row {
            display: grid;
            grid-template-columns: 54px auto;
            align-items: center;
            justify-content: start;
            column-gap: 8px;
            margin-top: 10px;
        }

        .typography-style-label {
            color: rgba(255, 255, 255, 0.68);
            font-size: 12px;
            white-space: nowrap;
            min-width: 54px;
        }

        .typography-stepper {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.06);
            padding: 3px;
        }

        .typography-stepper button {
            width: 28px;
            height: 28px;
            border: 0;
            border-radius: calc(var(--radius-sm) - 2px);
            color: rgba(255, 255, 255, 0.86);
            background: rgba(255, 255, 255, 0.08);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            line-height: 1;
            transition: background 0.16s ease, color 0.16s ease;
        }

        .typography-stepper button:hover {
            background: linear-gradient(135deg, #2ea8ff, #1677ff);
            color: #ffffff;
        }

        .typography-stepper input {
            width: 54px;
            height: 28px;
            border: 0;
            border-radius: calc(var(--radius-sm) - 2px);
            background: rgba(255, 255, 255, 0.10);
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            outline: none;
            appearance: textfield;
        }

        .typography-stepper input::-webkit-outer-spin-button,
        .typography-stepper input::-webkit-inner-spin-button {
            margin: 0;
            appearance: none;
        }

        .typography-segmented {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 3px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.06);
        }

        .typography-segmented button {
            min-width: 62px;
            height: 28px;
            border: 0;
            border-radius: calc(var(--radius-sm) - 2px);
            color: rgba(255, 255, 255, 0.70);
            background: transparent;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
        }

        .typography-segmented button.is-active {
            color: #ffffff;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.06)),
                rgba(255, 255, 255, 0.10);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        
        /* 图片预览面板 */
        .image-preview-panel {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 320px;
            height: 300px;
            max-height: min(300px, calc(100vh - 40px));
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.045)),
                rgba(14, 17, 26, 0.90);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-float);
            padding: 10px;
            z-index: 1000;
            overflow: hidden;
            display: grid;
            grid-template-rows: auto auto minmax(0, 1fr);
            backdrop-filter: blur(24px) saturate(1.15);
            transition: transform 0.22s ease, box-shadow 0.22s ease;
        }

        .image-preview-panel.collapsed {
            transform: translateX(calc(100% + 8px));
            overflow: visible;
            box-shadow: none;
        }

        .image-preview-tab {
            position: absolute;
            left: -42px;
            top: 10px;
            width: 42px;
            min-height: 128px;
            border: 1px solid var(--border-strong);
            border-right: none;
            border-radius: var(--radius-md) 0 0 var(--radius-md);
            background: rgba(15, 18, 27, 0.92);
            color: #d7deea;
            box-shadow: -8px 12px 32px rgba(0, 0, 0, 0.28);
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 0;
            writing-mode: vertical-rl;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .image-preview-panel.collapsed .image-preview-tab {
            display: flex;
        }

        .image-preview-tab i {
            writing-mode: horizontal-tb;
        }
        
        .image-preview-panel h4 {
            font-size: 12px;
            color: #c7cfdd;
            margin: 0 0 6px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .image-preview-title {
            flex: 1;
            min-width: 0;
        }

        .image-panel-toggle {
            width: 24px;
            height: 24px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.07);
            color: #cbd5e1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .image-panel-toggle:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        #image-preview-actions {
            flex-shrink: 0;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-subtle);
        }

        #image-preview-actions .btn {
            min-width: 0;
            padding: 5px 8px !important;
            font-size: 11px !important;
        }

        .image-uploading-placeholder {
            grid-column: 1 / -1;
            text-align: center;
            padding: 22px 12px;
            color: var(--text-muted);
        }

        .image-uploading-placeholder .spinner {
            width: 24px;
            height: 24px;
            margin: 0 auto 10px;
            border: 2px solid rgba(255, 255, 255, 0.14);
            border-top-color: var(--accent-2);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .image-uploading-placeholder .title {
            color: #e8ecf4;
            font-size: 12px;
        }

        .image-uploading-placeholder .hint {
            margin-top: 4px;
            font-size: 11px;
            color: rgba(154, 164, 178, 0.76);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        .image-preview-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            grid-auto-rows: 58px;
            align-content: start;
            gap: 4px;
            overflow-y: scroll;
            padding: 1px 2px 2px 1px;
            min-height: 0;
            height: 100%;
            scrollbar-width: thin;
        }
        
        .image-preview-item {
            position: relative;
            height: 58px;
            min-width: 0;
            border-radius: var(--radius-sm);
            overflow: hidden;
            cursor: pointer;
            font-size: 8px;
            background: rgba(255, 255, 255, 0.06);
        }
        
        .image-preview-item img {
            width: 100%;
            height: 100%;

        async function applyProductQrReplacement(originalDataUrl, mimeType = '') {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = async () => {
                    try {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);

                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height);
                        let displayDataUrl = originalDataUrl;
                        let qrReplaced = false;
                        let originalQrUrl = '';
                        let newQrUrl = '';

                        if (code) {
                            originalQrUrl = code.data;
                            newQrUrl = getNewQRUrl(code.data);
                            if (newQrUrl !== code.data) {
                                const isNewCard = img.width <= 1000 && img.height <= 420;
                                const qrSize = isNewCard ? 203 : 216;
                                const qrX = isNewCard ? 738 : 760;
                                const qrY = isNewCard ? 148 : 140;
                                const qrCanvas = document.createElement('canvas');
                                await QRCode.toCanvas(qrCanvas, newQrUrl, {
                                    margin: 0,
                                    width: qrSize,
                                    errorCorrectionLevel: 'H'
                                });
                                ctx.drawImage(qrCanvas, qrX, qrY, qrSize, qrSize);
                                displayDataUrl = canvas.toDataURL('image/png');
                                qrReplaced = true;
                            }
                        }

                        resolve({
                            displayDataUrl,
                            thumbnailSrc: createImagePreviewThumbnail(canvas),
                            qrReplaced,
                            originalQrUrl,
                            newQrUrl,
                            width: img.width,
                            height: img.height,
                            mimeType
                        });
                    } catch (err) {
                        reject(err);
                    }
                };
                img.onerror = () => reject(new Error('图片读取失败'));
                img.src = originalDataUrl;
            });
        }

        async function splitActivityCardImage(cardDataUrl, stripHeight = 115) {
            const img = await loadImageFromDataUrl(cardDataUrl);
            const sourceWidth = img.naturalWidth || img.width;
            const sourceHeight = img.naturalHeight || img.height;
            const cutHeight = Math.min(stripHeight, Math.max(1, sourceHeight - 1));
            const cardHeight = sourceHeight - cutHeight;
            const sourceCanvas = document.createElement('canvas');
            const sourceCtx = sourceCanvas.getContext('2d');
            sourceCanvas.width = sourceWidth;
            sourceCanvas.height = sourceHeight;
            sourceCtx.drawImage(img, 0, 0);

            const cardCanvas = document.createElement('canvas');
            const cardCtx = cardCanvas.getContext('2d');
            cardCanvas.width = sourceWidth;
            cardCanvas.height = cardHeight;
            cardCtx.drawImage(sourceCanvas, 0, 0, sourceWidth, cardHeight, 0, 0, sourceWidth, cardHeight);

            const stripCanvas = document.createElement('canvas');
            const stripCtx = stripCanvas.getContext('2d');
            stripCanvas.width = sourceWidth;
            stripCanvas.height = cutHeight;
            stripCtx.drawImage(sourceCanvas, 0, cardHeight, sourceWidth, cutHeight, 0, 0, sourceWidth, cutHeight);

            // 淘口令区域紧贴小长条底边，底色应匹配小长条最底部的视觉颜色，而不是整条图的全局主色。
            const edgeHeight = Math.max(8, Math.min(32, Math.round(cutHeight * 0.16)));
            const edgeY = Math.max(0, cutHeight - edgeHeight);
            const stripEdgeImageData = stripCtx.getImageData(0, edgeY, sourceWidth, edgeHeight);
            const backgroundColor = colorToCss(getDominantColorFromImageData(stripEdgeImageData));

            return {
                cardDataUrl: cardCanvas.toDataURL('image/png'),
                cardWidth: sourceWidth,
                cardHeight,
                stripDataUrl: stripCanvas.toDataURL('image/png'),
                stripWidth: sourceWidth,
                stripHeight: cutHeight,
                backgroundColor,
                topColor: backgroundColor,
                textColor: getReadableTextColor(backgroundColor),
                splitFromSingleImage: true
            };
        }

        async function getImageBottomEdgeColor(imageDataUrl) {
            const img = await loadImageFromDataUrl(imageDataUrl);
            const width = img.naturalWidth || img.width;
            const height = img.naturalHeight || img.height;
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0);

            const edgeHeight = Math.max(8, Math.min(32, Math.round(height * 0.16)));
            const edgeY = Math.max(0, height - edgeHeight);
            const edgeImageData = ctx.getImageData(0, edgeY, width, edgeHeight);
            return colorToCss(getDominantColorFromImageData(edgeImageData));
        }

        /**
         * 获取唯一的文件名（用于粘贴图片重名处理）
         * @param {string} originalName - 原始文件名
         * @param {boolean} isPasted - 是否是粘贴的图片
         * @returns {{storageName: string, displayName: string}} 唯一的存储名和显示名
         */
        function getUniqueFilename(originalName, isPasted) {
            // 如果不是粘贴的图片，直接返回原始名（不上传重名处理）
            if (!isPasted) {
                return {
                    storageName: originalName.replace(/\.[^.]+$/, ''),
                    displayName: originalName
                };
            }
            
            // 粘贴图片：首先尝试原始完整文件名
            let baseName = originalName;
            let nameWithoutExt = baseName.replace(/\.[^.]+$/, '');
            let extension = baseName.substring(nameWithoutExt.length);
            
            // 检查是否已存在同名图片
            if (uploadedImages[baseName]) {
                // 寻找可用的数字后缀
                let counter = 1;
                let newName;
                do {
                    newName = `${nameWithoutExt} (${counter})${extension}`;
                    counter++;
                } while (uploadedImages[newName]);
                return {
                    storageName: newName,
                    displayName: newName
                };
            }
            
            // 没有重名，直接使用
            return {
                storageName: baseName,
                displayName: baseName
            };
        }
        
        /**
         * 处理上传的图片（识别并替换二维码）
         * 原图用于打包下载，QR替换后用于预览和复制
         * @param {File} file - 上传的文件对象
         * @param {boolean} isPasted - 是否是粘贴的图片
          */
        async function processImageWithQR(file, isPasted = false) {
            if (!isSupportedImageFile(file)) {
                showStatus(`【${file.name}】不是支持的图片格式`, 'warning');
                finishImageProcessing(false);
                return;
            }

            if (isHeicFile(file)) {
                try {
                    showStatus(`正在转换 HEIC：${file.name}`, 'info');
                    file = await convertHeicToJpeg(file);
                } catch (err) {
                    console.error('HEIC 转换失败:', err);
                    showStatus(`【${file.name}】HEIC 转换失败，请先转 JPG`, 'warning');
                    finishImageProcessing(false);
                    return;
                }
            }

            // 根据是否粘贴获取唯一文件名
            const { storageName: storageFilename, displayName: displayFilename } = getUniqueFilename(file.name, isPasted);

            // GIF 超过 6MB 提醒
            if (file.type === 'image/gif' && file.size > CompressionConfig.gifSizeWarning) {
                showStatus(`【${displayFilename}】超过 6MB，请压缩！`, 'warning');
            }

            const reader = new FileReader();
            reader.onload = async function(event) {
                // 保存原始图片（用于打包下载）
                const originalDataUrl = event.target.result;

                try {
                    const qrResult = await applyProductQrReplacement(originalDataUrl, file.type || '');
                    // 活动卡片的二维码位置不固定，上传前已手动处理；切图必须基于原图，不能使用商品二维码替换后的图。
                    const activityCard = await buildActivityCardAssets(originalDataUrl);
                    const stripBackgroundColor = await getImageBottomEdgeColor(originalDataUrl);

                    if (uploadedImages[storageFilename]) {
                        totalUploadedImageBytes -= uploadedImages[storageFilename].originalSize || getDataUrlByteSize(uploadedImages[storageFilename].originalDataUrl);
                        if (totalUploadedImageBytes < 0) totalUploadedImageBytes = 0;
                        revokePreviewUrl(uploadedImages[storageFilename]);
                    }

                    // 保存图片（分离原始URL、显示URL和静态缩略图）
                    // GIF 在 img 标签中会持续播放，面板内大量 GIF 会拖慢滚动；缩略图统一用静态首帧。
                    uploadedImages[storageFilename] = {
                        originalDataUrl: originalDataUrl, // 原始图片，打包下载用
                        displayDataUrl: qrResult.displayDataUrl,     // 处理后图片，预览复制用
                        thumbnailSrc: qrResult.thumbnailSrc,         // 面板静态缩略图，避免大图/GIF 影响滚动性能
                        useCount: 0,
                        qrReplaced: qrResult.qrReplaced,
                        originalQrUrl: qrResult.originalQrUrl,
                        rewrittenQrUrl: qrResult.newQrUrl,
                        displayName: displayFilename,
                        width: qrResult.width,
                        height: qrResult.height,
                        mimeType: file.type || '',
                        activityCard,
                        stripBackgroundColor,
                        originalSize: file.size || getDataUrlByteSize(originalDataUrl)
                    };
                    if (qrResult.qrReplaced) {
                        console.log(`二维码已替换: ${file.name}`);
                    }
                    totalUploadedImageBytes += uploadedImages[storageFilename].originalSize;

                    // 如果是粘贴的图片，在编辑器中插入引用
                    if (isPasted) {
                        insertImageReference(displayFilename);
                        showStatus(`图片已插入：${displayFilename}`, 'success');
                    }

                        // 渐进式显示：每处理完一张就刷新
                        finishImageProcessing(true);
                } catch (err) {
                    console.error('图片处理失败:', err);
                    showStatus(`【${displayFilename}】处理失败`, 'warning');
                    finishImageProcessing(false);
                }
            };
            reader.onerror = () => {
                showStatus(`【${displayFilename}】读取失败`, 'warning');
                finishImageProcessing(false);
            };
            reader.readAsDataURL(file);
        }

        /* ==================== 图片批量操作 ==================== */

        /**
         * 调整单张图片尺寸用于复制（不改格式、不做主动压缩）
         * @param {string} dataUrl - 原始图片的 dataUrl
         * @returns {Promise<string>} 调整尺寸后的 dataUrl
         */
        async function compressImageForCopy(dataUrl, returnMeta = false) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const sourceMimeType = (dataUrl.match(/^data:([^;]+);/) || [])[1] || '';
                    if (img.width <= CompressionConfig.maxWidth) {
                        if (returnMeta) {
                            resolve({
                                dataUrl,
                                width: img.width,
                                height: img.height,
                                mimeType: sourceMimeType
                            });
                            return;
                        }
                        resolve(dataUrl);
                        return;
                    }

                    let { width, height } = img;
                    height = Math.round((height * CompressionConfig.maxWidth) / width);
                    width = CompressionConfig.maxWidth;

                    const outputCanvas = document.createElement('canvas');
                    outputCanvas.width = width;
                    outputCanvas.height = height;
                    const outputCtx = outputCanvas.getContext('2d');
                    outputCtx.drawImage(img, 0, 0, width, height);

                    const outputMimeType = sourceMimeType === 'image/jpeg' || sourceMimeType === 'image/png' || sourceMimeType === 'image/webp'
                        ? sourceMimeType
                        : 'image/png';
                    const resizedDataUrl = outputMimeType === 'image/jpeg'
                        ? outputCanvas.toDataURL(outputMimeType, CompressionConfig.jpegResizeQuality)
                        : outputCanvas.toDataURL(outputMimeType);
                    if (returnMeta) {
                        resolve({
                            dataUrl: resizedDataUrl,
                            width,
                            height,
                            mimeType: outputMimeType
                        });
                        return;
                    }
                    resolve(resizedDataUrl);
                };
                img.onerror = () => {
                    if (returnMeta) {
                        resolve({ dataUrl, width: 0, height: 0, mimeType: '' });
                        return;
                    }
                    resolve(dataUrl);
                };
                img.src = dataUrl;
            });
        }

        function createImagePreviewThumbnail(source, maxSize = 180) {
            const ratio = source.width && source.height ? Math.min(1, maxSize / Math.max(source.width, source.height)) : 1;
            const width = Math.max(1, Math.round((source.width || maxSize) * ratio));
            const height = Math.max(1, Math.round((source.height || maxSize) * ratio));
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(source, 0, 0, width, height);
            return canvas.toDataURL('image/jpeg', 0.72);
        }

        function getDataUrlByteSize(dataUrl) {
            const commaIndex = dataUrl.indexOf(',');
            if (commaIndex === -1) return 0;
            const base64Length = dataUrl.length - commaIndex - 1;
            return Math.round((base64Length * 3) / 4);
        }

        function revokePreviewUrl(image) {
            if (!image) return;
            ['previewSrc', 'thumbnailSrc'].forEach((key) => {
                if (image[key] && image[key].startsWith('blob:')) {
                    URL.revokeObjectURL(image[key]);
                }
            });
        }

        /**
         * 删除所有已上传的图片（仅清空面板，不影响编辑区文案）
         */
        function deleteAllUploadedImages() {
            const filenames = Object.keys(uploadedImages);
            if (filenames.length === 0) {
                showStatus('没有已上传的图片', 'error');
                return;
            }

            if (!confirm(`确定要清空所有 ${filenames.length} 张已上传图片吗？\n编辑区的文案不会被删除，但图片引用会失效。`)) {
                return;
            }

            for (const filename of filenames) {
                revokePreviewUrl(uploadedImages[filename]);
                delete uploadedImages[filename];
            }
            totalUploadedImageBytes = 0;

            updateImagePreview();
            immediateUpdatePreview();
            showStatus(`已清空 ${filenames.length} 张图片`, 'success');
        }

        function collectReferencedImagesInMarkdown() {
            const lines = textarea.value.split('\n');
            const imageOrder = [];

            for (const line of lines) {
                const trimmedLine = line.trim();
                const activityCardMatch = trimmedLine.match(/^活动卡片：(.*)$/);
                if (activityCardMatch) {
                    const spec = parseActivityCardSpec(activityCardMatch[1]);
                    const matched = findMatchingImage(spec.imageName);
                    if (matched) imageOrder.push({ refText: spec.imageName, filename: matched.filename });
                    const stripMatched = spec.stripName ? findMatchingImage(spec.stripName) : null;
                    if (stripMatched) imageOrder.push({ refText: spec.stripName, filename: stripMatched.filename });
                    continue;
                }

                const sideMatch = trimmedLine.match(/^【([^【】]+)】[|｜]【([^【】]+)】(?:[|｜]【([^【】]+)】)?$/);
                if (sideMatch) {
                    for (let j = 1; j <= 3; j++) {
                        if (!sideMatch[j]) continue;
                        const refText = sideMatch[j].trim();
                        const matched = findImageByReference(refText);
                        if (matched) imageOrder.push({ refText, filename: matched.filename });
                    }
                    continue;
                }

                const match = trimmedLine.match(/^【([^【】]+)】$/);
                if (match) {
                    const refText = match[1].trim();
                    const matched = findImageByReference(refText);
                    if (matched) imageOrder.push({ refText, filename: matched.filename });
                }
            }

            return imageOrder;
        }

        function getDataUrlExtension(dataUrl, fallbackName = '') {
            const mimeType = (dataUrl.match(/^data:([^;]+);/) || [])[1] || '';
            if (mimeType === 'image/jpeg') return 'jpg';
            if (mimeType === 'image/png') return 'png';
            if (mimeType === 'image/gif') return 'gif';
            if (mimeType === 'image/webp') return 'webp';
            const ext = String(fallbackName).split('.').pop();
            return ext && ext !== fallbackName ? ext.toLowerCase() : 'png';
        }

        function makeUniqueZipFilename(filename, usedNames) {
            const normalized = filename || 'image.png';
            if (!usedNames.has(normalized)) {
                usedNames.add(normalized);
                return normalized;
            }

            const dotIndex = normalized.lastIndexOf('.');
            const name = dotIndex > 0 ? normalized.slice(0, dotIndex) : normalized;
            const ext = dotIndex > 0 ? normalized.slice(dotIndex) : '';
            let index = 2;
            let candidate = `${name}-${index}${ext}`;
            while (usedNames.has(candidate)) {
                index++;
                candidate = `${name}-${index}${ext}`;
            }
            usedNames.add(candidate);
            return candidate;
        }

        async function getImageDataUrlForWeChatPackage(img) {
            if (!img) return '';
            const displayName = (img.displayName || '').toLowerCase();
            if (displayName.endsWith('.gif') || (img.mimeType || '').toLowerCase() === 'image/gif') {
                return img.originalDataUrl || img.displayDataUrl;
            }
            if (img.qrReplaced) {
                return img.displayDataUrl || img.originalDataUrl;
            }
            return await compressImageForCopy(img.originalDataUrl || img.displayDataUrl);
        }

        async function downloadImagesAsZip(renameByOrder = true) {
            try {
                const imageOrder = collectReferencedImagesInMarkdown();

                if (imageOrder.length === 0) {
                    showStatus('没有可打包的图片', 'error');
                    return;
                }

                showStatus(`正在打包 ${imageOrder.length} 张图片...`, 'info');

                const zip = new JSZip();
                const folder = zip.folder('uploaded-images');
                const usedNames = new Set();

                for (let i = 0; i < imageOrder.length; i++) {
                    const item = imageOrder[i];
                    const img = uploadedImages[item.filename];
                    const dataUrl = await getImageDataUrlForWeChatPackage(img);
                    if (!dataUrl) continue;

                    const ext = getDataUrlExtension(dataUrl, img.displayName);
                    const baseName = renameByOrder ? `图 ${i + 1}.${ext}` : (img.displayName || item.filename || `image-${i + 1}.${ext}`);
                    const zipFilename = makeUniqueZipFilename(baseName, usedNames);
                    const base64 = dataUrl.split(',')[1];
                    folder.file(zipFilename, base64, { base64: true });
                }

                const content = await zip.generateAsync({
                    type: 'blob',
                    compression: 'DEFLATE',
                    compressionOptions: { level: 6 }
                });

                const timestamp = new Date().toISOString().slice(0, 10);
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = renameByOrder ? `wechat-images-renamed-${timestamp}.zip` : `wechat-images-original-names-${timestamp}.zip`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);

                showStatus(`已${renameByOrder ? '改名' : '原名'}打包下载 ${imageOrder.length} 张图片`, 'success');
            } catch (err) {
                console.error('图片打包失败:', err);
                showStatus('图片打包失败: ' + err.message, 'error');
            }
        }

        function downloadAllImagesAsZip() {
            return downloadImagesAsZip(true);
        }

        function downloadCompressedImagesAsZip() {
            return downloadImagesAsZip(false);
        }

        /**
         * 更新图片预览面板显示
          */
        function updateImagePreview() {
            const panel = document.getElementById('image-preview-panel');
            const grid = document.getElementById('image-preview-grid');
            
            const filenames = Object.keys(uploadedImages).sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
            
            if (filenames.length === 0) {
                panel.style.display = 'none';
                return;
            }
            
            panel.style.display = 'grid';
            grid.innerHTML = '';
            
            filenames.forEach(filename => {
                const img = uploadedImages[filename];
                const isUsed = img.useCount > 0;
                const displayName = img.displayName || filename; // 使用显示名称，如果没有则使用存储名称
	                const item = document.createElement('div');
	                item.className = `image-preview-item ${isUsed ? 'used' : 'unused'}`;
	                item.title = displayName;
                    item.dataset.filename = filename;
	                item.innerHTML = `
	                    <img src="${img.thumbnailSrc || img.displayDataUrl}" alt="${displayName}">
                    <div class="use-count">${img.useCount}</div>
                    <div class="delete-btn">×</div>
                    <div class="filename">${displayName}</div>
                `;
                
                // 删除按钮事件
                const deleteBtn = item.querySelector('.delete-btn');
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation(); // 阻止冒泡，避免触发复制引用事件
                    if (confirm(`确定要删除图片 "${displayName}" 吗？`)) {
                        totalUploadedImageBytes -= img.originalSize || getDataUrlByteSize(img.originalDataUrl);
                        if (totalUploadedImageBytes < 0) totalUploadedImageBytes = 0;
                        revokePreviewUrl(img);
                        delete uploadedImages[filename];
                        updateImagePreview(); // 刷新预览面板
                        immediateUpdatePreview(); // 刷新文章预览
                        showStatus(`已删除图片: ${displayName}`, 'success');
                    }
                });
                
                // 点击复制图片引用（带【】符号）
                item.addEventListener('click', () => {
                    const refWithBrackets = `【${displayName}】`;
                    navigator.clipboard.writeText(refWithBrackets).then(() => {
                        showStatus(`已复制: ${refWithBrackets}`, 'success');
                    }).catch(() => {
                        showStatus('复制失败', 'error');
                    });
                });
                
	                grid.appendChild(item);
	            });
	        }

        function updateImagePreviewUseCounts() {
            const panel = document.getElementById('image-preview-panel');
            const grid = document.getElementById('image-preview-grid');
            const filenames = Object.keys(uploadedImages);

            if (filenames.length === 0) {
                panel.style.display = 'none';
                return;
            }

            if (!grid.children.length || grid.children.length !== filenames.length) {
                updateImagePreview();

                item.classList.toggle('used', isUsed);

        function toggleImagePreviewPanel(collapsed) {
            const panel = document.getElementById('image-preview-panel');
            const toggle = document.getElementById('image-panel-toggle');
            if (!panel) return;

            panel.classList.toggle('collapsed', collapsed);
            if (toggle) {

        function setupImagePreviewPanelScroll() {
            const panel = document.getElementById('image-preview-panel');
            const grid = document.getElementById('image-preview-grid');
            if (!panel || !grid) return;

            panel.addEventListener('wheel', (e) => {
                if (panel.classList.contains('collapsed')) return;

        /* ==================== 图片匹配工具 ==================== */
        
        /**
         * 根据商品名称精确匹配图片（商品名与文件名匹配）
         * @param {string} productName - 商品名称
         * @returns {{ filename, dataUrl, width, height, mimeType } | null}
         */
        function normalizeProductImageName(name) {
            return (name || '')
                .trim()
                .replace(/^【|】$/g, '')
                .replace(/\.(png|jpg|jpeg|gif|webp|heic|heif)$/i, '')
                .toLowerCase();
        }

        function findMatchingImage(productName, useCopyDataUrl = false) {
            const exactName = normalizeProductImageName(productName);
            for (const filename of Object.keys(uploadedImages)) {
                const image = uploadedImages[filename];
                const candidates = [
                    filename,
                    image.displayName || '',
                    (image.displayName || '').replace(/\.[^.]+$/, ''),
                    filename.replace(/\.[^.]+$/, '')
                ].map(normalizeProductImageName);

                if (candidates.includes(exactName)) {
                    return getUploadedImageInfo(filename, useCopyDataUrl);
                }
            }
            return null;
        }

        function getActivityCardRefsFromMarkdown(markdown) {
            const refs = [];
            String(markdown || '').split('\n').forEach((line) => {
                const match = line.trim().match(/^活动卡片：(.*)$/);
                if (!match) return;
                const spec = parseActivityCardSpec(match[1]);
                if (spec.imageName) refs.push(spec.imageName);
                if (spec.stripName) refs.push(spec.stripName);
            });
            return refs;
        }

        function getSafeLocalImageCandidates(refText) {
            const name = String(refText || '').trim().replace(/^【|】$/g, '');
            if (!name || /[\\/]/.test(name) || name.includes('..')) return [];
            const hasExt = /\.(png|jpg|jpeg|webp)$/i.test(name);
            return hasExt ? [name] : [`${name}.png`, `${name}.jpg`, `${name}.jpeg`, `${name}.webp`];
        }

        async function loadLocalActivityImageIfNeeded(refText) {
            if (findMatchingImage(refText)) return;

            for (const candidate of getSafeLocalImageCandidates(refText)) {
                try {
                    const dataUrl = await loadImageUrlAsDataUrl(`images/${encodeURIComponent(candidate)}`);
                    const img = await loadImageFromDataUrl(dataUrl);
                    const activityCard = await buildActivityCardAssets(dataUrl);
                    const stripBackgroundColor = await getImageBottomEdgeColor(dataUrl);
                    uploadedImages[candidate] = {
                        originalDataUrl: dataUrl,
                        displayDataUrl: dataUrl,
                        thumbnailSrc: dataUrl,
                        useCount: 0,
                        qrReplaced: false,
                        originalQrUrl: '',
                        rewrittenQrUrl: '',
                        displayName: candidate,
                        width: img.naturalWidth || img.width,
                        height: img.naturalHeight || img.height,
                        mimeType: getMimeTypeFromImageUrl(candidate),
                        activityCard,
                        stripBackgroundColor,
                        originalSize: getDataUrlByteSize(dataUrl),
                        localActivityAsset: true
                    };
                    totalUploadedImageBytes += uploadedImages[candidate].originalSize;
                    updateImagePreview();
                    return;
                } catch (err) {
                    // 继续尝试其他常见扩展名。
                }
            }
        }

        async function ensureActivityCardsForMarkdown(markdown) {
            const lines = String(markdown || '').split('\n');
            for (const line of lines) {
                const match = line.trim().match(/^活动卡片：(.*)$/);
                if (!match) continue;
                const spec = parseActivityCardSpec(match[1]);

                if (spec.imageName) await loadLocalActivityImageIfNeeded(spec.imageName);
                if (spec.stripName) await loadLocalActivityImageIfNeeded(spec.stripName);

                // 两图语法只负责拼接；单图语法才会把底部 115px 切成小长条。
                if (spec.stripName) {
                    const stripMatched = findMatchingImage(spec.stripName);
                    if (stripMatched) await ensureStripColorForImageRecord(uploadedImages[stripMatched.filename]);
                    continue;
                }

                const matched = spec.imageName ? findMatchingImage(spec.imageName) : null;
                if (!matched) continue;
                const image = uploadedImages[matched.filename];
                await ensureActivityCardForImageRecord(image);
            }
        }

        function getUploadedImageInfo(filename, useCopyDataUrl = false) {
            const image = uploadedImages[filename];
            return {
                filename,
                dataUrl: image.displayDataUrl,
                width: image.width,
                height: image.height,
                mimeType: image.mimeType || '',
                displayName: image.displayName || filename,
                activityCard: image.activityCard || null,
                stripBackgroundColor: image.stripBackgroundColor || ''
            };
        }

        function getWeChatAdaptiveImageAttrs(block) {
            const width = Number(block.width) || 0;
            const height = Number(block.height) || 0;
            const ratio = width > 0 && height > 0 ? (height / width).toFixed(8).replace(/0+$/, '').replace(/\.$/, '') : '';
            const type = (block.mimeType || '').split('/')[1] || (block.filename || '').split('.').pop() || 'png';
            const attrs = [
                'width="100%"',
                '_width="100%"',
                'data-original-style="width: 100%;height: auto !important;"',
                'data-s="300,640"',
                `data-type="${type.toLowerCase()}"`
            ];
            if (width > 0) attrs.push(`data-w="${width}"`);
            if (width > 0) attrs.push('data-backw="578"');
            if (width > 0 && height > 0) attrs.push(`data-backh="${Math.round((height / width) * 578)}"`);
            if (ratio) attrs.push(`data-ratio="${ratio}"`);
            return attrs.join(' ');
        }

        function getDefaultProductCardQrSrc() {
            return defaultProductImageDataUrls.qr || githubImages.productCardQr;
        }

        function getDefaultProductCardBannerSrc() {

        const defaultProductImageDataUrls = {
            qr: embeddedProductCardQrDataUrl,

        };
        function getMimeTypeFromImageUrl(url) {
            const cleanUrl = String(url).split('?')[0].toLowerCase();
            if (cleanUrl.endsWith('.jpg') || cleanUrl.endsWith('.jpeg')) return 'image/jpeg';
            if (cleanUrl.endsWith('.gif')) return 'image/gif';
            if (cleanUrl.endsWith('.webp')) return 'image/webp';
            return 'image/png';
        }

        function loadImageElementAsDataUrl(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.naturalWidth || img.width;
                        canvas.height = img.naturalHeight || img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        resolve(canvas.toDataURL(getMimeTypeFromImageUrl(url)));
                    } catch (err) {
                        reject(err);
                    }
                };
                img.onerror = () => reject(new Error(`图片加载失败: ${url}`));
                img.src = url;
            });
        }

        async function loadImageUrlAsDataUrl(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`图片加载失败: ${url}`);
                const blob = await response.blob();
                return await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            } catch (err) {
                console.warn('fetch 读取图片失败，尝试用图片元素读取:', err);
                return loadImageElementAsDataUrl(url);
            }
        }

        function loadImageFromDataUrl(dataUrl) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('图片读取失败'));
                img.src = dataUrl;
            });
        }

        function colorToCss(color) {
            return `rgb(${color.r}, ${color.g}, ${color.b})`;
        }

        function parseCssRgb(cssColor) {
            const match = String(cssColor || '').match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
            if (!match) return { r: 246, g: 251, b: 253 };
            return {
                r: Number(match[1]),
                g: Number(match[2]),
                b: Number(match[3])
            };
        }

        function getRelativeLuminance(color) {
            const rgb = [color.r, color.g, color.b].map((value) => {
                const normalized = value / 255;
                return normalized <= 0.03928
                    ? normalized / 12.92
                    : Math.pow((normalized + 0.055) / 1.055, 2.4);
            });
            return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
        }

        function getReadableTextColor(cssColor) {
            const luminance = getRelativeLuminance(parseCssRgb(cssColor));
            return luminance > 0.48 ? 'rgb(0, 0, 0)' : 'rgb(255, 255, 255)';
        }

        function normalizeActivityColor(value, fallback = 'rgb(246, 251, 253)') {
            const text = String(value || '').trim();
            const hex = text.match(/#([0-9a-f]{6}|[0-9a-f]{3})\b/i);
            if (hex) {
                let raw = hex[1];
                if (raw.length === 3) raw = raw.split('').map(ch => ch + ch).join('');
                const r = parseInt(raw.slice(0, 2), 16);
                const g = parseInt(raw.slice(2, 4), 16);
                const b = parseInt(raw.slice(4, 6), 16);
                return `rgb(${r}, ${g}, ${b})`;
            }

            const rgb = text.match(/rgba?\(\s*\d+\s*,\s*\d+\s*,\s*\d+(?:\s*,\s*(?:0|1|0?\.\d+))?\s*\)/i);
            return rgb ? rgb[0] : fallback;
        }

        function parseActivityCardSpec(rawSpec) {
            const spec = String(rawSpec || '').trim();
            const refs = Array.from(spec.matchAll(/【([^【】]+)】/g)).map(match => match[1].trim());
            const color = normalizeActivityColor(spec, '');
            const parts = spec.split(/[|｜,，]/).map(part => part.trim()).filter(Boolean);
            const fallbackName = normalizeProductImageName(parts[0] || spec);

            return {
                imageName: normalizeProductImageName(refs[0] || fallbackName),
                stripName: refs[1] ? normalizeProductImageName(refs[1]) : '',
                backgroundColor: color || ''
            };
        }

        function averagePixels(imageData, options = {}) {
            const data = imageData.data;
            const stride = options.stride || 4;
            let r = 0;
            let g = 0;
            let b = 0;
            let count = 0;

            for (let i = 0; i < data.length; i += 4 * stride) {
                const alpha = data[i + 3];
                if (alpha < 128) continue;
                r += data[i];
                g += data[i + 1];
                b += data[i + 2];
                count++;
            }

            if (!count) return { r: 246, g: 251, b: 253 };
            return {
                r: Math.round(r / count),
                g: Math.round(g / count),
                b: Math.round(b / count)
            };
        }

        function getDominantColorFromImageData(imageData) {
            const data = imageData.data;
            const buckets = new Map();
            const bucketSize = 24;
            const sampleStep = Math.max(1, Math.floor((imageData.width * imageData.height) / 18000));

            for (let i = 0; i < data.length; i += 4 * sampleStep) {
                const alpha = data[i + 3];
                if (alpha < 128) continue;

                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const max = Math.max(r, g, b);
                const min = Math.min(r, g, b);
                const brightness = (r + g + b) / 3;
                const saturation = max === 0 ? 0 : (max - min) / max;

                // 活动卡片常见的白底、黑字、二维码黑块不适合作为底色，优先统计有色区域。
                if ((brightness > 232 && saturation < 0.18) || brightness < 34) continue;

                const key = [
                    Math.round(r / bucketSize),
                    Math.round(g / bucketSize),
                    Math.round(b / bucketSize)
                ].join(',');

                const bucket = buckets.get(key) || { r: 0, g: 0, b: 0, count: 0, score: 0 };
                bucket.r += r;
                bucket.g += g;
                bucket.b += b;
                bucket.count++;
                bucket.score += 1 + saturation;
                buckets.set(key, bucket);
            }

            let best = null;
            for (const bucket of buckets.values()) {
                if (!best || bucket.score > best.score) best = bucket;
            }

            if (!best || !best.count) return averagePixels(imageData, { stride: sampleStep });
            return {
                r: Math.round(best.r / best.count),
                g: Math.round(best.g / best.count),
                b: Math.round(best.b / best.count)
            };
        }

        async function ensureDefaultProductImagesForCopy() {
            const needsBanner = !isPersonalMode;
            if (defaultProductImageDataUrls.qr && (!needsBanner || defaultProductImageDataUrls.banner)) {
                return;
            }

            try {
                if (!defaultProductImageDataUrls.qr) {
                    defaultProductImageDataUrls.qr = await loadImageUrlAsDataUrl('images/product-card-qr.png');
                }
                if (needsBanner && !defaultProductImageDataUrls.banner) {
                    defaultProductImageDataUrls.banner = await loadImageUrlAsDataUrl('images/product-card-banner.png');
                }
            } catch (err) {
                console.warn('本地默认商品卡片图片内嵌失败，尝试远程链接:', err);
                try {
                    if (!defaultProductImageDataUrls.qr) {
                        defaultProductImageDataUrls.qr = await loadImageUrlAsDataUrl(githubImages.productCardQr);
                    }
                    if (needsBanner && !defaultProductImageDataUrls.banner) {
                        defaultProductImageDataUrls.banner = await loadImageUrlAsDataUrl(githubImages.productCardBanner);
                    }
                } catch (fallbackErr) {
                    console.warn('默认商品卡片图片内嵌失败，将回退为链接:', fallbackErr);
                }
            }
        }

        function isGifImageBlock(block) {
            const mimeType = (block.mimeType || '').toLowerCase();
            const filename = (block.filename || block.displayName || '').toLowerCase();
            return mimeType === 'image/gif' || filename.endsWith('.gif');
        }

        function createGifPlaceholderHTML(block) {
            const name = block.displayName || block.filename || block.alt || 'GIF动图';
            const placeholderSrc = createGifPlaceholderImage(name);
            const personalImageStyle = 'width: 100% !important; height: auto !important; border: 2px dashed rgb(192, 204, 92); padding: 8px; background: #ffffff; box-sizing: border-box; visibility: visible !important;';
            const defaultImageStyle = 'width: 100% !important; height: auto !important; visibility: visible !important;';
            const imageStyle = isPersonalMode ? personalImageStyle : defaultImageStyle;
            const originalStyle = isPersonalMode ? 'width: 100%;height: auto !important;border: 2px dashed rgb(192, 204, 92);padding: 8px;background: #ffffff;box-sizing: border-box;' : 'width: 100%;height: auto !important;';
            return `<section style="text-align: center; margin: 0; padding: 0;">
                <img data-src="${placeholderSrc}" class="rich_pages wxw-img" width="100%" _width="100%" data-ratio="0.24444444" data-s="300,640" data-type="png" data-w="900" data-backw="578" data-backh="141" data-original-style="${originalStyle}" style="${imageStyle}" src="${placeholderSrc}" alt="GIF待替换：${name}">
            </section>`;
        }

        function createGifPlaceholderImage(name) {
            const canvas = document.createElement('canvas');
            canvas.width = 900;
            canvas.height = 220;
            const ctx = canvas.getContext('2d');
            const displayName = name.length > 36 ? `${name.slice(0, 33)}...` : name;

            ctx.fillStyle = '#fff5f5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 8;
            ctx.setLineDash([22, 14]);
            ctx.strokeRect(12, 12, canvas.width - 24, canvas.height - 24);
            ctx.setLineDash([]);

            ctx.fillStyle = '#d2271e';
            ctx.font = '700 44px "PingFang SC", "Microsoft YaHei", Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('GIF 动图待替换', canvas.width / 2, 82);

            ctx.fillStyle = '#8f1d18';
            ctx.font = '500 30px "PingFang SC", "Microsoft YaHei", Arial, sans-serif';
            ctx.fillText(displayName, canvas.width / 2, 142);
            return canvas.toDataURL('image/png');
        }
        
        /**
         * 增加图片使用计数
         * @param {string} dataUrl - 图片的 data URL
         */
         function incrementImageUseCount(imageRef) {
            if (uploadedImages[imageRef]) {
                uploadedImages[imageRef].useCount++;
                return;
            }
            for (const filename of Object.keys(uploadedImages)) {
                if (uploadedImages[filename].displayDataUrl === imageRef) {
                    uploadedImages[filename].useCount++;
                    break;
                }
            }
        }
        
        /**
         * 根据引用文本查找匹配的图片（优先级：精确 > 包含 > 模糊）
         * @param {string} refText - 引用文本（如「图1」、「动图演示」）
         * @returns {{ filename, dataUrl, width, height, mimeType } | null}
         */
        function findImageByReference(refText, useCopyDataUrl = false) {
            const refLower = refText.toLowerCase();
            
            // 1. 精确匹配完整文件名（包含扩展名）
            for (const filename of Object.keys(uploadedImages)) {
                const displayName = uploadedImages[filename].displayName || filename;
                if (displayName.toLowerCase() === refLower) {
                    return getUploadedImageInfo(filename, useCopyDataUrl);
                }
            }
            
            // 2. 精确匹配文件名（不含扩展名）
            for (const filename of Object.keys(uploadedImages)) {
                const nameWithoutExt = filename.replace(/\.[^.]+$/, '').toLowerCase();
                if (nameWithoutExt === refLower) {
                    return getUploadedImageInfo(filename, useCopyDataUrl);
                }
            }
            
            // 3. 完整文件名以引用文本开头
            for (const filename of Object.keys(uploadedImages)) {
                const displayName = uploadedImages[filename].displayName || filename;
                if (displayName.toLowerCase().startsWith(refLower)) {
                    return getUploadedImageInfo(filename, useCopyDataUrl);
                }

        /* ==================== 文本格式化工具 ==================== */
        
        /**
         * 处理行内格式：加粗、标蓝、加粗标蓝

         * @param {boolean} skipWrapper - 是否跳过基础span包装
          * @returns {string} 处理后的HTML
          */
function processTextSpacing(text) {
            // 保护微信小程序链接，避免「://」和路径斜杠被空格规则拆开
            const miniProgramTokens = [];
            const miniProgramPattern = /#小程序:\/\/[^\s]+/g;
            text = text.replace(miniProgramPattern, (match) => {
                const token = `__MINI_PROGRAM_TOKEN_${miniProgramTokens.length}__`;
                miniProgramTokens.push(match);
                return token;
            });

            // 保护 URL 避免被斜杠规则影响
            const urlTokens = [];
            const urlPattern = /https?:\/\/[^\s]+/g;
            text = text.replace(urlPattern, (match) => {
                const token = `__URL_TOKEN_${urlTokens.length}__`;
                urlTokens.push(match);
                return token;
            });

            // 保护行内代码（反引号包裹的内容）避免被斜杠规则影响
            const inlineCodeTokens = [];
            const inlineCodePattern = /`([^`]+?)`/g;
            text = text.replace(inlineCodePattern, (match, content) => {
                const token = `__INLINE_CODE_${inlineCodeTokens.length}__`;
                inlineCodeTokens.push(match); // 保留原始文本，包括反引号
                return token;
            });

            // 中英文混排加空格（使用预编译正则）
            text = text.replace(REGEX_PATTERNS.cnEnBefore, '$1 $2');
            text = text.replace(REGEX_PATTERNS.enCnBefore, '$1 $2');

            // 数字和中文之间加空格
            text = text.replace(REGEX_PATTERNS.cnDigitBefore, '$1 $2');
            text = text.replace(REGEX_PATTERNS.digitCnBefore, '$1 $2');

            // 中文括号转换：「（」改为「 (」，「）」改为「) 」
            text = text.replace(/（/g, ' (');
            text = text.replace(/）/g, ') ');
            text = text.replace(REGEX_PATTERNS.multiSpace, ' ');

            // 中文弯引号和英文直双引号转换为直角引号
            let inQuote = false;
            text = text.replace(/(\u201C|\u201D|")/g, () => {
                inQuote = !inQuote;
                return inQuote ? '「' : '」';
            });

            // 破折号两侧加空格
            text = text.replace(/\s*——\s*/g, ' —— ');

            // 数字后的加号属于数量表达，例如「50+ 商家」；文字连接符两侧加空格，例如「暴晒 + 闷热」
            text = text.replace(REGEX_PATTERNS.numberPlusBeforeText, '$1+ ');
            text = text.replace(REGEX_PATTERNS.plusBetweenText, '$1 + ');

            // 斜杠两侧加空格（仅对普通文字，不处理已保护的 URL 和行内代码）
            text = text.replace(/\s*\/\s*/g, ' / ');

            // 恢复行内代码令牌
            inlineCodeTokens.forEach((code, index) => {
                const token = `__INLINE_CODE_${index}__`;
                text = text.replace(token, code);
            });

            // 恢复 URL 令牌
            urlTokens.forEach((url, index) => {
                const token = `__URL_TOKEN_${index}__`;
                text = text.replace(token, url);
            });

            // 恢复微信小程序链接令牌
            miniProgramTokens.forEach((link, index) => {
                const token = `__MINI_PROGRAM_TOKEN_${index}__`;
                text = text.replace(token, link);
            });

            return text;
        }

                sql: 'SELECT|FROM|WHERE|AND|OR|NOT|IN|IS|NULL|AS|ON|JOIN|LEFT|RIGHT|INNER|OUTER|FULL|CROSS|GROUP|BY|HAVING|ORDER|ASC|DESC|LIMIT|OFFSET|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|ALTER|DROP|INDEX|VIEW|TRIGGER|FUNCTION|PROCEDURE|PRIMARY|KEY|FOREIGN|REFERENCES|UNIQUE|CHECK|DEFAULT|CONSTRAINT|CASCADE|EXISTS|BETWEEN|LIKE|CASE|WHEN|THEN|ELSE|END|UNION|ALL|DISTINCT|COUNT|SUM|AVG|MIN|MAX|COALESCE|IF|IFNULL|CONCAT|SUBSTRING|TRIM|UPPER|LOWER|LENGTH|NOW|DATE|CAST',
                yaml: 'true|false|null|yes|no|on|off',

                dockerfile: ''
            };

            // 1. 注释（先处理，避免被其他规则干扰）
            if (lang === 'python' || lang === 'ruby' || lang === 'yaml' || lang === 'shell' || lang === 'bash') {
                html = html.replace(/(#.*)$/gm, '<span style="color:#6a9955;">$1</span>');
            }
            if (['javascript','typescript','java','c','cpp','go','rust','css','json','kotlin','swift','dart'].includes(lang)) {
                html = html.replace(/(\/\/.*)$/gm, '<span style="color:#6a9955;">$1</span>');
                html = html.replace(/(\/\*[\s\S]*?\*\/)/g, '<span style="color:#6a9955;">$1</span>');
            }
            if (lang === 'html' || lang === 'xml') {
                html = html.replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span style="color:#6a9955;">$1</span>');
            }
            if (lang === 'sql') {
                html = html.replace(/(--.*)$/gm, '<span style="color:#6a9955;">$1</span>');
            }

            // 2. 字符串
            html = html.replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)/g, '<span style="color:#ce9178;">$1</span>');
            html = html.replace(/(&#39;(?:[^&]|&(?!#39;))*?&#39;)/g, '<span style="color:#ce9178;">$1</span>');
            // 模板字符串
            html = html.replace(/(`[^`]*`)/g, '<span style="color:#ce9178;">$1</span>');

            // 3. 数字
            html = html.replace(/\b(\d+\.?\d*(?:e[+-]?\d+)?)\b/gi, '<span style="color:#b5cea8;">$1</span>');

            // 4. 关键词
            const kw = keywords[lang];
            if (kw) {
                const kwPattern = new RegExp('\\b(' + kw + ')\\b', lang === 'sql' ? 'g' : 'g');
                html = html.replace(kwPattern, '<span style="color:#c586c0;">$1</span>');
            }

            // 5. 函数调用
            html = html.replace(/\b([a-zA-Z_]\w*)\s*\(/g, '<span style="color:#dcdcaa;">$1</span>(');

            // 6. JSON 特殊处理
            if (lang === 'json') {
                html = html.replace(/(&quot;[^&]*?&quot;)\s*:/g, '<span style="color:#9cdcfe;">$1</span>:');
                html = html.replace(/:\s*(&quot;[^&]*?&quot;)/g, ': <span style="color:#ce9178;">$1</span>');
                html = html.replace(/:\s*(true|false|null)\b/g, ': <span style="color:#569cd6;">$1</span>');
            }

            // 7. HTML tag names
            if (lang === 'html' || lang === 'xml') {
                html = html.replace(/(&lt;\/?)([\w-]+)/g, '$1<span style="color:#569cd6;">$2</span>');
                html = html.replace(/\b([\w-]+)(=)/g, '<span style="color:#9cdcfe;">$1</span>$2');
            }

            return html;

        function preserveCodeLineWhitespace(lineHtml) {
            return lineHtml
                .replace(/^ +/, spaces => '&nbsp;'.repeat(spaces.length))
                .replace(/\t/g, '&nbsp;&nbsp;&nbsp;&nbsp;')
                .replace(/ {2}/g, '&nbsp;&nbsp;');
        }

        function formatCodeLinesForWeChat(code, language) {
            return code.split('\n').map(line => {
                const highlightedLine = highlightCode(line, language);
                const preservedLine = preserveCodeLineWhitespace(highlightedLine);
                return preservedLine || '&nbsp;';
            }).join('<br>');
        }

        const codeKeywordMap = {
