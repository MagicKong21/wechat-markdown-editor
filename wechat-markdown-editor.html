<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信公众号 Markdown 渲染编辑器</title>
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/wechat-markdown-editor/assets/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/wechat-markdown-editor/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/wechat-markdown-editor/assets/icons/favicon-16x16.png">
    <!-- 
        微信公众号 Markdown 渲染编辑器
        
        功能特性：
        - Markdown 到微信公众号 HTML 的转换
        - 商品卡片组件支持（自动匹配二维码图片）
        - 图片上传与 QR 码自动替换
        - 淘口令批量更新
        - 快捷键支持 (Cmd+B 加粗、Cmd+E 高亮、Cmd+U 加粗高亮、Cmd+K 行内代码、Cmd+Shift+K 代码块)
        - 撤销/重做功能
        
        技术栈：
        - 原生 HTML/CSS/JavaScript
        - Font Awesome 图标库
        - jsQR 二维码识别
        - QRCode.js 二维码生成
    -->
    
    <!-- 外部资源 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="assets/vendor/jsQR.min.js"></script>
    <script src="assets/vendor/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    
    <!-- ==================== 样式区域 ==================== -->
    <style>
        :root {
            --radius-sm: 7px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --border-subtle: rgba(255, 255, 255, 0.10);
            --border-strong: rgba(255, 255, 255, 0.16);
            --shadow-panel: 0 20px 70px rgba(0, 0, 0, 0.34);
            --shadow-float: 0 22px 70px rgba(0, 0, 0, 0.42);
            --surface: rgba(17, 20, 29, 0.74);
            --surface-solid: rgba(18, 21, 30, 0.94);
            --surface-raised: rgba(255, 255, 255, 0.055);
            --control-bg: rgba(255, 255, 255, 0.045);
            --text-strong: #f6f7fb;
            --text-muted: #9aa4b2;
            --accent: #8b5cf6;
            --accent-2: #22d3ee;
        }

        /* 全局基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", Arial, sans-serif;
        }
        
        /* 页面主体 */
        body {
            background:
                linear-gradient(135deg, rgba(139, 92, 246, 0.18), transparent 34%),
                linear-gradient(215deg, rgba(34, 211, 238, 0.13), transparent 36%),
                linear-gradient(180deg, #080a12 0%, #0d101a 48%, #11131e 100%);
            color: var(--text-strong);
            line-height: 1.6;
            padding: 15px;
            max-width: 1600px;
            margin: 0 auto;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.55), transparent 72%);
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.035);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.16);
            border: 3px solid transparent;
            border-radius: 999px;
            background-clip: padding-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.24);
            border: 3px solid transparent;
            background-clip: padding-box;
        }
        
        /* 页面标题区域 */
        header {
            flex-shrink: 0;
            text-align: center;
            padding: 10px 0;
            border-bottom: 1px solid #eaeaea;
            margin-bottom: 10px;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 4px;
            font-size: 20px;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 12px;
            line-height: 1.4;
        }

        /* ==================== 布局样式 ==================== */
        /* 编辑区与预览区容器 */
        .container {
            display: flex;
            flex-wrap: nowrap;
            gap: 16px;
            flex: 1;
            min-height: 0;
        }
        
        /* 编辑器/预览容器通用样式 */
        .editor-container, .preview-container {
            flex: 1;
            min-width: 300px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-panel);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.035)),
                var(--surface);
            backdrop-filter: blur(22px) saturate(1.1);
            display: flex;
            flex-direction: column;
        }

        /* 面板头部 */
        .panel-header {
            flex-shrink: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.03));
            color: var(--text-strong);
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            border-bottom: 1px solid var(--border-subtle);
            backdrop-filter: blur(22px);
        }

        .panel-header h2 {
            font-size: 13px;
            font-weight: 650;
            letter-spacing: 0;
        }
        
        /* 头部内的小按钮 */
        .panel-header .btn-sm {
            padding: 4px 10px;
            font-size: 12px;
            border-radius: var(--radius-sm);
        }
        
        .panel-header i {
            font-size: 16px;
            color: rgba(246, 247, 251, 0.82);
        }
        
        /* 面板内容区 */
        .panel-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .editor-container .panel-content {
            overflow: hidden;
        }
        
        /* Markdown 输入框 */
        #markdown-input {
            width: 100%;
            height: 100%;
            border: none;
            padding: 15px;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            outline: none;
            background-color: rgba(7, 10, 18, 0.42);
            color: #e8ecf4;
            caret-color: var(--accent-2);
            overflow-y: auto;
            scrollbar-width: none;
        }

        #markdown-input::-webkit-scrollbar {
            display: none;
        }

        #markdown-input::placeholder {
            color: rgba(154, 164, 178, 0.72);
        }
        
        #preview-content {
            padding: 24px 32px;
            height: 100%;
            overflow-y: auto;
            background: #ffffff;
            font-size: 13px;
        }

        /* ========== 微信公众号样式模拟 ========== */
        .wx-article {
            max-width: 677px;
            margin: 0 auto;
            background-color: white;
            color: #333333;
            padding: 10px;
            box-shadow: none;
        }
        
        .wx-article img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        
        .wx-article p {
            margin: 10px 0;
            line-height: 1.8;
            font-size: 14px;
        }
        
        .wx-article .product-card-section p,
        .wx-article .activity-card-section p {
            margin: 4px 0;
            line-height: 1.5;
        }
        
        /* 一级标题样式 */
        .wx-article .level1-title {
            white-space: normal;
            text-align: left !important;
            margin: 0 !important;
            display: flex;
            align-items: flex-end;
            width: 100%;
            clear: both;
            float: none !important;
        }
        
        .wx-article .level1-title img {
            width: 50px !important;
            height: 50px !important;
            margin-right: 8px;
            vertical-align: middle;
            float: none !important;
            flex-shrink: 0;
        }
        
        .wx-article .level1-title .title-text {
            font-size: 16px;
            color: rgb(33, 150, 243);
            font-weight: bold;
            text-align: left !important;
            display: inline-block;
            vertical-align: middle;
            line-height: 1.4;
            flex: 1;
        }
        
        /* 二级标题样式 */
        .wx-article .level2-title {
            margin: 0 !important;
            text-align: center;
            width: 100%;
            clear: both;
            float: none !important;
        }
        
        .wx-article .level2-title .title-box {
            display: inline-block;
            background-color: rgb(51, 173, 255);
            padding: 0;
            border-radius: 0;
            position: relative;
            height: auto;
        }
        
        .wx-article .level2-title .title-box-inner {
            background-color: rgb(39, 218, 241);
            padding: 0 10px;
            margin: 0;
            transform: translate(-6px, -6px);
        }
        
        .wx-article .level2-title .title-text {
            font-size: 15px;
            color: rgb(242, 249, 255);
            line-height: 2;
            padding: 0;
            margin: 0;
            font-weight: bold;
        }
        
        /* 列表样式 */
        .wx-article ul,
        .wx-article ol {
            class: "list-paddingleft-1" !important;
            margin: 10px 0 !important;
            padding-left: 20px !important;
        }

        .wx-article ul {
            list-style-type: disc !important;
        }

        .wx-article ol {
            list-style-type: decimal !important;
        }
        
        .wx-article li {
            margin-bottom: 6px !important;
            line-height: 1.6;
            font-size: 14px;
        }
        
        .wx-article li p {
            margin: 0px !important;
            text-align: left !important;
            line-height: 1.6em !important;
        }
        
        .wx-article .highlight {
            color: #33adff;
            font-weight: bold;
        }
        
        /* 灰色底框 */
        .wx-article .link-box {
            margin: 0 auto !important;
            padding: 10px;
            background-color: rgb(239, 239, 239);
            border-radius: 11px;
            text-align: center;
            font-size: 12px;
            line-height: 1.6;
            width: 556px;
            max-width: 100%;
            border-width: 2px;
            border-style: none;
            border-color: rgb(192, 200, 209);
            clear: both;
            float: none !important;
        }
        
        .wx-article .link-box strong {
            color: #333;
            font-weight: bold;
        }
        
        .wx-article .link-box a {
            color: #2196F3;
            text-decoration: none;
            word-break: break-all;
        }
        
        /* 分隔线样式 */
        .wx-article .divider {
            border-style: solid;
            border-width: 1px 0 0;
            border-color: rgba(0,0,0,0.1);
            -webkit-transform-origin: 0 0;
            -webkit-transform: scale(1, 0.5);
            transform-origin: 0 0;
            transform: scale(1, 0.5);
            margin: 0 0 10px 0 !important;
        }
        
        /* 底部样式 */
        .wx-article .footer-disclosure-line {
            display: block;
            width: 100%;
            box-sizing: border-box;
            text-align: right;
            text-indent: 0em;
            margin: 0 !important;
            padding: 0 0 2px 0;
            height: 20px;
            line-height: 18px;
            color: #888888;
            font-size: 12px;
            overflow: visible;
        }
        
        .wx-article .footer-img {
            text-align: center;
            margin: 4px 0 !important;
            line-height: 0;
        }

        .wx-article .footer-jump-image {
            margin: 4px 0 !important;
            font-size: 0;
            line-height: 0;
        }

        .wx-article .footer-jump-image .ProseMirror-separator,
        .wx-article .footer-jump-image .ProseMirror-trailingBreak {
            display: none !important;
        }
        
        .wx-article .footer-text {
            text-align: right;
            margin: 5px 0;
        }
        
        .wx-article .footer-text .heart-text {
            font-size: 12px;
            background-color: rgb(0, 179, 255);
            color: rgb(255, 255, 255);
            padding: 2px 6px;
            border-radius: 3px;
        }
        
        .wx-article .footer-gif {
            text-align: right;
            margin: 2px 0 10px 0;
        }
        
        .wx-article .footer-gif img {
            width: 72px !important;
            height: auto !important;
            display: inline-block;
            float: right;
        }

        /* ========== 功能区样式 ========== */
        .controls {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 14px 16px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.025)),
                rgba(8, 10, 16, 0.56);
            border-top: 1px solid var(--border-subtle);
            position: relative;
            margin-top: 0;
        }

        .editor-container .controls {
            border-radius: 0;
            box-shadow: none;
        }

        .controls .btn {
            padding: 9px 13px;
            font-size: 13px;
        }
        
        /* 图片上传区域 */
        .image-upload-area {
            position: relative;
        }
        
        .image-upload-input {
            display: none;
        }

        .typography-area {
            position: relative;
        }

        .typography-popover {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 10px);
            width: 260px;
            padding: 12px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-lg);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.055)),
                rgba(14, 17, 26, 0.94);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.24);
            backdrop-filter: blur(22px) saturate(1.15);
            opacity: 0;
            visibility: hidden;
            transform: translate(-50%, 6px);
            transition: opacity 0.16s ease, transform 0.16s ease, visibility 0.16s ease;
            z-index: 20;
        }

        .typography-popover.is-open {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
        }

        .typography-popover-title {
            margin: 0 0 14px;
            padding: 0 34px 11px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.11);
            color: rgba(255, 255, 255, 0.92);
            font-size: 13px;
            font-weight: 700;
            text-align: center;
        }

        .typography-reset {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 28px;
            height: 28px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.78);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.16s ease, color 0.16s ease, transform 0.16s ease;
        }

        .typography-reset:hover {
            background: linear-gradient(135deg, #2ea8ff, #1677ff);
            color: #ffffff;
            transform: rotate(-18deg);
        }

        .typography-style-row {
            display: grid;
            grid-template-columns: 54px 135px;
            align-items: center;
            justify-content: center;
            column-gap: 8px;
            margin-top: 10px;
        }

        .typography-style-label {
            color: rgba(255, 255, 255, 0.68);
            font-size: 12px;
            white-space: nowrap;
            min-width: 54px;
        }

        .typography-stepper {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            width: 135px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.06);
            padding: 3px;
        }

        .typography-stepper button {
            width: 28px;
            height: 28px;
            border: 0;
            border-radius: calc(var(--radius-sm) - 2px);
            color: rgba(255, 255, 255, 0.86);
            background: rgba(255, 255, 255, 0.08);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            line-height: 1;
            transition: background 0.16s ease, color 0.16s ease;
        }

        .typography-stepper button:hover {
            background: linear-gradient(135deg, #2ea8ff, #1677ff);
            color: #ffffff;
        }

        .typography-stepper input {
            flex: 1;
            width: 0;
            height: 28px;
            border: 0;
            border-radius: calc(var(--radius-sm) - 2px);
            background: rgba(255, 255, 255, 0.10);
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            outline: none;
            appearance: textfield;
        }

        .typography-stepper input::-webkit-outer-spin-button,
        .typography-stepper input::-webkit-inner-spin-button {
            margin: 0;
            appearance: none;
        }

        .typography-segmented {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            width: 135px;
            box-sizing: border-box;
            padding: 3px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.06);
        }

        .typography-segmented button {
            flex: 1;
            min-width: 0;
            height: 28px;
            border: 0;
            border-radius: calc(var(--radius-sm) - 2px);
            color: rgba(255, 255, 255, 0.70);
            background: transparent;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
        }

        .typography-segmented button.is-active {
            color: #ffffff;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.06)),
                rgba(255, 255, 255, 0.10);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .image-backdrop-dialog {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(4, 6, 12, 0.72);
        }
        .image-backdrop-dialog.is-open { display: flex; }
        .image-backdrop-card {
            width: min(920px, 100%);
            max-height: min(720px, calc(100vh - 40px));
            overflow: hidden;
            padding: 18px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-lg);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.045)), var(--surface-solid);
            box-shadow: var(--shadow-float);
            color: var(--text-strong);
            backdrop-filter: blur(24px) saturate(1.15);
        }
        .image-backdrop-card h3 { margin: 0 0 18px; padding: 0 0 14px; border-bottom: 1px solid rgba(255,255,255,.11); color: var(--text-strong); font-size: 16px; text-align: center; }
        .image-backdrop-body { display: grid; grid-template-columns: minmax(320px, 360px) minmax(0, 1fr); align-items: stretch; gap: 20px; min-height: 470px; }
        .image-backdrop-preview { display: grid; place-items: center; min-width: 0; padding: 20px; border: 1px solid rgba(255,255,255,.10); border-radius: var(--radius-md); background-color: #151925; background-image: linear-gradient(45deg, rgba(255,255,255,.055) 25%, transparent 25%), linear-gradient(-45deg, rgba(255,255,255,.055) 25%, transparent 25%), linear-gradient(45deg, transparent 75%, rgba(255,255,255,.055) 75%), linear-gradient(-45deg, transparent 75%, rgba(255,255,255,.055) 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0; overflow: hidden; }
        .image-backdrop-preview-stage { position: relative; display: grid; place-items: center; width: 100%; max-width: 480px; max-height: 430px; overflow: hidden; background-color: #8cc6ff; background-repeat: no-repeat; background-position: top center, bottom center; background-size: 100% auto, 100% auto; box-shadow: 0 18px 42px rgba(0,0,0,.28); }
        .image-backdrop-preview-stage.is-transparent { box-shadow: none; background-color: transparent; background-image: none !important; }
        .image-backdrop-preview-stage img { display: block; width: auto; height: auto; max-width: none; max-height: none; transform: scale(var(--foreground-scale, .9)); transform-origin: center; filter: var(--foreground-shadow, none); border-radius: var(--foreground-radius, 0); }
        .image-backdrop-options { width: 100%; margin: 0 auto; }
        .image-backdrop-option { display: grid; grid-template-columns: 88px minmax(0, 1fr); align-items: center; gap: 12px; margin: 12px 0; font-size: 14px; color: var(--text-strong); }
        .image-backdrop-option > span { text-align: right; }
        .image-backdrop-option .typography-segmented { justify-self: start; }
        .image-backdrop-option.is-disabled { color: var(--text-muted); opacity: .42; }
        .image-backdrop-option.is-disabled button,
        .image-backdrop-option.is-disabled input { cursor: not-allowed; }
        .image-backdrop-option.is-disabled .typography-segmented,
        .image-backdrop-option.is-disabled .typography-stepper { pointer-events: none; }
        .image-backdrop-range-control { display: grid; grid-template-columns: minmax(0, 1fr) 58px; align-items: center; gap: 10px; width: 100%; }
        .image-backdrop-range-control input[type="range"] { width: 100%; accent-color: #4a9cff; cursor: pointer; }
        .image-backdrop-range-value { color: #4a9cff; font-size: 13px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
        .image-backdrop-gap-control { width: 135px; justify-self: start; }
        .image-backdrop-aspect-control { width: 135px; justify-self: start; }
        .image-backdrop-scale-value { display: inline-flex; flex: 1; align-items: center; height: 28px; min-width: 0; border-radius: calc(var(--radius-sm) - 2px); background: rgba(255,255,255,.10); }
        .image-backdrop-scale-control input { flex: 1; width: 0; min-width: 0; height: 100%; padding: 0 2px 0 6px; border: 0; outline: 0; color: #fff; background: transparent; font: inherit; font-size: 13px; font-weight: 700; text-align: right; }
        .image-backdrop-scale-control input::-webkit-inner-spin-button, .image-backdrop-scale-control input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

<body>
    <!-- 核心区域：编辑区+预览区 -->
    <div class="container">
        <div class="editor-container">
            <div class="panel-header">
                <i class="fas fa-edit"></i>
                <h2>Markdown 编辑区</h2>
                <div class="more-actions" id="more-actions">
                    <button class="btn btn-sm" id="more-actions-btn" type="button" aria-expanded="false" aria-haspopup="menu">
                        <i class="fas fa-ellipsis-h"></i> 更多功能
                    </button>
                    <div class="more-actions-menu" id="more-actions-menu" role="menu">
                        <button type="button" id="example-btn" role="menuitem">
                            <i class="fas fa-file-alt"></i> 加载示例
                        </button>
                        <button type="button" id="clear-btn" role="menuitem">
                            <i class="fas fa-broom"></i> 清空标记符
                        </button>
                        <button type="button" id="bold-to-highlight-btn" role="menuitem">
                            <i class="fas fa-bold"></i> 加粗转高亮
                        </button>
                        <button type="button" id="highlight-to-bold-btn" role="menuitem">
                            <i class="fas fa-highlighter"></i> 高亮转加粗
                        </button>
                        <button type="button" id="update-taokouling-btn" role="menuitem">
                            <i class="fas fa-key"></i> 更新淘口令
                        </button>
                        <button type="button" id="custom-tracking-btn" role="menuitem">
                            <i class="fas fa-link"></i> 自定义跟踪参数
                        </button>
                    </div>
                </div>
            </div>
            <div class="panel-content">
                <textarea id="markdown-input" placeholder="在这里输入 Markdown 文本...（点击右上角「更多功能」可加载示例）"></textarea>
            </div>
            <!-- ==================== 控制按钮区 ==================== -->
            <div class="controls">
                <button class="btn" id="copy-btn">
                    <i class="fas fa-copy"></i> 复制预览内容
                </button>
                <button class="btn btn-primary" id="copy-body-btn">
                    <i class="fas fa-file-lines"></i> 仅复制正文
                </button>
                <div class="image-upload-area">
                    <input type="file" id="image-upload" class="image-upload-input" multiple accept="image/*,.heic,.heif">
                    <button class="btn" id="image-upload-trigger" onclick="document.getElementById('image-upload').click()">
                        <i class="fas fa-image"></i> 上传图片
                    </button>
                </div>
                <div class="typography-area">
                    <button class="btn" id="typography-trigger" type="button" aria-expanded="false">
                        <i class="fas fa-sliders-h"></i> 排版样式
                    </button>
                    <div class="typography-popover" id="typography-popover">
                        <p class="typography-popover-title">排版样式</p>
                        <button class="typography-reset" id="typography-reset" type="button" title="重置为默认排版">
                            <i class="fas fa-undo-alt"></i>
                        </button>
                        <div class="typography-style-row" data-typography-row="fontSize">
                            <span class="typography-style-label">字号</span>
                            <div class="typography-stepper">
                                <button type="button" data-typography-step="fontSize" data-direction="-1">-</button>
                                <input type="number" data-typography-input="fontSize" min="12" max="22" step="1" inputmode="decimal">
                                <button type="button" data-typography-step="fontSize" data-direction="1">+</button>
                            </div>
                        </div>
                        <div class="typography-style-row" data-typography-row="lineHeight">
                            <span class="typography-style-label">行距</span>
                            <div class="typography-stepper">
                                <button type="button" data-typography-step="lineHeight" data-direction="-1">-</button>
                                <input type="number" data-typography-input="lineHeight" min="1.2" max="2.4" step="0.05" inputmode="decimal">
                                <button type="button" data-typography-step="lineHeight" data-direction="1">+</button>
                            </div>
                        </div>
                        <div class="typography-style-row" data-typography-row="marginX">
                            <span class="typography-style-label">边距</span>
                            <div class="typography-stepper">
                                <button type="button" data-typography-step="marginX" data-direction="-1">-</button>
                                <input type="number" data-typography-input="marginX" min="0" max="32" step="1" inputmode="decimal">
                                <button type="button" data-typography-step="marginX" data-direction="1">+</button>
                            </div>
                        </div>
                        <div class="typography-style-row" data-typography-row="letterSpacing">
                            <span class="typography-style-label">字距</span>
                            <div class="typography-stepper">
                                <button type="button" data-typography-step="letterSpacing" data-direction="-1">-</button>
                                <input type="number" data-typography-input="letterSpacing" min="0" max="2" step="0.1" inputmode="decimal">
                                <button type="button" data-typography-step="letterSpacing" data-direction="1">+</button>
                            </div>
                        </div>
                        <div class="typography-style-row" data-typography-row="align">
                            <span class="typography-style-label">文字对齐</span>
                            <div class="typography-segmented" role="group" aria-label="正文对齐方式">
                                <button type="button" data-typography-align="left">左</button>
                                <button type="button" data-typography-align="justify">两端</button>
                            </div>
                        </div>
                        <div class="typography-style-row" data-typography-row="tableAlign">
                            <span class="typography-style-label">表格对齐</span>
                            <div class="typography-segmented" role="group" aria-label="表格内容对齐方式">
                                <button type="button" data-typography-table-align="left">左</button>
                                <button type="button" data-typography-table-align="center">中间</button>
                            </div>
                        </div>
                        <div class="typography-style-row" data-typography-row="imageAlign">
                            <span class="typography-style-label">图片对齐</span>
                            <div class="typography-segmented" role="group" aria-label="并排图片对齐方式">
                                <button type="button" data-typography-image-align="height">等高</button>
                                <button type="button" data-typography-image-align="width">等宽</button>
                            </div>
                        </div>
                        <div class="typography-style-row" data-typography-row="imageBackdrop">
                            <span class="typography-style-label">图片加底</span>
                            <div class="typography-segmented" role="group" aria-label="图片加底模式">
                                <button type="button" data-typography-image-backdrop="on">自动</button>
                                <button type="button" data-typography-image-backdrop="off">关闭</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="preview-container">
            <div class="panel-header">
                <i class="fas fa-eye"></i>
                <h2>微信公众号预览</h2>
                <span id="preview-stats" style="font-size: 12px; color: #bbb; margin-left: 8px; display: flex; align-items: center; gap: 8px;"></span>
                <button class="btn btn-sm" id="personal-mode-btn" style="background: linear-gradient(135deg, #f39c12, #e67e22); color: white; margin-left: auto;">
                    <i class="far fa-star"></i> 个人模式
                </button>
            </div>
            <div class="panel-content">
                <div id="preview-content">
                    <div class="wx-article" id="wx-preview">
                        <!-- 预览内容动态生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="status-container"></div>
    
    <!-- ==================== 图片预览面板 ==================== -->
    <div id="image-preview-panel" class="image-preview-panel" style="display: none;">
        <button id="image-preview-tab" class="image-preview-tab" title="展开已上传图片">
            <i class="fas fa-chevron-left"></i>
            <span>已上传图片</span>
        </button>
        <h4>
            <span class="image-preview-title">已上传图片 <span style="font-size: 12px; color: #999; font-weight: normal;">(自动重写商品 / 活动卡片二维码)</span></span>
            <button id="image-panel-toggle" class="image-panel-toggle" title="收起到侧边栏">
                <i class="fas fa-chevron-right"></i>
            </button>
        </h4>
        <div id="image-preview-actions" style="display: grid; gap: 6px; margin-bottom: 6px;">
            <div class="image-package-download-group">
                <button id="btn-download-package" class="btn btn-sm btn-primary" style="padding: 5px 8px; font-size: 12px; justify-content: center;">
                    <span style="display: flex; align-items: center; gap: 6px;"><i class="fas fa-file-archive"></i> 打包下载</span>
                </button>
                <div class="image-package-options" aria-label="打包下载选项">
                    <label><input id="package-keep-original-name" type="checkbox">保留原名</label>
                    <label><input id="package-include-cards" type="checkbox">包含卡片</label>
                    <label><input id="package-merge-side-by-side" type="checkbox" checked>并排图合并</label>
                </div>
            </div>
            <button id="btn-delete-all" class="btn btn-sm btn-danger" style="padding: 5px 8px; font-size: 12px; justify-content: center;">
                <span style="display: flex; align-items: center; gap: 6px;"><i class="fas fa-trash"></i> 清空</span>
            </button>
        </div>
        <div id="image-preview-grid" class="image-preview-grid"></div>
    </div>
    
    <!-- 隐藏的复制容器（用于富文本复制） -->
    <div id="copy-container" contenteditable="true"></div>

    <div class="image-backdrop-dialog" id="image-backdrop-dialog" role="dialog" aria-modal="true" aria-labelledby="image-backdrop-title">
        <div class="image-backdrop-card">
            <h3 id="image-backdrop-title">图片美化设置</h3>
            <div class="image-backdrop-body">
              <div class="image-backdrop-options">
                <div class="image-backdrop-option"><span>图片加底</span><div class="typography-segmented" role="group" aria-label="当前图片加底"><button type="button" data-backdrop-dialog-option="enabled" data-value="on">开</button><button type="button" data-backdrop-dialog-option="enabled" data-value="off">关</button></div></div>
                <div class="image-backdrop-option" id="image-backdrop-gap-row" hidden><span>图片间隔</span><div class="typography-stepper image-backdrop-gap-control"><button type="button" data-backdrop-gap-delta="-2" aria-label="图片间隔减少 2 像素">−</button><div class="image-backdrop-scale-value"><input id="image-backdrop-gap" type="number" min="0" max="100" step="2" value="16" aria-label="并排图片间隔"><span>px</span></div><button type="button" data-backdrop-gap-delta="2" aria-label="图片间隔增加 2 像素">+</button></div></div>
                <div class="image-backdrop-option" data-backdrop-dependent="true"><span>背景样式</span><div class="image-backdrop-backgrounds" role="group" aria-label="背景样式">
                    <button type="button" class="image-backdrop-background" data-backdrop-background="lizhi" aria-label="荔枝默认" style="--tile-background:#8cc6ff"></button>
                    <button type="button" class="image-backdrop-background" data-backdrop-background="blue" aria-label="荔枝蓝" style="--tile-background:#3fb9ff"></button>
                    <button type="button" class="image-backdrop-background" data-backdrop-background="none" aria-label="无背景" style="--tile-background:linear-gradient(45deg,#dfe5ee 25%,#fff 25%,#fff 75%,#dfe5ee 75%) 0 0/14px 14px"></button>
                    <button type="button" class="image-backdrop-background" data-backdrop-background="aurora" aria-label="极光" style="--tile-background:linear-gradient(135deg,#a8edea,#fed6e3)"></button>
                    <button type="button" class="image-backdrop-background" data-backdrop-background="midnight" aria-label="午夜" style="--tile-background:linear-gradient(135deg,#1b2755,#6b4fa1)"></button>
                </div></div>
                <div class="image-backdrop-option" id="image-backdrop-scale-row" data-backdrop-dependent="true"><span>缩放比例</span><div class="image-backdrop-range-control"><input id="image-backdrop-scale" type="range" min="60" max="100" step="1" value="90" aria-label="当前图片缩放比例"><strong class="image-backdrop-range-value" id="image-backdrop-scale-value">90%</strong></div></div>
                <div class="image-backdrop-option" id="image-backdrop-aspect-row" data-backdrop-dependent="true"><span>长宽比例</span><div class="typography-segmented image-backdrop-aspect-control" role="group" aria-label="当前图片长宽比例"><button type="button" data-backdrop-dialog-option="aspect" data-value="native">原生</button><button type="button" data-backdrop-dialog-option="aspect" data-value="4:3">4:3</button></div></div>
                <div class="image-backdrop-option" data-backdrop-dependent="true"><span>阴影效果</span><div class="typography-segmented" role="group" aria-label="当前图片阴影"><button type="button" data-backdrop-dialog-option="shadow" data-value="on">开</button><button type="button" data-backdrop-dialog-option="shadow" data-value="off">关</button></div></div>
                <div class="image-backdrop-option" data-backdrop-dependent="true"><span>圆角效果</span><div class="typography-segmented" role="group" aria-label="当前图片圆角"><button type="button" data-backdrop-dialog-option="radius" data-value="on">开</button><button type="button" data-backdrop-dialog-option="radius" data-value="off">关</button></div></div>
                <div class="image-backdrop-option" id="image-backdrop-radius-row" data-backdrop-dependent="true"><span>圆角大小</span><div class="image-backdrop-range-control"><input id="image-backdrop-radius-size" type="range" min="0" max="64" step="1" value="32" aria-label="当前图片圆角大小"><strong class="image-backdrop-range-value" id="image-backdrop-radius-value">32 px</strong></div></div>
              </div>
              <div class="image-backdrop-preview"><div class="image-backdrop-preview-stage" id="image-backdrop-preview-stage"><img id="image-backdrop-preview-image" alt="当前图片效果预览"></div></div>
            </div>
            <div class="image-backdrop-actions"><button class="btn" type="button" id="image-backdrop-cancel">取消</button><button class="btn btn-primary" type="button" id="image-backdrop-save">应用到预览</button></div>
        </div>
    </div>

        // 个人模式开关
        let isPersonalMode = false;
        
        // 获取编辑器元素
        const textarea = document.getElementById('markdown-input');

        // 本地草稿自动保存
        const DRAFT_STORAGE_KEY = 'wechatMarkdownEditorDraft';
        const DRAFT_SAVED_AT_KEY = 'wechatMarkdownEditorDraftSavedAt';
        const TYPOGRAPHY_STORAGE_KEY = 'wechatMarkdownEditorTypography';
        const IMAGE_BACKDROP_STORAGE_KEY = 'wechatMarkdownEditorImageBackdropV3';
        const LEGACY_DEFAULT_TYPOGRAPHY_SETTINGS = {
            fontSize: 14,
            lineHeight: 2,
            marginX: 16,
            letterSpacing: 0,
            align: 'left',
            imageAlign: 'height',
            tableAlign: 'center',
            imageBackdrop: true
        };
        const DEFAULT_TYPOGRAPHY_SETTINGS = {
            fontSize: 15,
            lineHeight: 2,
            marginX: 16,
            letterSpacing: 0.5,
            align: 'justify',
            imageAlign: 'height',
            tableAlign: 'center',
            imageBackdrop: true
        };
        const TYPOGRAPHY_CONTROLS = {
            fontSize: { min: 12, max: 22, step: 1, precision: 0 },
            lineHeight: { min: 1.2, max: 2.4, step: 0.05, precision: 2 },
            marginX: { min: 0, max: 32, step: 1, precision: 0 },
            letterSpacing: { min: 0, max: 2, step: 0.1, precision: 1 }
        };
        let draftSaveTimer = null;
        let typographySettings = loadTypographySettings();
        
        // 防抖定时器
        let previewUpdateTimer = null;
        let previewRenderVersion = 0;
        let imagePreparationTimer = null;
        let imagePreparationVersion = 0;
        let scrollAnchorRebuildTimer = null;
        const PREVIEW_UPDATE_DELAY = 0; // 输入后的下一帧立即刷新，避免编辑与预览脱节

        // 编辑区与预览区同步滚动
        let isSynchronizingScroll = false;
        let scrollSyncFrame = null;
        let scrollSyncAnchors = [];
        let scrollSyncMirror = null;
        
        /* ==================== 预编译正则表达式（性能优化） ==================== */
        
        // 文本格式化正则（预编译避免重复创建）
        const REGEX_PATTERNS = {
            cnEnBefore: /([\u4e00-\u9fa5])([a-zA-Z])/g,
            enCnBefore: /([a-zA-Z])([\u4e00-\u9fa5])/g,
            cnDigitBefore: /([\u4e00-\u9fa5])(\d)/g,
            digitCnBefore: /(\d)([\u4e00-\u9fa5])/g,
            cnLParenBefore: /([\u4e00-\u9fa5])（/g,
            cnRParenAfter: /）([\u4e00-\u9fa5])/g,
            cnLParen: /（/g,
            cnRParen: /）/g,
            numberPlusBeforeText: /(\d+)\s*\+\s*(?=[\u4e00-\u9fa5A-Za-z])/g,
            plusBetweenText: /([\u4e00-\u9fa5A-Za-z])\s*\+\s*(?=[\u4e00-\u9fa5A-Za-z0-9])/g,
            multiSpace: /\s+/g
        };

        function saveDraftNow() {
            try {
                localStorage.setItem(DRAFT_STORAGE_KEY, textarea.value);
                localStorage.setItem(DRAFT_SAVED_AT_KEY, String(Date.now()));
            } catch (err) {
                console.warn('自动保存草稿失败:', err);
            }
        }

        function scheduleDraftSave() {
            clearTimeout(draftSaveTimer);
            draftSaveTimer = setTimeout(saveDraftNow, 400);
        }

        function restoreDraftIfAvailable() {
            const savedDraft = localStorage.getItem(DRAFT_STORAGE_KEY);
            if (savedDraft === null) return false;

            textarea.value = savedDraft;
            return true;
        }

        function loadTypographySettings() {
            const defaults = { ...DEFAULT_TYPOGRAPHY_SETTINGS };

            try {
                const saved = JSON.parse(localStorage.getItem(TYPOGRAPHY_STORAGE_KEY) || '{}');
                if (!saved || Object.keys(saved).length === 0) {
                    return defaults;
                }
                if (saved.fontSize === 'large') {
                    return {
                        fontSize: 16,
                        lineHeight: 2,
                        marginX: 8,
                        letterSpacing: 1,
                        align: 'left',
                        imageAlign: 'height',
                        tableAlign: 'center',
                        imageBackdrop: true
                    };
                }
                if (saved.fontSize === 'default') {
                    return defaults;
                }
                const isLegacyDefault = Object.keys(LEGACY_DEFAULT_TYPOGRAPHY_SETTINGS).every((key) => {
                    return saved[key] === LEGACY_DEFAULT_TYPOGRAPHY_SETTINGS[key];
                });
                if (isLegacyDefault) {
                    return defaults;
                }
                return {
                    fontSize: normalizeTypographyValue('fontSize', saved.fontSize, defaults.fontSize),
                    lineHeight: normalizeTypographyValue('lineHeight', saved.lineHeight, defaults.lineHeight),
                    marginX: normalizeTypographyValue('marginX', saved.marginX, defaults.marginX),
                    letterSpacing: normalizeTypographyValue('letterSpacing', saved.letterSpacing, defaults.letterSpacing),
                    align: saved.align === undefined ? defaults.align : (saved.align === 'justify' ? 'justify' : 'left'),
                    imageAlign: saved.imageAlign === undefined ? defaults.imageAlign : (saved.imageAlign === 'width' ? 'width' : 'height'),
                    tableAlign: saved.tableAlign === undefined ? defaults.tableAlign : (saved.tableAlign === 'left' ? 'left' : 'center'),
                    imageBackdrop: saved.imageBackdrop === undefined ? defaults.imageBackdrop : saved.imageBackdrop !== false
                };
            } catch (err) {
                return defaults;
            }
        }

        function saveTypographySettings() {
            try {
                localStorage.setItem(TYPOGRAPHY_STORAGE_KEY, JSON.stringify(typographySettings));
            } catch (err) {
                console.warn('排版样式保存失败:', err);
            }
        }

        function getBodyTypographyStyle() {
            const textAlign = typographySettings.align === 'justify' ? 'justify' : 'left';
            return {
                fontSize: `${typographySettings.fontSize}px`,
                lineHeight: `${formatTypographyValue('lineHeight', typographySettings.lineHeight)}em`,
                margin: `0px ${typographySettings.marginX}px`,
                letterSpacing: typographySettings.letterSpacing > 0 ? `${formatTypographyValue('letterSpacing', typographySettings.letterSpacing)}px` : 'normal',
                textAlign,
                textJustify: textAlign === 'justify' ? 'text-justify: inter-ideograph;' : '',
                color: typographySettings.fontSize >= 16 ? 'rgba(0, 0, 0, 0.9)' : 'rgb(34, 34, 34)'
            };
        }

        function normalizeTypographyValue(key, value, fallback) {
            const config = TYPOGRAPHY_CONTROLS[key];
            const number = Number(value);
            if (!Number.isFinite(number)) return fallback;
            const clamped = Math.min(config.max, Math.max(config.min, number));
            return Number(clamped.toFixed(config.precision));
        }

        function formatTypographyValue(key, value) {
            const precision = TYPOGRAPHY_CONTROLS[key].precision;
            return Number(value).toFixed(precision).replace(/\.?0+$/, '');
        }

        function setTypographyValue(key, value) {
            if (!TYPOGRAPHY_CONTROLS[key]) return;
            typographySettings[key] = normalizeTypographyValue(key, value, typographySettings[key]);
            saveTypographySettings();
            updateTypographyControls();
            immediateUpdatePreview();
        }

        function setTypographyAlign(align) {
            typographySettings.align = align === 'justify' ? 'justify' : 'left';
            saveTypographySettings();
            updateTypographyControls();
            immediateUpdatePreview();
        }

        function setTypographyImageAlign(imageAlign) {
            typographySettings.imageAlign = imageAlign === 'width' ? 'width' : 'height';
            saveTypographySettings();
            updateTypographyControls();
            immediateUpdatePreview();
        }

        function setTypographyTableAlign(tableAlign) {
            typographySettings.tableAlign = tableAlign === 'left' ? 'left' : 'center';
            saveTypographySettings();
            updateTypographyControls();
            immediateUpdatePreview();
        }

        function setTypographyImageBackdrop(value) {
            typographySettings.imageBackdrop = value !== 'off';
            saveTypographySettings();
            updateTypographyControls();
            immediateUpdatePreview();
        }

        function stepTypographyValue(key, direction) {
            const config = TYPOGRAPHY_CONTROLS[key];
            if (!config) return;
            const current = normalizeTypographyValue(key, typographySettings[key], 0);
            setTypographyValue(key, current + config.step * direction);
        }

        function resetTypographySettings() {
            typographySettings = { ...DEFAULT_TYPOGRAPHY_SETTINGS };
            saveTypographySettings();
            updateTypographyControls();
            immediateUpdatePreview();
            showStatus('已重置排版样式', 'success');
        }

        /**

         */
        function handlePastedImage(e) {
            const items = e.clipboardData.items;
            let imageItem = null;
            
            // 查找图片项目
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    imageItem = items[i];
                    break;
                }
            }
            
            if (!imageItem) return;
            
            e.preventDefault();
            
            // 获取图片文件
            const file = imageItem.getAsFile();
            if (!file) return;
            
            // 显示上传中状态
            pendingImageCount = 1;
            showUploadingStatus(1);
            
            // 处理图片
            processImageWithQR(file, true); // 标记为粘贴的图片
        }

        function isHeicFile(file) {
            const name = (file && file.name ? file.name : '').toLowerCase();
            const type = (file && file.type ? file.type : '').toLowerCase();
            return type === 'image/heic' || type === 'image/heif' || name.endsWith('.heic') || name.endsWith('.heif');
        }

        function isSupportedImageFile(file) {
            return !!file && ((file.type || '').startsWith('image/') || isHeicFile(file));
        }

        async function convertHeicToJpeg(file) {
            if (typeof heic2any !== 'function') {
                throw new Error('HEIC 转换库未加载');
            }

            const converted = await heic2any({
                blob: file,
                toType: 'image/jpeg',
                quality: 0.92
            });
            const jpegBlob = Array.isArray(converted) ? converted[0] : converted;
            const jpegName = file.name.replace(/\.(heic|heif)$/i, '.jpg') || `${file.name}.jpg`;
            return new File([jpegBlob], jpegName, {
                type: 'image/jpeg',
                lastModified: file.lastModified || Date.now()
            });
        }

        function finishImageProcessing(refreshPreview = true) {
            pendingImageCount--;
            if (pendingImageCount < 0) pendingImageCount = 0;

            if (Object.keys(uploadedImages).length > 0) {

        /**
         * 生成日期戳（格式: pYYMMDD，用于追踪参数）
         * @returns {string}
         */
        function getTodayStamp() {
            const d = new Date();
            const yy = String(d.getFullYear()).slice(-2);
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `p${yy}${mm}${dd}`;
        }

        function getTodayDateParam() {
            const d = new Date();
            const yyyy = String(d.getFullYear());
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}${mm}${dd}`;
        }

        function normalizeTrackingParamsTemplate(value) {
            const raw = String(value || '').trim();
            const queryPart = raw.includes('?') ? raw.split('?').slice(1).join('?') : raw;
            return queryPart
                .replace(/^\?+/, '')
                .replace(/^&+/, '');
        }

        function getResolvedTrackingParams() {
            if (isPersonalMode) {
                return `cid=${PERSONAL_MODE_CID}`;
            }

            const template = normalizeTrackingParamsTemplate(trackingParamsTemplate) || DEFAULT_TRACKING_PARAMS_TEMPLATE;
            return template
                .replace(/\{stamp\}/g, getTodayStamp())
                .replace(/\{date\}/g, getTodayDateParam());
        }

        function mergeTrackingParamsIntoUrl(originalUrl, trackingParamsText) {
            const params = new URLSearchParams(normalizeTrackingParamsTemplate(trackingParamsText));
            if (!params.toString()) return originalUrl;

            try {
                const parsedUrl = new URL(String(originalUrl));
                params.forEach((value, key) => {
                    parsedUrl.searchParams.set(key, value);
                });
                return parsedUrl.toString();
            } catch (err) {
                const [baseUrl, hash = ''] = String(originalUrl).split('#');
                const separator = baseUrl.includes('?') ? '&' : '?';
                return `${baseUrl}${separator}${params.toString()}${hash ? `#${hash}` : ''}`;
            }
        }
        
        /**
         * 更新二维码 URL 参数
         * @param {string} originalUrl - 原始二维码 URL
         * @returns {string} 更新后的 URL
         */
        function getNewQRUrl(originalUrl) {
            const todayStamp = getTodayStamp();
            
            // Search List 模板：更新 hmpl 参数
            if (originalUrl.includes('search_list')) {
                if (/([?&]hmpl=)p\d+/i.test(originalUrl)) {
                    return originalUrl.replace(/([?&]hmpl=)p\d+/i, `$1${todayStamp}`);
                }
                return mergeTrackingParamsIntoUrl(originalUrl, getResolvedTrackingParams());
            }
            // Products 模板：添加cid和hmpl参数
            if (originalUrl.includes('products')) {
                const baseUrl = originalUrl.split('?')[0];
                const trackingParams = getResolvedTrackingParams();
                return trackingParams ? `${baseUrl}?${trackingParams}` : baseUrl;
            }

            // 活动卡片常见为独立活动页，只需要补齐或刷新跟踪参数里的日期戳。
            return updateGenericQrTrackingDate(originalUrl);
        }

        function updateGenericQrTrackingDate(originalUrl) {
            const text = String(originalUrl || '');
            const todayStamp = getTodayStamp();

            if (/([?&]hmpl=)p\d+/i.test(text)) {
                return text.replace(/([?&]hmpl=)p\d+/i, `$1${todayStamp}`);
            }

            try {
                const parsedUrl = new URL(text);
                const hasTrackingSignal = ['cid', 'hmsr', 'hmpl', 'hmcu', 'utm_source', 'utm_medium', 'utm_campaign'].some((key) => {
                    return parsedUrl.searchParams.has(key);
                });
                if (hasTrackingSignal && !parsedUrl.searchParams.has('hmpl')) {
                    parsedUrl.searchParams.set('hmpl', todayStamp);
                    return parsedUrl.toString();
                }
            } catch (err) {
                // 非标准 URL 不强行拼参数，避免误改二维码文本。
            }

            return originalUrl;
        }

        function clampNumber(value, min, max) {
            return Math.min(max, Math.max(min, value));
        }

        function getProductQrTemplateBox(imageWidth, imageHeight) {
            const isNewCard = imageWidth <= 1000 && imageHeight <= 420;
            return {
                x: isNewCard ? 738 : 760,
                y: isNewCard ? 148 : 140,
                size: isNewCard ? 203 : 216,
                source: isNewCard ? 'product-new-template' : 'product-template'
            };
        }

        function getQrBoxFromLocation(location, imageWidth, imageHeight) {
            if (!location) return null;
            const points = [
                location.topLeftCorner,
                location.topRightCorner,
                location.bottomRightCorner,
                location.bottomLeftCorner
            ].filter(Boolean);
            if (points.length < 4) return null;

            const minX = Math.min(...points.map(point => point.x));
            const maxX = Math.max(...points.map(point => point.x));
            const minY = Math.min(...points.map(point => point.y));
            const maxY = Math.max(...points.map(point => point.y));
            const width = maxX - minX;
            const height = maxY - minY;
            const rawSize = Math.max(width, height);
            if (!Number.isFinite(rawSize) || rawSize < 24) return null;

            // jsQR 返回的是二维码主体角点；外扩一点把旧二维码的静区一起盖住。
            const padding = Math.max(3, Math.round(rawSize * 0.035));
            const centerX = (minX + maxX) / 2;
            const centerY = (minY + maxY) / 2;
            const size = Math.round(rawSize + padding * 2);
            return {
                x: Math.round(clampNumber(centerX - size / 2, 0, Math.max(0, imageWidth - size))),
                y: Math.round(clampNumber(centerY - size / 2, 0, Math.max(0, imageHeight - size))),
                size: Math.round(Math.min(size, imageWidth, imageHeight)),
                source: 'detected'
            };
        }

        function getReplacementQrBox(code, imageWidth, imageHeight) {
            const detectedBox = getQrBoxFromLocation(code && code.location, imageWidth, imageHeight);
            if (detectedBox) return detectedBox;

            const data = code && code.data ? code.data : '';
            if (data.includes('products')) {
                return getProductQrTemplateBox(imageWidth, imageHeight);
            }
            return null;
        }

        function rgbToHex(color) {
            const toHex = (value) => clampNumber(Math.round(value), 0, 255).toString(16).padStart(2, '0');
            return `#${toHex(color.r)}${toHex(color.g)}${toHex(color.b)}`;
        }

        function getColorLuminance(color) {
            return 0.299 * color.r + 0.587 * color.g + 0.114 * color.b;
        }

        function averageColorSamples(samples, fallback) {
            if (!samples.length) return fallback;
            const total = samples.reduce((acc, color) => {
                acc.r += color.r;
                acc.g += color.g;
                acc.b += color.b;
                return acc;
            }, { r: 0, g: 0, b: 0 });
            return {
                r: Math.round(total.r / samples.length),
                g: Math.round(total.g / samples.length),
                b: Math.round(total.b / samples.length)
            };
        }

        function getQrReplacementColors(ctx, box, canvasWidth, canvasHeight) {
            const x = clampNumber(Math.round(box.x), 0, canvasWidth - 1);
            const y = clampNumber(Math.round(box.y), 0, canvasHeight - 1);
            const width = clampNumber(Math.round(box.size), 1, canvasWidth - x);
            const height = clampNumber(Math.round(box.size), 1, canvasHeight - y);
            const imageData = ctx.getImageData(x, y, width, height);
            const data = imageData.data;
            const sampleStep = Math.max(1, Math.floor((width * height) / 22000));
            const samples = [];

            for (let i = 0; i < data.length; i += 4 * sampleStep) {
                if (data[i + 3] < 128) continue;
                const color = { r: data[i], g: data[i + 1], b: data[i + 2] };
                samples.push({ ...color, luminance: getColorLuminance(color) });
            }

            if (!samples.length) {
                return {
                    dark: { r: 0, g: 0, b: 0 },
                    light: { r: 255, g: 255, b: 255 }
                };
            }

            samples.sort((a, b) => a.luminance - b.luminance);
            const sliceSize = Math.max(8, Math.round(samples.length * 0.16));
            const dark = averageColorSamples(samples.slice(0, sliceSize), { r: 0, g: 0, b: 0 });
            const light = averageColorSamples(samples.slice(-sliceSize), { r: 255, g: 255, b: 255 });
            const contrast = Math.abs(getColorLuminance(light) - getColorLuminance(dark));

            return {
                dark: contrast >= 45 ? dark : { r: 0, g: 0, b: 0 },
                light: contrast >= 45 ? light : { r: 255, g: 255, b: 255 }
            };
        }

        async function drawReplacementQr(ctx, newQrUrl, box, canvasWidth, canvasHeight) {
            const colors = getQrReplacementColors(ctx, box, canvasWidth, canvasHeight);
            const qrCanvas = document.createElement('canvas');
            await QRCode.toCanvas(qrCanvas, newQrUrl, {
                margin: 1,
                width: box.size,
                errorCorrectionLevel: 'H',
                color: {
                    dark: rgbToHex(colors.dark),
                    light: rgbToHex(colors.light)
                }
            });

            ctx.fillStyle = rgbToHex(colors.light);
            ctx.fillRect(box.x, box.y, box.size, box.size);
            ctx.drawImage(qrCanvas, box.x, box.y, box.size, box.size);
        }

        async function reprocessUploadedProductQRCards() {
            const entries = Object.entries(uploadedImages);
            if (!entries.length) {
                immediateUpdatePreview();
                return 0;
            }

            let replacedCount = 0;
            for (const [filename, img] of entries) {
                try {
                    const qrResult = await applyProductQrReplacement(img.originalDataUrl, img.mimeType || '');
                    img.displayDataUrl = qrResult.displayDataUrl;
                    img.thumbnailSrc = qrResult.thumbnailSrc;
                    img.qrReplaced = qrResult.qrReplaced;
                    img.originalQrUrl = qrResult.originalQrUrl;
                    img.rewrittenQrUrl = qrResult.newQrUrl;
                    img.width = qrResult.width;
                    img.height = qrResult.height;
                    img.activityCard = await buildActivityCardAssets(qrResult.displayDataUrl);
                    if (qrResult.qrReplaced) replacedCount++;
                    revokePreviewUrl(img);
                } catch (err) {
                    console.warn(`重新处理二维码失败：${filename}`, err);
                }
            }

            updateImagePreview();
            immediateUpdatePreview();
            return replacedCount;
        }

        async function updateTrackingParams() {
            const currentValue = normalizeTrackingParamsTemplate(trackingParamsTemplate) || DEFAULT_TRACKING_PARAMS_TEMPLATE;
            const input = prompt(
                '请输入商品二维码问号后的跟踪参数：\n\n可用变量：{stamp}=pYYMMDD，{date}=YYYYMMDD\n留空会恢复默认参数。',
                currentValue
            );
            if (input === null) return;

            trackingParamsTemplate = normalized;

            const replacedCount = await reprocessUploadedProductQRCards();
            showStatus(`跟踪参数已更新，已重写 ${replacedCount} 张商品二维码`, 'success');
        }

        async function applyProductQrReplacement(originalDataUrl, mimeType = '') {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = async () => {
                    try {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);

                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height);
                        let displayDataUrl = originalDataUrl;
                        let qrReplaced = false;
                        let originalQrUrl = '';
                        let newQrUrl = '';

                        if (code) {
                            originalQrUrl = code.data;
                            newQrUrl = getNewQRUrl(code.data);
                            if (newQrUrl !== code.data) {
                                const qrBox = getReplacementQrBox(code, img.width, img.height);
                                if (qrBox) {
                                    await drawReplacementQr(ctx, newQrUrl, qrBox, img.width, img.height);
                                }
                                displayDataUrl = canvas.toDataURL('image/png');
                                qrReplaced = !!qrBox;
                            }
                        }

                        resolve({
                            displayDataUrl,
                            thumbnailSrc: createImagePreviewThumbnail(canvas),
                            qrReplaced,
                            originalQrUrl,
                            newQrUrl,
                            width: img.width,
                            height: img.height,
                            mimeType
                        });
                    } catch (err) {
                        reject(err);
                    }
                };
                img.onerror = () => reject(new Error('图片读取失败'));
                img.src = originalDataUrl;
            });
        }

        async function splitActivityCardImage(cardDataUrl, stripHeight = 115) {
            const img = await loadImageFromDataUrl(cardDataUrl);
            const sourceWidth = img.naturalWidth || img.width;
            const sourceHeight = img.naturalHeight || img.height;
            const cutHeight = Math.min(stripHeight, Math.max(1, sourceHeight - 1));
            const cardHeight = sourceHeight - cutHeight;
            const sourceCanvas = document.createElement('canvas');
            const sourceCtx = sourceCanvas.getContext('2d');
            sourceCanvas.width = sourceWidth;
            sourceCanvas.height = sourceHeight;
            sourceCtx.drawImage(img, 0, 0);

            const cardCanvas = document.createElement('canvas');
            const cardCtx = cardCanvas.getContext('2d');
            cardCanvas.width = sourceWidth;
            cardCanvas.height = cardHeight;
            cardCtx.drawImage(sourceCanvas, 0, 0, sourceWidth, cardHeight, 0, 0, sourceWidth, cardHeight);

            const stripCanvas = document.createElement('canvas');
            const stripCtx = stripCanvas.getContext('2d');
            stripCanvas.width = sourceWidth;
            stripCanvas.height = cutHeight;
            stripCtx.drawImage(sourceCanvas, 0, cardHeight, sourceWidth, cutHeight, 0, 0, sourceWidth, cutHeight);

            // 淘口令区域紧贴小长条底边，底色应匹配小长条最底部的视觉颜色，而不是整条图的全局主色。
            const edgeHeight = Math.max(8, Math.min(32, Math.round(cutHeight * 0.16)));
            const edgeY = Math.max(0, cutHeight - edgeHeight);
            const stripEdgeImageData = stripCtx.getImageData(0, edgeY, sourceWidth, edgeHeight);
            const backgroundColor = colorToCss(getDominantColorFromImageData(stripEdgeImageData));

            return {
                cardDataUrl: cardCanvas.toDataURL('image/png'),
                cardWidth: sourceWidth,
                cardHeight,
                stripDataUrl: stripCanvas.toDataURL('image/png'),
                stripWidth: sourceWidth,
                stripHeight: cutHeight,
                backgroundColor,
                topColor: backgroundColor,
                textColor: getReadableTextColor(backgroundColor),
                splitFromSingleImage: true
            };
        }

        async function getImageBottomEdgeColor(imageDataUrl) {
            const img = await loadImageFromDataUrl(imageDataUrl);
            const width = img.naturalWidth || img.width;
            const height = img.naturalHeight || img.height;
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0);

            const edgeHeight = Math.max(8, Math.min(32, Math.round(height * 0.16)));
            const edgeY = Math.max(0, height - edgeHeight);
            const edgeImageData = ctx.getImageData(0, edgeY, width, edgeHeight);
            return colorToCss(getDominantColorFromImageData(edgeImageData));
        }

        async function buildActivityCardAssets(cardDataUrl) {
            try {
                return await splitActivityCardImage(cardDataUrl, 115);
            } catch (err) {
                console.warn('活动卡片配色生成失败，将使用默认浅色背景:', err);
                return {
                    stripDataUrl: '',
                    backgroundColor: 'rgb(246, 251, 253)',
                    topColor: 'rgb(246, 251, 253)',
                    textColor: 'rgb(0, 0, 0)'
                };
            }
        }

        async function ensureActivityCardForImageRecord(image) {
            if (!image) return;
            image.activityCard = await buildActivityCardAssets(image.originalDataUrl || image.displayDataUrl);
        }

        async function ensureStripColorForImageRecord(image) {
            if (!image || image.stripBackgroundColor) return;
            image.stripBackgroundColor = await getImageBottomEdgeColor(image.originalDataUrl || image.displayDataUrl);
        }
        
        /**
         * 获取唯一的文件名（用于粘贴图片重名处理）
         * @param {string} originalName - 原始文件名
         * @param {boolean} isPasted - 是否是粘贴的图片
         * @returns {{storageName: string, displayName: string}} 唯一的存储名和显示名
         */
        function getUniqueFilename(originalName, isPasted) {
            // 如果不是粘贴的图片，直接返回原始名（不上传重名处理）
            if (!isPasted) {
                return {
                    storageName: originalName.replace(/\.[^.]+$/, ''),
                    displayName: originalName
                };
            }
            
            // 粘贴图片：首先尝试原始完整文件名
            let baseName = originalName;
            let nameWithoutExt = baseName.replace(/\.[^.]+$/, '');
            let extension = baseName.substring(nameWithoutExt.length);
            
            // 检查是否已存在同名图片
            if (uploadedImages[baseName]) {
                // 寻找可用的数字后缀
                let counter = 1;
                let newName;
                do {
                    newName = `${nameWithoutExt} (${counter})${extension}`;
                    counter++;
                } while (uploadedImages[newName]);
                return {
                    storageName: newName,
                    displayName: newName
                };
            }
            
            // 没有重名，直接使用
            return {
                storageName: baseName,
                displayName: baseName
            };
        }
        
        /**
         * 处理上传的图片（识别并替换二维码）
         * 原图用于打包下载，QR替换后用于预览和复制
         * @param {File} file - 上传的文件对象
         * @param {boolean} isPasted - 是否是粘贴的图片
          */
        async function processImageWithQR(file, isPasted = false) {
            if (!isSupportedImageFile(file)) {
                showStatus(`【${file.name}】不是支持的图片格式`, 'warning');
                finishImageProcessing(false);
                return;
            }

            if (isHeicFile(file)) {
                try {
                    showStatus(`正在转换 HEIC：${file.name}`, 'info');
                    file = await convertHeicToJpeg(file);
                } catch (err) {
                    console.error('HEIC 转换失败:', err);
                    showStatus(`【${file.name}】HEIC 转换失败，请先转 JPG`, 'warning');
                    finishImageProcessing(false);
                    return;
                }
            }

            // 根据是否粘贴获取唯一文件名
            const { storageName: storageFilename, displayName: displayFilename } = getUniqueFilename(file.name, isPasted);

            // GIF 超过 6MB 提醒
            if (file.type === 'image/gif' && file.size > CompressionConfig.gifSizeWarning) {
                showStatus(`【${displayFilename}】超过 6MB，请压缩！`, 'warning');
            }

            const reader = new FileReader();
            reader.onload = async function(event) {
                // 保存原始图片（用于打包下载）
                const originalDataUrl = event.target.result;

                try {
                    const qrResult = await applyProductQrReplacement(originalDataUrl, file.type || '');
                    // 活动卡片二维码现在会优先按识别位置智能重写，切图使用替换后的展示图。
                    const activityCard = await buildActivityCardAssets(qrResult.displayDataUrl);
                    const stripBackgroundColor = await getImageBottomEdgeColor(originalDataUrl);

                    if (uploadedImages[storageFilename]) {
                        totalUploadedImageBytes -= uploadedImages[storageFilename].originalSize || getDataUrlByteSize(uploadedImages[storageFilename].originalDataUrl);
                        if (totalUploadedImageBytes < 0) totalUploadedImageBytes = 0;
                        revokePreviewUrl(uploadedImages[storageFilename]);
                    }

                    // 保存图片（分离原始URL、显示URL和静态缩略图）
                    // GIF 在 img 标签中会持续播放，面板内大量 GIF 会拖慢滚动；缩略图统一用静态首帧。
                    uploadedImages[storageFilename] = {
                        originalDataUrl: originalDataUrl, // 原始图片，打包下载用
                        displayDataUrl: qrResult.displayDataUrl,     // 处理后图片，预览复制用
                        thumbnailSrc: qrResult.thumbnailSrc,         // 面板静态缩略图，避免大图/GIF 影响滚动性能
                        useCount: 0,
                        qrReplaced: qrResult.qrReplaced,
                        originalQrUrl: qrResult.originalQrUrl,
                        rewrittenQrUrl: qrResult.newQrUrl,
                        displayName: displayFilename,
                        width: qrResult.width,
                        height: qrResult.height,
                        mimeType: file.type || '',
                        activityCard,
                        stripBackgroundColor,
                        originalSize: file.size || getDataUrlByteSize(originalDataUrl)
                    };
                    if (qrResult.qrReplaced) {
                        console.log(`二维码已替换: ${file.name}`);
                    }
                    totalUploadedImageBytes += uploadedImages[storageFilename].originalSize;

                    // 如果是粘贴的图片，在编辑器中插入引用
                    if (isPasted) {
                        insertImageReference(displayFilename);
                        showStatus(`图片已插入：${displayFilename}`, 'success');
                    }

                        // 渐进式显示：每处理完一张就刷新
                        finishImageProcessing(true);
                } catch (err) {
                    console.error('图片处理失败:', err);
                    showStatus(`【${displayFilename}】处理失败`, 'warning');
                    finishImageProcessing(false);
                }
            };
            reader.onerror = () => {
                showStatus(`【${displayFilename}】读取失败`, 'warning');
                finishImageProcessing(false);
            };
            reader.readAsDataURL(file);
        }

        /* ==================== 图片批量操作 ==================== */

        /**
         * 调整单张图片尺寸用于复制（不改格式、不做主动压缩）
         * @param {string} dataUrl - 原始图片的 dataUrl
         * @returns {Promise<string>} 调整尺寸后的 dataUrl
         */
        async function compressImageForCopy(dataUrl, returnMeta = false) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const sourceMimeType = (dataUrl.match(/^data:([^;]+);/) || [])[1] || '';
                    if (img.width <= CompressionConfig.maxWidth) {
                        if (returnMeta) {
                            resolve({
                                dataUrl,
                                width: img.width,
                                height: img.height,
                                mimeType: sourceMimeType
                            });
                            return;
                        }
                        resolve(dataUrl);
                        return;
                    }

                    let { width, height } = img;
                    height = Math.round((height * CompressionConfig.maxWidth) / width);
                    width = CompressionConfig.maxWidth;

                    const outputCanvas = document.createElement('canvas');
                    outputCanvas.width = width;
                    outputCanvas.height = height;
                    const outputCtx = outputCanvas.getContext('2d');
                    outputCtx.drawImage(img, 0, 0, width, height);

                    const outputMimeType = sourceMimeType === 'image/jpeg' || sourceMimeType === 'image/png' || sourceMimeType === 'image/webp'
                        ? sourceMimeType
                        : 'image/png';
                    const resizedDataUrl = outputMimeType === 'image/jpeg'
                        ? outputCanvas.toDataURL(outputMimeType, CompressionConfig.jpegResizeQuality)
                        : outputCanvas.toDataURL(outputMimeType);
                    if (returnMeta) {
                        resolve({
                            dataUrl: resizedDataUrl,
                            width,
                            height,
                            mimeType: outputMimeType
                        });
                        return;
                    }
                    resolve(resizedDataUrl);
                };
                img.onerror = () => {
                    if (returnMeta) {
                        resolve({ dataUrl, width: 0, height: 0, mimeType: '' });
                        return;
                    }
                    resolve(dataUrl);
                };
                img.src = dataUrl;
            });
        }

        function createImagePreviewThumbnail(source, maxSize = 180) {
            const ratio = source.width && source.height ? Math.min(1, maxSize / Math.max(source.width, source.height)) : 1;
            const width = Math.max(1, Math.round((source.width || maxSize) * ratio));
            const height = Math.max(1, Math.round((source.height || maxSize) * ratio));
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(source, 0, 0, width, height);
            return canvas.toDataURL('image/jpeg', 0.72);
        }

        function getDataUrlByteSize(dataUrl) {
            const commaIndex = dataUrl.indexOf(',');
            if (commaIndex === -1) return 0;
            const base64Length = dataUrl.length - commaIndex - 1;
            return Math.round((base64Length * 3) / 4);
        }

        function revokePreviewUrl(image) {
            if (!image) return;
            ['previewSrc', 'thumbnailSrc'].forEach((key) => {
                if (image[key] && image[key].startsWith('blob:')) {
                    URL.revokeObjectURL(image[key]);
                }
            });
        }

        /**
         * 删除所有已上传的图片（仅清空面板，不影响编辑区文案）
         */
        function deleteAllUploadedImages() {
            const filenames = Object.keys(uploadedImages);
