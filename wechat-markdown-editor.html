            if (filenames.length === 0) {
                showStatus('没有已上传的图片', 'error');
                return;
            }

            if (!confirm(`确定要清空所有 ${filenames.length} 张已上传图片吗？\n编辑区的文案不会被删除，但图片引用会失效。`)) {
                return;
            }

            for (const filename of filenames) {
                revokePreviewUrl(uploadedImages[filename]);
                delete uploadedImages[filename];
            }
            totalUploadedImageBytes = 0;

            updateImagePreview();
            immediateUpdatePreview();
            showStatus(`已清空 ${filenames.length} 张图片`, 'success');
        }

        function collectReferencedImagesInMarkdown(includeCards = false, mergeSideBySide = false) {
            const lines = textarea.value.split('\n');
            const imageOrder = [];

            for (const line of lines) {
                const trimmedLine = line.trim();
                const activityCardMatch = trimmedLine.match(/^活动卡片：(.*)$/);
                if (activityCardMatch) {
                    if (!includeCards) continue;
                    const spec = parseActivityCardSpec(activityCardMatch[1]);
                    const matched = findMatchingImage(spec.imageName);
                    if (matched) imageOrder.push({ refText: spec.imageName, filename: matched.filename });
                    const stripMatched = spec.stripName ? findMatchingImage(spec.stripName) : null;
                    if (stripMatched) imageOrder.push({ refText: spec.stripName, filename: stripMatched.filename });
                    continue;
                }

                const productCardMatch = trimmedLine.match(/^(?:商品卡片|商品小卡片)：(.*)$/);
                if (productCardMatch) {
                    if (!includeCards) continue;
                    const refText = productCardMatch[1]
                        .replace(/\s+77《[\s\S]*$/, '')
                        .replace(/\s+https?:\/\/\S+$/, '')
                        .trim();
                    const matched = findMatchingImage(refText, false, false);
                    if (matched) imageOrder.push({ refText, filename: matched.filename });
                    continue;
                }

                const sideMatch = trimmedLine.match(/^【([^【】]+)】\s*[|｜]\s*【([^【】]+)】(?:\s*[|｜]\s*【([^【】]+)】)?$/);
                if (sideMatch) {
                    const sideItems = [];
                    for (let j = 1; j <= 3; j++) {
                        if (!sideMatch[j]) continue;
                        const refText = sideMatch[j].trim();
                        const matched = findImageByReference(refText);
                        if (matched) sideItems.push({ refText, filename: matched.filename });
                    }
                    if (mergeSideBySide && sideItems.length > 1) {
                        imageOrder.push({
                            refText: sideItems.map((item) => item.refText).join('｜'),
                            filenames: sideItems.map((item) => item.filename),
                            isSideBySide: true
                        });
                    } else {
                        imageOrder.push(...sideItems);
                    }
                    continue;
                }

                const match = trimmedLine.match(/^【([^【】]+)】$/);
                if (match) {
                    const refText = match[1].trim();
                    const matched = findImageByReference(refText);
                    if (matched) imageOrder.push({ refText, filename: matched.filename });
                }
            }

            return imageOrder;
        }

        function getDataUrlExtension(dataUrl, fallbackName = '') {
            const mimeType = (dataUrl.match(/^data:([^;]+);/) || [])[1] || '';
            if (mimeType === 'image/jpeg') return 'jpg';
            if (mimeType === 'image/png') return 'png';
            if (mimeType === 'image/gif') return 'gif';
            if (mimeType === 'image/webp') return 'webp';
            const ext = String(fallbackName).split('.').pop();
            return ext && ext !== fallbackName ? ext.toLowerCase() : 'png';
        }

        function makeUniqueZipFilename(filename, usedNames) {
            const normalized = filename || 'image.png';
            if (!usedNames.has(normalized)) {
                usedNames.add(normalized);
                return normalized;
            }

            const dotIndex = normalized.lastIndexOf('.');
            const name = dotIndex > 0 ? normalized.slice(0, dotIndex) : normalized;
            const ext = dotIndex > 0 ? normalized.slice(dotIndex) : '';
            let index = 2;
            let candidate = `${name}-${index}${ext}`;
            while (usedNames.has(candidate)) {
                index++;
                candidate = `${name}-${index}${ext}`;
            }
            usedNames.add(candidate);
            return candidate;
        }

        async function getImageDataUrlForWeChatPackage(img) {
            if (!img) return '';
            // 压缩包必须与预览一致：优先使用图片加底后的合成图，其次使用二维码替换后的展示图。
            return img.backdropDataUrl || img.displayDataUrl || img.originalDataUrl || '';
        }

        function loadImageForPackage(dataUrl) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                image.onload = () => resolve(image);
                image.onerror = () => reject(new Error('图片读取失败'));
                image.src = dataUrl;
            });
        }

        function getSideBySideCellGap(count, customGap) {
            const fallback = count === 3 ? 12 : 16;
            const value = Number(customGap);
            return Number.isFinite(value) ? Math.max(0, Math.min(100, Math.round(value))) : fallback;
        }

        function getSideBySideBackdropKey(images) {
            return `side-by-side:${images.map((image) => image?.filename).filter(Boolean).join('|')}`;
        }

        function getSideBySideAutoLayout(sources = []) {
            if (!sources.length) return { gap: 60, scale: 90 };
            const averageAspect = sources.reduce((sum, source) => sum + ((source.width || 1) / (source.height || 1)), 0) / sources.length;
            const averageShortSide = sources.reduce((sum, source) => sum + Math.min(source.width || 1, source.height || 1), 0) / sources.length;
            // 两个校准锚点：890×1360 截图约为 60px / 92%，1080×1324 截图约为 80px / 86%。
            // 宽一些、分辨率更高的并排截图，需要更多中缝与略小缩放来保留视觉呼吸感。
            const aspectFactor = Math.max(0, Math.min(1, (averageAspect - 0.65) / 0.17));
            const resolutionFactor = Math.max(0, Math.min(1, (averageShortSide - 800) / 280));
            return {
                gap: Math.max(36, Math.min(100, Math.round(56 + aspectFactor * 14 + resolutionFactor * 10))),
                scale: Math.max(78, Math.min(94, Math.round(93 - aspectFactor * 4 - resolutionFactor * 3)))
            };
        }

        function getSideBySideGapSetting(setting = {}, count = 2, fallbackGap) {
            return getSideBySideCellGap(count, setting.gap === undefined ? fallbackGap : setting.gap);
        }

        async function createSideBySideComposite(images, effects = {}) {
            const dataUrls = await Promise.all(images.map((image) => image?.displayDataUrl || image?.originalDataUrl || image?.dataUrl || ''));
            const sources = await Promise.all(dataUrls.map(loadImageForPackage));
            const setting = imageBackdropSettings[getSideBySideBackdropKey(images)] || {};
            const autoLayout = getSideBySideAutoLayout(sources);
            const gap = getSideBySideGapSetting(setting, sources.length, autoLayout.gap);
            const equalHeight = typographySettings.imageAlign !== 'width';
            const maxHeight = Math.max(...sources.map((source) => source.height || 1));
            const maxWidth = Math.max(...sources.map((source) => source.width || 1));
            const targetHeight = equalHeight ? maxHeight : maxHeight;
            const targetWidths = equalHeight
                ? sources.map((source) => Math.max(1, Math.round((source.width / source.height) * targetHeight)))
                : sources.map(() => maxWidth);
            const targetHeights = equalHeight
                ? sources.map(() => targetHeight)
                : sources.map((source) => Math.max(1, Math.round((source.height / source.width) * maxWidth)));
            const shadowPads = effects.shadow
                ? targetWidths.map((width, index) => Math.max(2, Math.min(50, Math.round(Math.min(width, targetHeights[index]) / 33)) * 2))
                : targetWidths.map(() => 0);
            const outerPad = Math.max(0, ...shadowPads);
            const canvas = document.createElement('canvas');
            canvas.width = targetWidths.reduce((sum, width) => sum + width, 0) + gap * (sources.length - 1) + outerPad * 2;
            canvas.height = Math.max(...targetHeights) + outerPad * 2;
            const context = canvas.getContext('2d');
            const drawCell = (targetCtx, source, x, y, width, height) => {
                targetCtx.save();
                if (effects.radius) drawRoundedRectPath(targetCtx, x, y, width, height, getUnifiedImageCornerRadius(width, height));
                else { targetCtx.beginPath(); targetCtx.rect(x, y, width, height); }
                targetCtx.clip();
                targetCtx.drawImage(source, x, y, width, height);
                targetCtx.restore();
            };
            let offsetX = outerPad;
            sources.forEach((source, index) => {
                const x = offsetX;
                const y = outerPad;
                if (effects.shadow) {
                    const shadowLayer = document.createElement('canvas');
                    shadowLayer.width = canvas.width;
                    shadowLayer.height = canvas.height;
                    const shadowCtx = shadowLayer.getContext('2d');
                    drawCell(shadowCtx, source, x, y, targetWidths[index], targetHeights[index]);
                    shadowCtx.globalCompositeOperation = 'source-in';
                    shadowCtx.fillStyle = '#000';
                    shadowCtx.fillRect(0, 0, canvas.width, canvas.height);
                    context.save();
                    context.filter = `blur(${Math.max(2, Math.round(shadowPads[index] / 2))}px)`;
                    context.globalAlpha = 0.25;
                    context.drawImage(shadowLayer, 0, 0);
                    context.restore();
                }
                drawCell(context, source, x, y, targetWidths[index], targetHeights[index]);
                offsetX += targetWidths[index] + gap;
            });
            return { dataUrl: canvas.toDataURL('image/png'), width: canvas.width, height: canvas.height, sources, autoLayout, gap };
        }

        async function downloadImagesAsZip(renameByOrder = false, includeCards = false, mergeSideBySide = false) {
            try {
                const markdown = document.getElementById('markdown-input').value;
                // 锁定此刻预览正在展示的并排合成图，下载必须与用户刚调好的预览逐像素一致。
                const previewSideBySideData = new Map(Object.entries(sideBySideBackdropRecords).map(([key, record]) => [
                    key,
                    record?.backdropDataUrl || record?.rawDataUrl || ''
                ]));
                await ensureActivityCardsForMarkdown(markdown);
                await ensureImageBackdropEligibility(markdown);
                await prepareImageBackdropData(markdown);
                const imageOrder = collectReferencedImagesInMarkdown(includeCards, mergeSideBySide);

                if (imageOrder.length === 0) {
                    showStatus('没有可打包的图片', 'error');
                    return;
                }

                showStatus(`正在打包 ${imageOrder.length} 张图片...`, 'info');

                const zip = new JSZip();
                const folder = zip.folder('uploaded-images');
                const usedNames = new Set();

                for (let i = 0; i < imageOrder.length; i++) {
                    const item = imageOrder[i];
                    const images = (item.isSideBySide ? item.filenames : [item.filename])
                        .map((filename) => uploadedImages[filename])
                        .filter(Boolean);
                    const img = images[0];
                    const dataUrl = item.isSideBySide
                        ? await mergeImagesForWeChatPackage(images, previewSideBySideData.get(getSideBySideBackdropKey(images)))
                        : await getImageDataUrlForWeChatPackage(img);
                    if (!dataUrl) continue;

                    const ext = getDataUrlExtension(dataUrl, item.isSideBySide ? 'merged.png' : img.displayName);
                    const baseName = renameByOrder
                        ? `图 ${i + 1}.${ext}`
                        : (item.isSideBySide ? `并排图-${i + 1}.${ext}` : (img.displayName || item.filename || `image-${i + 1}.${ext}`));
                    const zipFilename = makeUniqueZipFilename(baseName, usedNames);
                    const base64 = dataUrl.split(',')[1];
                    folder.file(zipFilename, base64, { base64: true });
                }

                const content = await zip.generateAsync({
                    type: 'blob',
                    compression: 'DEFLATE',
                    compressionOptions: { level: 6 }
                });

                const timestamp = new Date().toISOString().slice(0, 10);
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = renameByOrder ? `wechat-images-renamed-${timestamp}.zip` : `wechat-images-original-names-${timestamp}.zip`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);

                showStatus(`已${renameByOrder ? '改名' : '原名'}打包下载 ${imageOrder.length} 张图片`, 'success');
            } catch (err) {
                console.error('图片打包失败:', err);
                showStatus('图片打包失败: ' + err.message, 'error');
            }
        }

        function downloadPackageFromOptions() {
            const renameByOrder = !document.getElementById('package-keep-original-name').checked;
            const includeCards = document.getElementById('package-include-cards').checked;
            const mergeSideBySide = document.getElementById('package-merge-side-by-side').checked;
            return downloadImagesAsZip(renameByOrder, includeCards, mergeSideBySide);
        }

        function getQrReplacementStatus(image) {
            if (!image || !image.originalQrUrl) {
                return {
                    className: 'is-missing',
                    label: '未识别',
                    title: '未识别到可替换的二维码，图片保持原样'
                };
            }

            if (image.qrReplaced) {
                return {
                    className: 'is-replaced',
                    label: '已替换',
                    title: `二维码已替换\n原始链接：${image.originalQrUrl}\n新链接：${image.rewrittenQrUrl || ''}`
                };
            }

            if (image.rewrittenQrUrl && image.rewrittenQrUrl !== image.originalQrUrl) {
                return {
                    className: 'is-detected-failed',
                    label: '未覆盖',
                    title: `已识别二维码，但未能确定覆盖位置\n原始链接：${image.originalQrUrl}\n目标链接：${image.rewrittenQrUrl}`
                };
            }

            return {
                className: 'is-unchanged',
                label: '无需改',
                title: `二维码已识别，但链接无需更新\n链接：${image.originalQrUrl}`
            };
        }

        /**
         * 更新图片预览面板显示
          */
        function updateImagePreview() {
            const panel = document.getElementById('image-preview-panel');
            const grid = document.getElementById('image-preview-grid');
            
            const filenames = Object.keys(uploadedImages).sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
            
            if (filenames.length === 0) {
                panel.style.display = 'none';
                return;
            }
            
            panel.style.display = 'grid';
            grid.innerHTML = '';
            
            filenames.forEach(filename => {
                const img = uploadedImages[filename];
                const isUsed = img.useCount > 0;
                const displayName = img.displayName || filename; // 使用显示名称，如果没有则使用存储名称
                const qrStatus = getQrReplacementStatus(img);
	                const item = document.createElement('div');
	                item.className = `image-preview-item ${isUsed ? 'used' : 'unused'}`;
	                item.title = `${displayName}\n${qrStatus.title}`;
                    item.dataset.filename = filename;
	                item.innerHTML = `
	                    <img src="${img.thumbnailSrc || img.displayDataUrl}" alt="${displayName}">
                    <div class="qr-status ${qrStatus.className}" title="${qrStatus.title.replace(/"/g, '&quot;')}">${qrStatus.label}</div>
                    <div class="use-count">${img.useCount}</div>
                    <div class="delete-btn">×</div>
                    <div class="filename">${displayName}</div>
                `;
                
                // 删除按钮事件
                const deleteBtn = item.querySelector('.delete-btn');
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation(); // 阻止冒泡，避免触发复制引用事件
                    if (confirm(`确定要删除图片 "${displayName}" 吗？`)) {
                        totalUploadedImageBytes -= img.originalSize || getDataUrlByteSize(img.originalDataUrl);
                        if (totalUploadedImageBytes < 0) totalUploadedImageBytes = 0;
                        revokePreviewUrl(img);
                        delete uploadedImages[filename];
                        updateImagePreview(); // 刷新预览面板
                        immediateUpdatePreview(); // 刷新文章预览
                        showStatus(`已删除图片: ${displayName}`, 'success');
                    }
                });
                
                // 点击复制图片引用（带【】符号）
                item.addEventListener('click', () => {
                    const refWithBrackets = `【${displayName}】`;
                    navigator.clipboard.writeText(refWithBrackets).then(() => {
                        showStatus(`已复制: ${refWithBrackets}`, 'success');
                    }).catch(() => {
                        showStatus('复制失败', 'error');
                    });
                });
                
	                grid.appendChild(item);
	            });
	        }

        function updateImagePreviewUseCounts() {
            const panel = document.getElementById('image-preview-panel');
            const grid = document.getElementById('image-preview-grid');
            const filenames = Object.keys(uploadedImages);

            if (filenames.length === 0) {
                panel.style.display = 'none';
                return;
            }

            if (!grid.children.length || grid.children.length !== filenames.length) {
                updateImagePreview();
                return;
            }

            panel.style.display = 'grid';
            filenames.forEach(filename => {
                const img = uploadedImages[filename];
                const item = grid.querySelector(`[data-filename="${CSS.escape(filename)}"]`);
                if (!item) {
                    updateImagePreview();
                    return;
                }
                const isUsed = img.useCount > 0;
                item.classList.toggle('used', isUsed);
                item.classList.toggle('unused', !isUsed);
                const count = item.querySelector('.use-count');
                if (count) count.textContent = img.useCount;
            });
        }

        function toggleImagePreviewPanel(collapsed) {
            const panel = document.getElementById('image-preview-panel');
            const toggle = document.getElementById('image-panel-toggle');
            if (!panel) return;

            panel.classList.toggle('collapsed', collapsed);
            if (toggle) {
                toggle.title = collapsed ? '展开已上传图片' : '收起到侧边栏';
                toggle.innerHTML = collapsed ? '<i class="fas fa-chevron-left"></i>' : '<i class="fas fa-chevron-right"></i>';
            }
        }

        function setupImagePreviewPanelScroll() {
            const panel = document.getElementById('image-preview-panel');
            const grid = document.getElementById('image-preview-grid');
            if (!panel || !grid) return;

            panel.addEventListener('wheel', (e) => {
                if (panel.classList.contains('collapsed')) return;
                if (grid.scrollHeight <= grid.clientHeight) return;

                e.preventDefault();
                grid.scrollTop += e.deltaY;
            }, { passive: false });
        }
        
        /* ==================== 图片匹配工具 ==================== */
        
        /**
         * 根据商品名称精确匹配图片（商品名与文件名匹配）
         * @param {string} productName - 商品名称
         * @returns {{ filename, dataUrl, width, height, mimeType } | null}
         */
        function normalizeProductImageName(name) {
            return (name || '')
                .trim()
                .replace(/^【|】$/g, '')
                .replace(/\.(png|jpg|jpeg|gif|webp|heic|heif)$/i, '')
                .toLowerCase();
        }

        function findMatchingImage(productName, useCopyDataUrl = false, includeBackdrop = true) {
            const exactName = normalizeProductImageName(productName);
            for (const filename of Object.keys(uploadedImages)) {
                const image = uploadedImages[filename];
                const candidates = [
                    filename,
                    image.displayName || '',
                    (image.displayName || '').replace(/\.[^.]+$/, ''),
                    filename.replace(/\.[^.]+$/, '')
                ].map(normalizeProductImageName);

                if (candidates.includes(exactName)) {
                    return getUploadedImageInfo(filename, useCopyDataUrl, includeBackdrop);
                }
            }
            return null;
        }

        function getActivityCardRefsFromMarkdown(markdown) {
            const refs = [];
            String(markdown || '').split('\n').forEach((line) => {
                const match = line.trim().match(/^活动卡片：(.*)$/);
                if (!match) return;
                const spec = parseActivityCardSpec(match[1]);
                if (spec.imageName) refs.push(spec.imageName);
                if (spec.stripName) refs.push(spec.stripName);
            });
            return refs;
        }

        function getSafeLocalImageCandidates(refText) {
            const name = String(refText || '').trim().replace(/^【|】$/g, '');
            if (!name || /[\\/]/.test(name) || name.includes('..')) return [];
            const hasExt = /\.(png|jpg|jpeg|webp)$/i.test(name);
            return hasExt ? [name] : [`${name}.png`, `${name}.jpg`, `${name}.jpeg`, `${name}.webp`];
        }

        async function loadLocalActivityImageIfNeeded(refText) {
            if (findMatchingImage(refText)) return;

            for (const candidate of getSafeLocalImageCandidates(refText)) {
                try {
                    const dataUrl = await loadImageUrlAsDataUrl(`images/${encodeURIComponent(candidate)}`);
                    const img = await loadImageFromDataUrl(dataUrl);
                    const activityCard = await buildActivityCardAssets(dataUrl);
                    const stripBackgroundColor = await getImageBottomEdgeColor(dataUrl);
                    uploadedImages[candidate] = {
                        originalDataUrl: dataUrl,
                        displayDataUrl: dataUrl,
                        thumbnailSrc: dataUrl,
                        useCount: 0,
                        qrReplaced: false,
                        originalQrUrl: '',
                        rewrittenQrUrl: '',
                        displayName: candidate,
                        width: img.naturalWidth || img.width,
                        height: img.naturalHeight || img.height,
                        mimeType: getMimeTypeFromImageUrl(candidate),
                        activityCard,
                        stripBackgroundColor,
                        originalSize: getDataUrlByteSize(dataUrl),
                        localActivityAsset: true
                    };
                    totalUploadedImageBytes += uploadedImages[candidate].originalSize;
                    updateImagePreview();
                    return;
                } catch (err) {
                    // 继续尝试其他常见扩展名。
                }
            }
        }

        async function ensureActivityCardsForMarkdown(markdown) {
            const lines = String(markdown || '').split('\n');
            for (const line of lines) {
                const match = line.trim().match(/^活动卡片：(.*)$/);
                if (!match) continue;
                const spec = parseActivityCardSpec(match[1]);

                if (spec.imageName) await loadLocalActivityImageIfNeeded(spec.imageName);
                if (spec.stripName) await loadLocalActivityImageIfNeeded(spec.stripName);

                // 两图语法只负责拼接；单图语法才会把底部 115px 切成小长条。
                if (spec.stripName) {
                    const stripMatched = findMatchingImage(spec.stripName);
                    if (stripMatched) await ensureStripColorForImageRecord(uploadedImages[stripMatched.filename]);
                    continue;
                }

                const matched = spec.imageName ? findMatchingImage(spec.imageName) : null;
                if (!matched) continue;
                const image = uploadedImages[matched.filename];
                await ensureActivityCardForImageRecord(image);
            }
        }

        function getUploadedImageInfo(filename, useCopyDataUrl = false, includeBackdrop = true) {
            const image = uploadedImages[filename];
            const renderDataUrl = includeBackdrop ? (image.backdropDataUrl || image.displayDataUrl) : image.displayDataUrl;
            return {
                filename,
                dataUrl: renderDataUrl,
                width: includeBackdrop ? (image.backdropWidth || image.width) : image.width,
                height: includeBackdrop ? (image.backdropHeight || image.height) : image.height,
                mimeType: image.mimeType || '',
                displayName: image.displayName || filename,
                activityCard: image.activityCard || null,
                stripBackgroundColor: image.stripBackgroundColor || ''
            };
        }

        function formatCssNumber(value, digits = 3) {
            return Number(value).toFixed(digits).replace(/0+$/, '').replace(/\.$/, '');
        }

        function getWeChatAdaptiveImageAttrs(block, options = {}) {
            const width = Number(block.width) || 0;
            const height = Number(block.height) || 0;
            const ratio = width > 0 && height > 0 ? (height / width).toFixed(8).replace(/0+$/, '').replace(/\.$/, '') : '';
            const type = (block.mimeType || '').split('/')[1] || (block.filename || '').split('.').pop() || 'png';
            const backWidth = Math.max(1, Math.round(Number(options.backWidth) || 578));
            const originalStyle = options.originalStyle || 'width: 100%;height: auto !important;';
            const attrs = [
                'width="100%"',
                '_width="100%"',
                `data-original-style="${originalStyle}"`,
                'data-s="300,640"',
                `data-type="${type.toLowerCase()}"`
            ];
            if (width > 0) attrs.push(`data-w="${width}"`);
            if (width > 0) attrs.push(`data-backw="${backWidth}"`);
            if (width > 0 && height > 0) attrs.push(`data-backh="${Math.max(1, Math.round(Number(options.backHeight) || ((height / width) * backWidth)))}"`);
            if (ratio) attrs.push(`data-ratio="${ratio}"`);
            return attrs.join(' ');
        }

        function parseSpecialImageSyntax(trimmedLine) {
            const text = String(trimmedLine || '').trim();
            const seamlessMatch = text.match(/^无缝拼接[:：]\s*(.+)$/);
            if (seamlessMatch) {
                const refs = Array.from(seamlessMatch[1].matchAll(/【([^【】]+)】/g))
                    .map(match => match[1].trim())
                    .filter(Boolean);
                return refs.length ? { mode: 'seamless', label: '无缝拼接', refs } : null;
            }

            const match = text.match(/^不可选中[:：]\s*(?:【([^【】]+)】|(.+))$/);
            if (!match) return null;
            return {
                mode: 'non-selectable',
                label: '不可选中',
                refText: (match[1] || match[2] || '').trim()
            };
        }

        function buildReferencedImageBlock(matchedImg, refText, options = {}) {
            return {
                type: 'referenced-image',
                filename: matchedImg.filename,
                dataUrl: matchedImg.dataUrl,
                width: matchedImg.width,
                height: matchedImg.height,
                mimeType: matchedImg.mimeType,
                displayName: matchedImg.displayName,
                alt: refText,
                caption: options.caption || null,
                specialMode: options.specialMode || ''
            };
        }

        const imageBackdropSettings = {};
        const IMAGE_BACKDROP_DEFAULT_RADIUS = 32;
        const CONTINUOUS_CORNER_EXPONENT = 4;
        const CONTINUOUS_CORNER_EXTENT = 1.52866483;
        const IMAGE_BACKDROP_GRADIENTS = {
            aurora: ['#A8EDEA', '#FED6E3'],
            midnight: ['#1B2755', '#6B4FA1']
        };
        // 并排图在预览中的合成结果与原图分开保存，复制微信时仍可保留普通并排结构。
        const sideBySideBackdropRecords = {};
        let activeBackdropFilename = '';
        let backdropAssetDataUrlsPromise = null;

        function loadImageBackdropSettings() {
            try { Object.assign(imageBackdropSettings, JSON.parse(localStorage.getItem(IMAGE_BACKDROP_STORAGE_KEY) || '{}')); } catch (err) { /* 使用默认值 */ }
        }

        function saveImageBackdropSettings() {
            try { localStorage.setItem(IMAGE_BACKDROP_STORAGE_KEY, JSON.stringify(imageBackdropSettings)); } catch (err) { console.warn('图片加底设置保存失败:', err); }
        }

        function getImageBackdropStyle(block) {
            const image = uploadedImages[block.filename];
            // 商品/活动卡片和普通并排图不进入正文图片加底链路；复制到微信时保持原始图片结构。
            if (image?.backdropExcludedForCards) return '';
            if (image && image.backdropDataUrl) return '';
            const options = getImageBackdropOptions(block.filename, image?.backdropMode);
            if (!options.enabled || isGifImageBlock(block)) return '';
            const radius = getUnifiedImageCornerRadius(Number(block.width) || 0, Number(block.height) || 0);
            const styles = [];
            if (options.shadow) styles.push('box-shadow: 0 10px 26px rgba(0, 0, 0, 0.28) !important;');
            if (options.radius) styles.push(`border-radius: ${radius}px !important;`);
            return styles.join(' ');
        }

        function getAutoImageBackdropOptions(mode) {
            if (mode === 'transparent') return { enabled: true, shadow: false, radius: false };
            if (mode === 'white-edge') return { enabled: true, shadow: true, radius: true };
            return { enabled: false, shadow: false, radius: false };
        }

        function getBackdropSettingKey(filename, context = '') {
            if (context === 'product-card') return `product-card:${filename}`;
            return filename;
        }

        function getImageBackdropOptions(filename, mode = uploadedImages[filename]?.backdropMode, settingKey = filename) {
            const setting = imageBackdropSettings[settingKey] || {};
            const auto = getAutoImageBackdropOptions(mode);
            return {
                // “自动”只处理透明底或白边图；单图面板显式开启时才允许手动强制加底。
                enabled: setting.enabled === undefined
                    ? typographySettings.imageBackdrop === true && auto.enabled
                    : setting.enabled === true,
                shadow: setting.shadow === undefined ? auto.shadow : setting.shadow === true,
                radius: setting.radius === undefined ? auto.radius : setting.radius === true,
                radiusSize: getImageBackdropRadiusSize(setting),
                background: getImageBackdropBackground(setting)
            };
        }

        function getImageBackdropBackground(setting = {}) {
            const value = String(setting.background || 'lizhi');
            return value === 'blue' || value === 'lizhi' || value === 'none' || IMAGE_BACKDROP_GRADIENTS[value]
                ? value
                : 'lizhi';
        }

        function getImageBackdropRadiusSize(setting = {}) {
            const value = Number(setting.radiusSize);
            return Number.isFinite(value)
                ? Math.max(0, Math.min(64, Math.round(value)))
                : IMAGE_BACKDROP_DEFAULT_RADIUS;
        }

        function getAutoImageBackdropAspect(filename) {
            const image = uploadedImages[filename];
            return image && Number(image.height) > Number(image.width) ? '4:3' : 'native';
        }

        function getImageBackdropAspect(filename, settingKey = filename, dimensions = null) {
            const setting = imageBackdropSettings[settingKey] || {};
            return setting.aspect === '4:3' || setting.aspect === 'native'
                ? setting.aspect
                : (dimensions && Number(dimensions.height) > Number(dimensions.width)
                    ? '4:3'
                    : getAutoImageBackdropAspect(filename));
        }

        function getUnifiedImageCornerRadius(width, height = width, designRadius = IMAGE_BACKDROP_DEFAULT_RADIUS) {
            // 圆角参数采用 1000px 短边的设计坐标，再映射到源图像素。
            // 因此 1x/2x 截图或不同分辨率图片会获得一致的视觉曲率。
            const shortSide = Math.max(1, Math.min(Number(width) || 1, Number(height) || Number(width) || 1));
            return Math.min(shortSide / 2, Math.max(0, Number(designRadius) || 0) * shortSide / 1000);
        }

        function getImageBackdropScale(setting = {}, fallback = 90) {
            const value = Number(setting.scale);
            return Number.isFinite(value) ? Math.max(60, Math.min(100, Math.round(value))) : fallback;
        }

        function isNearWhitePixel(r, g, b) {
            if (r >= 245 && g >= 245 && b >= 245) return true;
            const luminance = r * 0.299 + g * 0.587 + b * 0.114;
            const saturation = Math.max(r, g, b) - Math.min(r, g, b);
            return luminance >= 235 && saturation <= 18;
        }

        function getImageContentBounds(image, mode, size = 160) {
            if (!image) return null;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(image, 0, 0, size, size);
            const pixels = ctx.getImageData(0, 0, size, size).data;
            let minX = size, minY = size, maxX = -1, maxY = -1;
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const i = (y * size + x) * 4;
                    const alpha = pixels[i + 3];
                    const isContent = mode === 'transparent'
                        ? alpha >= 24
                        : alpha >= 245 && !isNearWhitePixel(pixels[i], pixels[i + 1], pixels[i + 2]);
                    if (!isContent) continue;
                    minX = Math.min(minX, x); minY = Math.min(minY, y);
                    maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
                }
            }
            return maxX < minX ? null : { minX, minY, maxX, maxY, size };
        }

        function getAdaptiveBackdropScale(image, mode, aspect = 'native') {
            if (!image || !['transparent', 'white-edge'].includes(mode)) return 90;
            try {
                const bounds = getImageContentBounds(image, mode, 160);
                if (!bounds) return 90;

                // 合成后要求“可见内容”四边处在一个舒适区间，而不是简单按原图尺寸缩放。
                // 内容贴边的图会降到 80 左右，透明/半透明区域较宽的图则保留 90，
                // 必要时略微放大，避免套上底图后主体显得过小。
                // 自动档以可见主体而非整张源图计算：主体贴边时必须显著缩小；
                // 原图自带较宽透明/白边时，才允许维持较大的前景。
                const targetMargin = aspect === '4:3' && image.naturalHeight > image.naturalWidth ? 0.11 : 0.12;
                const upperMargin = aspect === '4:3' && image.naturalHeight > image.naturalWidth ? 0.17 : 0.16;
                const innerMargins = [
                    bounds.minX / bounds.size,
                    bounds.minY / bounds.size,
                    (bounds.size - 1 - bounds.maxX) / bounds.size,
                    (bounds.size - 1 - bounds.maxY) / bounds.size
                ];
                let maxScale = 0.92;
                innerMargins.forEach((innerMargin) => {
                    if (innerMargin >= targetMargin || innerMargin >= 0.5) return;
                    const limit = (0.5 - targetMargin) / (0.5 - innerMargin);
                    maxScale = Math.min(maxScale, limit);
                });
                const minMargin = Math.min(...innerMargins);
                if (minMargin >= upperMargin) {
                    // 透明/白边已经明显偏宽时，提高比例以压缩合成后的外圈留白。
                    const expansion = innerMargins
                        .filter((margin) => margin < 0.5)
                        .map((margin) => (0.5 - targetMargin) / (0.5 - margin));
                    if (expansion.length) maxScale = Math.max(maxScale, Math.min(...expansion));
                }
                const minimumScale = aspect === '4:3' && image.naturalHeight > image.naturalWidth ? 78 : 68;
                return Math.max(minimumScale, Math.min(100, Math.round(maxScale * 100)));
            } catch (err) {
                return 90;
            }
        }

        function detectBackdropMode(image) {
            const canvas = document.createElement('canvas');
            const sampleSize = 160;
            canvas.width = sampleSize;
            canvas.height = sampleSize;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(image, 0, 0, sampleSize, sampleSize);
            const pixels = ctx.getImageData(0, 0, sampleSize, sampleSize).data;
            const total = sampleSize * sampleSize;
            let transparent = 0;
            let edgeWhite = 0;
            let edgeTotal = 0;
            const border = Math.max(2, Math.round(sampleSize * 0.015));
            for (let y = 0; y < sampleSize; y++) {
                for (let x = 0; x < sampleSize; x++) {
                    const offset = (y * sampleSize + x) * 4;
                    const alpha = pixels[offset + 3];
                    if (alpha < 245) transparent++;
                    if (x < border || x >= sampleSize - border || y < border || y >= sampleSize - border) {
                        if (alpha >= 245) {
                            edgeTotal++;
                            if (isNearWhitePixel(pixels[offset], pixels[offset + 1], pixels[offset + 2])) edgeWhite++;
                        }
                    }
                }
            }
            if (transparent / total >= 0.03) return 'transparent';
            return edgeTotal && edgeWhite / edgeTotal >= 0.4 ? 'white-edge' : 'manual';
        }

        function drawRoundedRectPath(ctx, x, y, width, height, radius) {
            const r = Math.max(0, Math.min(radius * CONTINUOUS_CORNER_EXTENT, width / 2, height / 2));
            const power = 2 / CONTINUOUS_CORNER_EXPONENT;
            const steps = 24;
            const addCorner = (centerX, centerY, xSign, ySign, start, end) => {
                for (let index = 0; index <= steps; index++) {
                    const angle = start + (end - start) * index / steps;
                    const offsetX = r * Math.pow(Math.abs(Math.cos(angle)), power);
                    const offsetY = r * Math.pow(Math.abs(Math.sin(angle)), power);
                    ctx.lineTo(centerX + xSign * offsetX, centerY + ySign * offsetY);
                }
            };
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + width - r, y);
            addCorner(x + width - r, y + r, 1, -1, Math.PI / 2, 0);
            ctx.lineTo(x + width, y + height - r);
            addCorner(x + width - r, y + height - r, 1, 1, 0, Math.PI / 2);
            ctx.lineTo(x + r, y + height);
            addCorner(x + r, y + height - r, -1, 1, Math.PI / 2, 0);
            ctx.lineTo(x, y + r);
            addCorner(x + r, y + r, -1, -1, 0, Math.PI / 2);
            ctx.closePath();
        }

        function getBackdropAssetDataUrls() {
            if (!backdropAssetDataUrlsPromise) {
                const embeddedAssets = window.__IMAGE_BACKDROP_ASSETS__;
                if (!embeddedAssets?.header || !embeddedAssets?.footer) {
                    throw new Error('图片加底内置素材未加载');
                }
                backdropAssetDataUrlsPromise = Promise.resolve({
                    header: embeddedAssets.header,
                    footer: embeddedAssets.footer
                });
            }
            return backdropAssetDataUrlsPromise;
        }

        async function renderBackdropForRecord(settingKey, imageRecord, sourceDataUrl, suppliedMode = '', renderConfig = {}) {
            if (!imageRecord || !sourceDataUrl || isGifImageBlock(imageRecord)) return;
            const source = await loadImageFromDataUrl(sourceDataUrl);
            const mode = suppliedMode || detectBackdropMode(source);
            const setting = imageBackdropSettings[settingKey] || {};
            const aspect = getImageBackdropAspect(settingKey, settingKey, {
                width: source.naturalWidth,
                height: source.naturalHeight
            });
            const autoScale = Number.isFinite(renderConfig.autoScale)
                ? renderConfig.autoScale
                : getAdaptiveBackdropScale(source, mode, aspect);
            const scale = getImageBackdropScale(setting, autoScale);
            const options = getImageBackdropOptions(settingKey, mode, settingKey);
            const foregroundOptions = renderConfig.foregroundEffectsPrepared
                ? { ...options, shadow: false, radius: false }
                : options;
            const signature = JSON.stringify({ version: 'image-workbench-v2', mode, aspect, enabled: options.enabled, scale, shadow: options.shadow, radius: options.radius, radiusSize: options.radiusSize, background: options.background, prepared: Boolean(renderConfig.foregroundEffectsPrepared), source: sourceDataUrl });
            if (imageRecord.backdropSignature === signature) return;
            imageRecord.backdropMode = mode;
            imageRecord.backdropAutoScale = autoScale;
            if (!options.enabled) {
                imageRecord.backdropDataUrl = '';
                imageRecord.backdropWidth = 0;
                imageRecord.backdropHeight = 0;
                imageRecord.backdropSignature = signature;
                return;
            }

            const sourceWidth = Math.max(1, source.naturalWidth);
            const sourceHeight = Math.max(1, source.naturalHeight);
            const shortSide = Math.min(sourceWidth, sourceHeight);
            const transparentBackground = options.background === 'none';
            const narrowMargin = Math.max(8, Math.round(shortSide * 0.018));
            const baseSigma = Math.max(2, Math.min(36, Math.round(shortSide / 50)));
            const transparentOutset = transparentBackground && foregroundOptions.shadow ? baseSigma * 2 : 0;
            let bgWidth;
            let bgHeight;
            if (transparentBackground) {
                bgWidth = sourceWidth + transparentOutset * 2;
                bgHeight = sourceHeight + transparentOutset * 2;
            } else if (aspect === '4:3') {
                const targetAspect = 4 / 3;
                const sourceAspect = sourceWidth / sourceHeight;
                if (sourceAspect >= targetAspect) {
                    bgWidth = sourceWidth + narrowMargin * 2;
                    bgHeight = Math.round(bgWidth / targetAspect);
                } else {
                    bgHeight = sourceHeight + narrowMargin * 2;
                    bgWidth = Math.round(bgHeight * targetAspect);
                }
            } else {
                bgWidth = sourceWidth + narrowMargin * 2;
                bgHeight = sourceHeight + narrowMargin * 2;
            }

            // 背景尺寸只由源图和画面比例决定，与缩放滑杆无关。后续拖动滑杆时
            // 只改变前景绘制尺寸，不再导致背景画布跳动或重新排版。
            const availableWidth = transparentBackground ? sourceWidth : Math.max(1, bgWidth - narrowMargin * 2);
            const availableHeight = transparentBackground ? sourceHeight : Math.max(1, bgHeight - narrowMargin * 2);
            const fitScale = transparentBackground
                ? 1
                : Math.min(availableWidth / sourceWidth, availableHeight / sourceHeight);
            const foregroundScale = fitScale * (transparentBackground ? 1 : scale / 100);
            const drawWidth = Math.max(1, Math.round(sourceWidth * foregroundScale));
            const drawHeight = Math.max(1, Math.round(sourceHeight * foregroundScale));
            const drawX = Math.round((bgWidth - drawWidth) / 2);
            const drawY = Math.round((bgHeight - drawHeight) / 2);
            const sigma = Math.max(2, Math.min(36, Math.round(Math.min(drawWidth, drawHeight) / 50)));
            const radius = getUnifiedImageCornerRadius(drawWidth, drawHeight, options.radiusSize);
            const canvas = document.createElement('canvas');
            canvas.width = bgWidth;
            canvas.height = bgHeight;
            const ctx = canvas.getContext('2d');
            if (transparentBackground) {
                ctx.clearRect(0, 0, bgWidth, bgHeight);
            } else if (IMAGE_BACKDROP_GRADIENTS[options.background]) {
                const [from, to] = IMAGE_BACKDROP_GRADIENTS[options.background];
                const gradient = ctx.createLinearGradient(0, 0, bgWidth, bgHeight);
                gradient.addColorStop(0, from);
                gradient.addColorStop(1, to);
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, bgWidth, bgHeight);
            } else if (options.background === 'blue') {
                ctx.fillStyle = '#3FB9FF';
                ctx.fillRect(0, 0, bgWidth, bgHeight);
            } else {
                const assetDataUrls = await getBackdropAssetDataUrls();
                const [header, footer] = await Promise.all([
                    loadImageFromDataUrl(assetDataUrls.header),
                    loadImageFromDataUrl(assetDataUrls.footer)
                ]);
                ctx.fillStyle = '#8CC6FF';
                ctx.fillRect(0, 0, bgWidth, bgHeight);
                const footerHeight = Math.round(bgWidth * footer.naturalHeight / footer.naturalWidth);
                const headerHeight = Math.round(bgWidth * header.naturalHeight / header.naturalWidth);
                ctx.drawImage(footer, 0, bgHeight - footerHeight, bgWidth, footerHeight);
                ctx.drawImage(header, 0, 0, bgWidth, headerHeight);
            }

            const drawSource = (targetCtx, x, y) => {
                targetCtx.save();
                if (foregroundOptions.radius) drawRoundedRectPath(targetCtx, x, y, drawWidth, drawHeight, radius);
                else { targetCtx.beginPath(); targetCtx.rect(x, y, drawWidth, drawHeight); }
                targetCtx.clip();
                targetCtx.drawImage(source, x, y, drawWidth, drawHeight);
                targetCtx.restore();
            };
            if (foregroundOptions.shadow) {
                const shadowLayer = document.createElement('canvas');
                shadowLayer.width = bgWidth;
                shadowLayer.height = bgHeight;
                const shadowCtx = shadowLayer.getContext('2d');
                drawSource(shadowCtx, drawX, drawY);
                shadowCtx.globalCompositeOperation = 'source-in';
                shadowCtx.fillStyle = '#000';
                shadowCtx.fillRect(0, 0, bgWidth, bgHeight);
                ctx.save();
                ctx.filter = `blur(${sigma}px)`;
                ctx.globalAlpha = 0.25;
                ctx.drawImage(shadowLayer, 0, 0);
                ctx.restore();
            }
            drawSource(ctx, drawX, drawY);
            try {
                imageRecord.backdropDataUrl = canvas.toDataURL('image/png');
                imageRecord.backdropWidth = bgWidth;
                imageRecord.backdropHeight = bgHeight;
                imageRecord.backdropMode = mode;
                imageRecord.backdropSignature = signature;
            } catch (error) {
                // 某些历史图片可能来自没有 CORS 许可的远程地址。
                // 这种图片不能导出 canvas，但不能因此让整篇预览失败；回退到原图。
                console.warn(`图片加底跳过（${settingKey}）：画布不可导出`, error);
                imageRecord.backdropDataUrl = '';
                imageRecord.backdropWidth = 0;
                imageRecord.backdropHeight = 0;
                imageRecord.backdropMode = mode;
                imageRecord.backdropSignature = '';
            }
        }

        async function renderImageBackdrop(filename, imageRecord) {
            if (!imageRecord || isGifImageBlock(imageRecord)) return;
            // 正文仅改文字时，图片的源数据和设置都没有变化。直接复用已生成的成品，
            // 不再为每次键入重新解码全部图片和画布，避免预览明显滞后。
            const mode = imageRecord.backdropMode;
            const autoScale = Number(imageRecord.backdropAutoScale);
            if (mode && Number.isFinite(autoScale)) {
                const setting = imageBackdropSettings[filename] || {};
                const aspect = getImageBackdropAspect(filename, filename, {
                    width: imageRecord.width,
                    height: imageRecord.height
                });
                const scale = getImageBackdropScale(setting, autoScale);
                const options = getImageBackdropOptions(filename, mode, filename);
                const signature = JSON.stringify({
                    version: 'image-workbench-v2', mode, aspect, enabled: options.enabled, scale,
                    shadow: options.shadow, radius: options.radius, radiusSize: options.radiusSize,
                    background: options.background, prepared: false,
                    source: imageRecord.displayDataUrl
                });
                if (imageRecord.backdropSignature === signature) return;
            }
            return renderBackdropForRecord(filename, imageRecord, imageRecord.displayDataUrl);
        }

        function getCardReferencedImageFilenames(markdown) {
            const filenames = new Set();
            const addReference = (reference, isProductCard = false) => {
                let ref = String(reference || '').trim();
                if (!ref) return;
                // 商品卡片后面可能跟着淘口令和链接，匹配图片时只保留图片名。
                if (isProductCard) ref = ref.replace(/\s+77《[\s\S]*$/, '').replace(/\s+https?:\/\/\S+$/, '').trim();
                const matched = isProductCard
                    ? findMatchingImage(ref, false, false)
                    : (findImageByReference(ref, false) || findMatchingImage(ref, false, false));
                if (matched?.filename) filenames.add(matched.filename);
            };

            String(markdown || '').split('\n').forEach((line) => {
                const text = line.trim();
                const productMatch = text.match(/^(?:商品卡片|商品小卡片)：(.*)$/);
                if (productMatch) {
                    addReference(productMatch[1], true);
                    return;
                }
                const activityMatch = text.match(/^活动卡片：(.*)$/);
                if (activityMatch) {
                    const spec = parseActivityCardSpec(activityMatch[1]);
                    addReference(spec.imageName);
                    addReference(spec.stripName);
                }
            });
            return filenames;
        }

        function getSideBySideReferencedImageFilenames(markdown) {
            const filenames = new Set();
            String(markdown || '').split('\n').forEach((line) => {
                const match = line.trim().match(/^【([^【】]+)】\s*[|｜]\s*【([^【】]+)】(?:\s*[|｜]\s*【([^【】]+)】)?$/);
                if (!match) return;
                for (let index = 1; index <= 3; index++) {
                    const reference = String(match[index] || '').trim();
                    if (!reference) continue;
                    const image = findImageByReference(reference, false) || findMatchingImage(reference, false, false);
                    if (image?.filename) filenames.add(image.filename);
                }
            });
            return filenames;
        }

        function getSideBySideImageGroups(markdown) {
            const groups = [];
            String(markdown || '').split('\n').forEach((line) => {
                const match = line.trim().match(/^【([^【】]+)】\s*[|｜]\s*【([^【】]+)】(?:\s*[|｜]\s*【([^【】]+)】)?$/);
                if (!match) return;
                const images = [];
                for (let index = 1; index <= 3; index++) {
                    const reference = String(match[index] || '').trim();
                    if (!reference) continue;
                    const image = findImageByReference(reference, false) || findMatchingImage(reference, false, false);
                    if (image?.filename && !isGifImageBlock(image)) images.push(image);
                }
                if (images.length > 1) groups.push(images);
            });
            return groups;
        }

        function getSideBySideBackdropMode(sources) {
            const modes = sources.map((source) => detectBackdropMode(source));
            if (modes.length && modes.every((mode) => mode === 'transparent')) return 'transparent';
            if (modes.length && modes.every((mode) => mode === 'white-edge')) return 'white-edge';
            return 'manual';
        }

        async function buildSideBySideBackdropRecord(images) {
            const key = getSideBySideBackdropKey(images);
            const existingRecord = sideBySideBackdropRecords[key];
            // 并排成品生成涉及多次 Canvas 合成；编辑普通文字时不应重复做这项工作。
            const cacheSignature = JSON.stringify({
                sources: images.map((image) => [image.filename, image.displayDataUrl, image.width, image.height]),
                setting: imageBackdropSettings[key] || {},
                globalEnabled: typographySettings.imageBackdrop === true,
                alignment: typographySettings.imageAlign || ''
            });
            if (existingRecord?.sideBySideSignature === cacheSignature) return existingRecord;
            const preliminary = await createSideBySideComposite(images);
            const mode = getSideBySideBackdropMode(preliminary.sources);
            const options = getImageBackdropOptions(key, mode, key);
            const composite = await createSideBySideComposite(images, {
                radius: options.radius,
                shadow: options.shadow
            });
            const record = sideBySideBackdropRecords[key] || (sideBySideBackdropRecords[key] = {});
            record.rawDataUrl = composite.dataUrl;
            record.rawWidth = composite.width;
            record.rawHeight = composite.height;
            record.filename = key;
            record.imageCount = images.length;
            record.autoGap = composite.autoLayout.gap;
            record.displayName = images.map((image) => image.displayName || image.filename).join('｜');
            await renderBackdropForRecord(key, record, composite.dataUrl, mode, {
                autoScale: composite.autoLayout.scale,
                foregroundEffectsPrepared: options.radius || options.shadow
            });
            record.sideBySideSignature = cacheSignature;
            return record;
        }

        async function mergeImagesForWeChatPackage(images, previewDataUrl = '') {
            // 优先使用用户当前预览的确切成品，避免下载时重算产生缩放差异。
            if (previewDataUrl) return previewDataUrl;
            const record = await buildSideBySideBackdropRecord(images);
            return record.backdropDataUrl || record.rawDataUrl || '';
        }

        async function prepareSideBySideBackdropData(markdown = '') {
            const activeKeys = new Set();
            const groups = getSideBySideImageGroups(markdown);
            await Promise.allSettled(groups.map(async (images) => {
                const key = getSideBySideBackdropKey(images);
                activeKeys.add(key);
                await buildSideBySideBackdropRecord(images);
            }));
            Object.keys(sideBySideBackdropRecords).forEach((key) => {
                if (!activeKeys.has(key)) delete sideBySideBackdropRecords[key];
            });
        }

        function getBackdropExcludedImageFilenames(markdown) {
            const filenames = getCardReferencedImageFilenames(markdown);
            getSideBySideReferencedImageFilenames(markdown).forEach((filename) => filenames.add(filename));
            return filenames;
        }

        async function prepareImageBackdropData(markdown = '') {
            const excludedFilenames = getBackdropExcludedImageFilenames(markdown);
            const imageEntries = Object.entries(uploadedImages);
            const results = await Promise.allSettled(imageEntries.map(([filename, image]) => {
                if (!excludedFilenames.has(filename)) {
                    image.backdropExcludedForCards = false;
                    return renderImageBackdrop(filename, image);
                }
                // 卡片图片和并排图片只参与各自的排版/替换链路，不能进入正文图片加底链路。
                image.backdropExcludedForCards = true;
                image.backdropDataUrl = '';
                image.backdropWidth = 0;
                image.backdropHeight = 0;
                image.backdropSignature = 'backdrop-excluded-v2';
                return undefined;
            }));
            results.forEach((result, index) => {
                if (result.status === 'rejected') {
                    const [filename, image] = imageEntries[index];
                    console.warn(`图片加底跳过（${filename || '未知图片'}）：`, result.reason);
                    if (image) {
                        image.backdropDataUrl = '';
                        image.backdropWidth = 0;
                        image.backdropHeight = 0;
                        image.backdropSignature = '';
                    }
                }
            });
            await prepareSideBySideBackdropData(markdown);
        }

        async function ensureImageBackdropEligibility(markdown = '') {
            const excludedFilenames = getBackdropExcludedImageFilenames(markdown);
            const tasks = Object.entries(uploadedImages).map(async ([filename, image]) => {
                if (excludedFilenames.has(filename)) {
                    image.backdropExcludedForCards = true;
                    image.backdropEligible = false;
                    return;
                }
                if (image.backdropEligible !== undefined || !image.displayDataUrl || isGifImageBlock(image)) return;
                try {
                    const loaded = await loadImageFromDataUrl(image.displayDataUrl);
                    const canvas = document.createElement('canvas');
                    const size = 32;
                    canvas.width = size; canvas.height = size;
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    ctx.drawImage(loaded, 0, 0, size, size);
                    const pixels = ctx.getImageData(0, 0, size, size).data;
                    let lightOrTransparent = 0;
                    for (let i = 0; i < pixels.length; i += 4) {
                        if (pixels[i + 3] < 24 || (pixels[i] > 238 && pixels[i + 1] > 238 && pixels[i + 2] > 238)) lightOrTransparent++;
                    }
                    image.backdropEligible = lightOrTransparent / (pixels.length / 4) >= 0.55;
                } catch (err) { image.backdropEligible = false; }
            });
            await Promise.all(tasks);
        }

        function getReferencedImageStyles(block) {
            const isSeamless = block.specialMode === 'seamless';
            const isNonSelectable = block.specialMode === 'non-selectable';
            const personalFrame = isPersonalMode && !isSeamless;
            const frameStyle = personalFrame ? 'border: 2px solid rgb(192, 204, 92); border-style: dashed; padding: 8px; background: #ffffff; box-sizing: border-box; ' : '';
            const seamStyle = isSeamless ? 'display: block; margin: 0 !important; padding: 0 !important; vertical-align: top; ' : '';
            const selectStyle = isNonSelectable ? 'pointer-events: none; user-select: none; -webkit-user-select: none; ' : '';
            const backdropStyle = getImageBackdropStyle(block);
            const imageStyle = `width: 100% !important; height: auto !important; ${frameStyle}${seamStyle}${selectStyle}${backdropStyle} visibility: visible !important;`;
            const originalStyle = `width: 100%;height: auto !important;${frameStyle.replace(/\s*!important/g, '').replace(/\s+/g, ' ').trim()}${backdropStyle}${isSeamless ? 'display: block;margin: 0;padding: 0;vertical-align: top;' : ''}${isNonSelectable ? 'pointer-events: none;user-select: none;-webkit-user-select: none;' : ''}`;
            const sectionStyle = isSeamless
                ? 'text-align: center; margin: 0; padding: 0; font-size: 0; line-height: 0; display: block;'
                : 'text-align: center; margin: 0; padding: 0;';
            return { imageStyle, originalStyle, sectionStyle };
        }

        function generateReferencedImageHTML(block) {
            const captionHTML = block.caption ? `<p style="margin: 0; padding: 0; text-align: center;"><span style="font-size: 12px; color: rgb(136, 136, 136);">${block.caption}</span></p>` : '';
            const { imageStyle, originalStyle, sectionStyle } = getReferencedImageStyles(block);
            const adaptiveAttrs = getWeChatAdaptiveImageAttrs(block, { originalStyle });
            return `<section style="${sectionStyle}"><img data-img-filename="${block.filename}" data-src="${block.dataUrl}" class="rich_pages wxw-img" style="${imageStyle}" src="${block.dataUrl}" alt="${block.alt}" ${adaptiveAttrs}>${captionHTML}</section>`;
        }

        function generateSeamlessImagesHTML(images, replaceGifWithPlaceholder = false) {
            const imageHTML = images.map((img) => {
                if (img.placeholder) {
                    return `<section style="text-align: center; padding: 18px 4px; background: rgb(245, 245, 245); border: 1px dashed rgb(192, 204, 92); color: rgb(153, 153, 153); font-size: 13px; line-height: 1.4; box-sizing: border-box;">【${img.text}】未找到匹配图片</section>`;
                }

                const block = { ...img, specialMode: 'seamless' };
                const { imageStyle, originalStyle } = getReferencedImageStyles(block);
                if (replaceGifWithPlaceholder && isGifImageBlock(block)) {
                    const name = block.displayName || block.filename || block.alt || 'GIF动图';
                    const placeholderSrc = createGifPlaceholderImage(name);
                    return `<img data-src="${placeholderSrc}" class="rich_pages wxw-img" width="100%" _width="100%" data-ratio="0.24444444" data-s="300,640" data-type="png" data-w="900" data-backw="578" data-backh="141" data-original-style="${originalStyle}" style="${imageStyle}" src="${placeholderSrc}" alt="GIF待替换：${name}">`;
                }

                const adaptiveAttrs = getWeChatAdaptiveImageAttrs(block, { originalStyle });
                return `<img data-img-filename="${block.filename}" data-src="${block.dataUrl}" class="rich_pages wxw-img" style="${imageStyle}" src="${block.dataUrl}" alt="${block.alt}" ${adaptiveAttrs}>`;
            }).join('');

            return `<section style="text-align: center; margin: 0; padding: 0; font-size: 0; line-height: 0; display: block;">${imageHTML}</section>`;
        }

        const defaultProductImageDataUrls = {

        function getMimeTypeFromImageUrl(url) {
            const cleanUrl = String(url).split('?')[0].toLowerCase();
            if (cleanUrl.endsWith('.jpg') || cleanUrl.endsWith('.jpeg')) return 'image/jpeg';
            if (cleanUrl.endsWith('.gif')) return 'image/gif';
            if (cleanUrl.endsWith('.webp')) return 'image/webp';
            return 'image/png';
        }

        function loadImageElementAsDataUrl(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                // 跨域图片只有在服务端明确允许匿名 CORS 时才能进入 canvas。
                // 若未设置 crossOrigin，图片会污染 canvas，随后 toDataURL 必然抛错。
                if (!/^data:|^blob:/i.test(String(url))) img.crossOrigin = 'anonymous';
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.naturalWidth || img.width;
                        canvas.height = img.naturalHeight || img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        resolve(canvas.toDataURL(getMimeTypeFromImageUrl(url)));
                    } catch (err) {
                        reject(err);
                    }
                };
                img.onerror = () => reject(new Error(`图片加载失败: ${url}`));
                img.src = url;
            });
        }

        async function loadImageUrlAsDataUrl(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`图片加载失败: ${url}`);
                const blob = await response.blob();
                return await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            } catch (err) {
                console.warn('fetch 读取图片失败，尝试用 CORS 图片读取:', err);
                try {
                    return await loadImageElementAsDataUrl(url);
                } catch (fallbackErr) {
                    // 远程站点未提供 CORS 时，不能把它画进可导出的 canvas。
                    // 保留原有 URL 的调用方自行降级，避免阻断整篇文章预览。
                    fallbackErr.cause = err;
                    throw fallbackErr;
                }
            }
        }

        function loadImageFromDataUrl(dataUrl) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('图片读取失败'));
                img.src = dataUrl;
            });
        }

        function colorToCss(color) {
            return `rgb(${color.r}, ${color.g}, ${color.b})`;
        }

        function parseCssRgb(cssColor) {
            const match = String(cssColor || '').match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
            if (!match) return { r: 246, g: 251, b: 253 };
            return {
                r: Number(match[1]),
                g: Number(match[2]),
                b: Number(match[3])
            };
        }

        function getRelativeLuminance(color) {
            const rgb = [color.r, color.g, color.b].map((value) => {
                const normalized = value / 255;
                return normalized <= 0.03928
                    ? normalized / 12.92
                    : Math.pow((normalized + 0.055) / 1.055, 2.4);
            });
            return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
        }

        function getReadableTextColor(cssColor) {
            const luminance = getRelativeLuminance(parseCssRgb(cssColor));
            return luminance > 0.48 ? 'rgb(0, 0, 0)' : 'rgb(255, 255, 255)';
        }

        function normalizeActivityColor(value, fallback = 'rgb(246, 251, 253)') {
            const text = String(value || '').trim();
            const hex = text.match(/#([0-9a-f]{6}|[0-9a-f]{3})\b/i);
            if (hex) {
                let raw = hex[1];
                if (raw.length === 3) raw = raw.split('').map(ch => ch + ch).join('');
                const r = parseInt(raw.slice(0, 2), 16);
                const g = parseInt(raw.slice(2, 4), 16);
                const b = parseInt(raw.slice(4, 6), 16);
                return `rgb(${r}, ${g}, ${b})`;
            }

            const rgb = text.match(/rgba?\(\s*\d+\s*,\s*\d+\s*,\s*\d+(?:\s*,\s*(?:0|1|0?\.\d+))?\s*\)/i);
            return rgb ? rgb[0] : fallback;
        }

        function parseActivityCardSpec(rawSpec) {
            const spec = String(rawSpec || '').trim();
            const refs = Array.from(spec.matchAll(/【([^【】]+)】/g)).map(match => match[1].trim());
            const color = normalizeActivityColor(spec, '');
            const parts = spec.split(/[|｜,，]/).map(part => part.trim()).filter(Boolean);
            const fallbackName = normalizeProductImageName(parts[0] || spec);

            return {
                imageName: normalizeProductImageName(refs[0] || fallbackName),
                stripName: refs[1] ? normalizeProductImageName(refs[1]) : '',
                backgroundColor: color || ''
            };
        }

        function averagePixels(imageData, options = {}) {
            const data = imageData.data;
            const stride = options.stride || 4;
            let r = 0;
            let g = 0;
            let b = 0;
            let count = 0;

            for (let i = 0; i < data.length; i += 4 * stride) {
                const alpha = data[i + 3];
                if (alpha < 128) continue;
                r += data[i];
                g += data[i + 1];
                b += data[i + 2];
                count++;
            }

            if (!count) return { r: 246, g: 251, b: 253 };
            return {
                r: Math.round(r / count),
                g: Math.round(g / count),
                b: Math.round(b / count)
            };
        }

        function getDominantColorFromImageData(imageData) {
            const data = imageData.data;
            const buckets = new Map();
            const bucketSize = 24;
            const sampleStep = Math.max(1, Math.floor((imageData.width * imageData.height) / 18000));

            for (let i = 0; i < data.length; i += 4 * sampleStep) {
                const alpha = data[i + 3];
                if (alpha < 128) continue;

                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const max = Math.max(r, g, b);
                const min = Math.min(r, g, b);
                const brightness = (r + g + b) / 3;
                const saturation = max === 0 ? 0 : (max - min) / max;

                // 活动卡片常见的白底、黑字、二维码黑块不适合作为底色，优先统计有色区域。
                if ((brightness > 232 && saturation < 0.18) || brightness < 34) continue;

                const key = [
                    Math.round(r / bucketSize),
                    Math.round(g / bucketSize),
                    Math.round(b / bucketSize)
                ].join(',');

                const bucket = buckets.get(key) || { r: 0, g: 0, b: 0, count: 0, score: 0 };
                bucket.r += r;
                bucket.g += g;
                bucket.b += b;
                bucket.count++;
                bucket.score += 1 + saturation;
                buckets.set(key, bucket);
            }

            let best = null;
            for (const bucket of buckets.values()) {
                if (!best || bucket.score > best.score) best = bucket;
            }

            if (!best || !best.count) return averagePixels(imageData, { stride: sampleStep });
            return {
                r: Math.round(best.r / best.count),
                g: Math.round(best.g / best.count),
                b: Math.round(best.b / best.count)
            };
        }

        async function ensureDefaultProductImagesForCopy() {
            const needsBanner = !isPersonalMode;
            if (defaultProductImageDataUrls.qr && (!needsBanner || defaultProductImageDataUrls.banner)) {
                return;
            }

            try {
                if (!defaultProductImageDataUrls.qr) {
                    defaultProductImageDataUrls.qr = await loadImageUrlAsDataUrl('images/product-card-qr.png');
                }
                if (needsBanner && !defaultProductImageDataUrls.banner) {
                    defaultProductImageDataUrls.banner = await loadImageUrlAsDataUrl('images/product-card-banner.png');
                }
            } catch (err) {
                console.warn('本地默认商品卡片图片内嵌失败，尝试远程链接:', err);
                try {
                    if (!defaultProductImageDataUrls.qr) {
                        defaultProductImageDataUrls.qr = await loadImageUrlAsDataUrl(githubImages.productCardQr);
                    }
                    if (needsBanner && !defaultProductImageDataUrls.banner) {
                        defaultProductImageDataUrls.banner = await loadImageUrlAsDataUrl(githubImages.productCardBanner);
                    }
                } catch (fallbackErr) {
                    console.warn('默认商品卡片图片内嵌失败，将回退为链接:', fallbackErr);
                }
            }
        }

        function isGifImageBlock(block) {
            const mimeType = (block.mimeType || '').toLowerCase();
            const filename = (block.filename || block.displayName || '').toLowerCase();
            return mimeType === 'image/gif' || filename.endsWith('.gif');
        }

        function createGifPlaceholderHTML(block) {
            const name = block.displayName || block.filename || block.alt || 'GIF动图';
            const placeholderSrc = createGifPlaceholderImage(name);
            const personalImageStyle = 'width: 100% !important; height: auto !important; border: 2px dashed rgb(192, 204, 92); padding: 8px; background: #ffffff; box-sizing: border-box; visibility: visible !important;';
            const defaultImageStyle = 'width: 100% !important; height: auto !important; visibility: visible !important;';
            const imageStyle = isPersonalMode ? personalImageStyle : defaultImageStyle;
            const originalStyle = isPersonalMode ? 'width: 100%;height: auto !important;border: 2px dashed rgb(192, 204, 92);padding: 8px;background: #ffffff;box-sizing: border-box;' : 'width: 100%;height: auto !important;';
            return `<section style="text-align: center; margin: 0; padding: 0;">
                <img data-src="${placeholderSrc}" class="rich_pages wxw-img" width="100%" _width="100%" data-ratio="0.24444444" data-s="300,640" data-type="png" data-w="900" data-backw="578" data-backh="141" data-original-style="${originalStyle}" style="${imageStyle}" src="${placeholderSrc}" alt="GIF待替换：${name}">
            </section>`;
        }

        function createGifPlaceholderImage(name) {
            const canvas = document.createElement('canvas');
            canvas.width = 900;
            canvas.height = 220;
            const ctx = canvas.getContext('2d');
            const displayName = name.length > 36 ? `${name.slice(0, 33)}...` : name;

            ctx.fillStyle = '#fff5f5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 8;
            ctx.setLineDash([22, 14]);
            ctx.strokeRect(12, 12, canvas.width - 24, canvas.height - 24);
            ctx.setLineDash([]);

            ctx.fillStyle = '#d2271e';
            ctx.font = '700 44px "PingFang SC", "Microsoft YaHei", Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('GIF 动图待替换', canvas.width / 2, 82);

            ctx.fillStyle = '#8f1d18';
            ctx.font = '500 30px "PingFang SC", "Microsoft YaHei", Arial, sans-serif';
            ctx.fillText(displayName, canvas.width / 2, 142);
            return canvas.toDataURL('image/png');
        }
        
        /**
         * 增加图片使用计数
         * @param {string} dataUrl - 图片的 data URL
         */
         function incrementImageUseCount(imageRef) {
            if (uploadedImages[imageRef]) {
                uploadedImages[imageRef].useCount++;
                return;
            }
            for (const filename of Object.keys(uploadedImages)) {
                if (uploadedImages[filename].displayDataUrl === imageRef) {
                    uploadedImages[filename].useCount++;
                    break;
                }
            }
        }
        
        /**
         * 根据引用文本查找匹配的图片（优先级：精确 > 包含 > 模糊）
         * @param {string} refText - 引用文本（如「图1」、「动图演示」）
         * @returns {{ filename, dataUrl, width, height, mimeType } | null}
         */
        function findImageByReference(refText, useCopyDataUrl = false) {
            const refLower = refText.toLowerCase();
            
            // 1. 精确匹配完整文件名（包含扩展名）
            for (const filename of Object.keys(uploadedImages)) {
                const displayName = uploadedImages[filename].displayName || filename;
                if (displayName.toLowerCase() === refLower) {
                    return getUploadedImageInfo(filename, useCopyDataUrl);

        /* ==================== 文本格式化工具 ==================== */
        
        /**
         * 处理行内格式：加粗、标蓝、加粗标蓝
