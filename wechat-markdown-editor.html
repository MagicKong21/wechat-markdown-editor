          * @returns {string} 处理后的HTML
          */
function processTextSpacing(text) {
            // 保护微信小程序链接，避免「://」和路径斜杠被空格规则拆开
            const miniProgramTokens = [];
            const miniProgramPattern = /#小程序:\/\/[^\s]+/g;
            text = text.replace(miniProgramPattern, (match) => {
                const token = `__MINI_PROGRAM_TOKEN_${miniProgramTokens.length}__`;
                miniProgramTokens.push(match);
                return token;
            });

            // 保护 URL 避免被斜杠规则影响
            const urlTokens = [];
            const urlPattern = /https?:\/\/[^\s]+/g;
            text = text.replace(urlPattern, (match) => {
                const token = `__URL_TOKEN_${urlTokens.length}__`;
                urlTokens.push(match);
                return token;
            });

            // 保护行内代码（反引号包裹的内容）避免被斜杠规则影响
            const inlineCodeTokens = [];
            const inlineCodePattern = /`([^`]+?)`/g;
            text = text.replace(inlineCodePattern, (match, content) => {
                const token = `__INLINE_CODE_${inlineCodeTokens.length}__`;
                inlineCodeTokens.push(match); // 保留原始文本，包括反引号
                return token;
            });

            // 中英文混排加空格（使用预编译正则）
            text = text.replace(REGEX_PATTERNS.cnEnBefore, '$1 $2');
            text = text.replace(REGEX_PATTERNS.enCnBefore, '$1 $2');

            // 数字和中文之间加空格
            text = text.replace(REGEX_PATTERNS.cnDigitBefore, '$1 $2');
            text = text.replace(REGEX_PATTERNS.digitCnBefore, '$1 $2');

            // 中文括号转换：「（」改为「 (」，「）」改为「) 」
            text = text.replace(/（/g, ' (');
            text = text.replace(/）/g, ') ');
            text = text.replace(REGEX_PATTERNS.multiSpace, ' ');

            // 中文弯引号和英文直双引号转换为直角引号
            let inQuote = false;
            text = text.replace(/(\u201C|\u201D|")/g, () => {
                inQuote = !inQuote;
                return inQuote ? '「' : '」';
            });

            // 破折号两侧加空格
            text = text.replace(/\s*——\s*/g, ' —— ');

            // 数字后的加号属于数量表达，例如「50+ 商家」；文字连接符两侧加空格，例如「暴晒 + 闷热」
            text = text.replace(REGEX_PATTERNS.numberPlusBeforeText, '$1+ ');
            text = text.replace(REGEX_PATTERNS.plusBetweenText, '$1 + ');

            // 斜杠两侧加空格（仅对普通文字，不处理已保护的 URL 和行内代码）
            text = text.replace(/\s*\/\s*/g, ' / ');

            // 恢复行内代码令牌
            inlineCodeTokens.forEach((code, index) => {
                const token = `__INLINE_CODE_${index}__`;
                text = text.replace(token, code);
            });

            // 恢复 URL 令牌
            urlTokens.forEach((url, index) => {
                const token = `__URL_TOKEN_${index}__`;
                text = text.replace(token, url);
            });

            // 恢复微信小程序链接令牌
            miniProgramTokens.forEach((link, index) => {
                const token = `__MINI_PROGRAM_TOKEN_${index}__`;
                text = text.replace(token, link);
            });

            return text;
        }

                css: 'align|all|animation|background|border|bottom|box|break|calc|clear|clip|color|column|content|counter|cursor|direction|display|empty|filter|flex|float|font|gap|grid|height|justify|left|letter|line|list|margin|max|min|mix|object|opacity|order|outline|overflow|padding|page|perspective|place|position|quotes|resize|right|row|scroll|tab|table|text|top|transform|transition|unicode|vertical|visibility|white|width|word|z|important|inherit|initial|unset|auto|none|solid|dashed|dotted|block|inline|flex|grid|relative|absolute|fixed|sticky',
                html: '',
                go: 'break|case|chan|const|continue|default|defer|else|fallthrough|for|func|go|goto|if|import|interface|map|package|range|return|select|struct|switch|type|var|make|len|cap|append|copy|delete|close|panic|recover|nil|true|false|iota|print|println',
                rust: 'as|async|await|break|const|continue|crate|dyn|else|enum|extern|false|fn|for|if|impl|in|let|loop|match|mod|move|mut|pub|ref|return|self|static|struct|super|trait|true|type|unsafe|use|where|while|yield|Some|None|Ok|Err|Box|Vec|String|Option|Result',
                java: 'abstract|assert|boolean|break|byte|case|catch|char|class|const|continue|default|do|double|else|enum|extends|final|finally|float|for|goto|if|implements|import|instanceof|int|interface|long|native|new|null|package|private|protected|public|return|short|static|strictfp|super|switch|synchronized|this|throw|throws|transient|try|void|volatile|while|true|false',
                c: 'auto|break|case|char|const|continue|default|do|double|else|enum|extern|float|for|goto|if|inline|int|long|register|restrict|return|short|signed|sizeof|static|struct|switch|typedef|union|unsigned|void|volatile|while|NULL|true|false|bool|size_t|printf|scanf|malloc|free|strlen|strcpy|memcpy',
                cpp: 'alignas|alignof|and|asm|auto|bitand|bitor|bool|break|case|catch|char|char8_t|char16_t|char32_t|class|compl|concept|const|consteval|constexpr|constinit|const_cast|continue|co_await|co_return|co_yield|decltype|default|delete|do|double|dynamic_cast|else|enum|explicit|export|extern|float|for|friend|goto|if|inline|int|long|mutable|namespace|new|noexcept|not|nullptr|operator|or|private|protected|public|register|reinterpret_cast|requires|return|short|signed|sizeof|static|static_assert|static_cast|struct|switch|template|this|thread_local|throw|try|typedef|typeid|typename|union|unsigned|using|virtual|void|volatile|wchar_t|while|xor',
                sql: 'SELECT|FROM|WHERE|AND|OR|NOT|IN|IS|NULL|AS|ON|JOIN|LEFT|RIGHT|INNER|OUTER|FULL|CROSS|GROUP|BY|HAVING|ORDER|ASC|DESC|LIMIT|OFFSET|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|ALTER|DROP|INDEX|VIEW|TRIGGER|FUNCTION|PROCEDURE|PRIMARY|KEY|FOREIGN|REFERENCES|UNIQUE|CHECK|DEFAULT|CONSTRAINT|CASCADE|EXISTS|BETWEEN|LIKE|CASE|WHEN|THEN|ELSE|END|UNION|ALL|DISTINCT|COUNT|SUM|AVG|MIN|MAX|COALESCE|IF|IFNULL|CONCAT|SUBSTRING|TRIM|UPPER|LOWER|LENGTH|NOW|DATE|CAST',
                yaml: 'true|false|null|yes|no|on|off',
                markdown: '',
                diff: '',
                makefile: '',
                dockerfile: ''
            };

            // 1. 注释（先处理，避免被其他规则干扰）
            if (lang === 'python' || lang === 'ruby' || lang === 'yaml' || lang === 'shell' || lang === 'bash') {
                html = html.replace(/(#.*)$/gm, '<span style="color:#6a9955;">$1</span>');
            }
            if (['javascript','typescript','java','c','cpp','go','rust','css','json','kotlin','swift','dart'].includes(lang)) {
                html = html.replace(/(\/\/.*)$/gm, '<span style="color:#6a9955;">$1</span>');
                html = html.replace(/(\/\*[\s\S]*?\*\/)/g, '<span style="color:#6a9955;">$1</span>');
            }
            if (lang === 'html' || lang === 'xml') {
                html = html.replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span style="color:#6a9955;">$1</span>');
            }
            if (lang === 'sql') {
                html = html.replace(/(--.*)$/gm, '<span style="color:#6a9955;">$1</span>');
            }

            // 2. 字符串
            html = html.replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)/g, '<span style="color:#ce9178;">$1</span>');
            html = html.replace(/(&#39;(?:[^&]|&(?!#39;))*?&#39;)/g, '<span style="color:#ce9178;">$1</span>');
            // 模板字符串
            html = html.replace(/(`[^`]*`)/g, '<span style="color:#ce9178;">$1</span>');

            // 3. 数字
            html = html.replace(/\b(\d+\.?\d*(?:e[+-]?\d+)?)\b/gi, '<span style="color:#b5cea8;">$1</span>');

            // 4. 关键词
            const kw = keywords[lang];
            if (kw) {
                const kwPattern = new RegExp('\\b(' + kw + ')\\b', lang === 'sql' ? 'g' : 'g');
                html = html.replace(kwPattern, '<span style="color:#c586c0;">$1</span>');
            }

            // 5. 函数调用
            html = html.replace(/\b([a-zA-Z_]\w*)\s*\(/g, '<span style="color:#dcdcaa;">$1</span>(');

            // 6. JSON 特殊处理
            if (lang === 'json') {
                html = html.replace(/(&quot;[^&]*?&quot;)\s*:/g, '<span style="color:#9cdcfe;">$1</span>:');
                html = html.replace(/:\s*(&quot;[^&]*?&quot;)/g, ': <span style="color:#ce9178;">$1</span>');
                html = html.replace(/:\s*(true|false|null)\b/g, ': <span style="color:#569cd6;">$1</span>');
            }

            // 7. HTML tag names
            if (lang === 'html' || lang === 'xml') {
                html = html.replace(/(&lt;\/?)([\w-]+)/g, '$1<span style="color:#569cd6;">$2</span>');
                html = html.replace(/\b([\w-]+)(=)/g, '<span style="color:#9cdcfe;">$1</span>$2');
            }

            return html;
        }

        function preserveCodeLineWhitespace(lineHtml) {
            return lineHtml
                .replace(/^ +/, spaces => '&nbsp;'.repeat(spaces.length))
                .replace(/\t/g, '&nbsp;&nbsp;&nbsp;&nbsp;')
                .replace(/ {2}/g, '&nbsp;&nbsp;');
        }

        function formatCodeLinesForWeChat(code, language) {
            return code.split('\n').map(line => {
                const highlightedLine = highlightCode(line, language);
                const preservedLine = preserveCodeLineWhitespace(highlightedLine);
                return preservedLine || '&nbsp;';
            }).join('<br>');
        }

        const codeKeywordMap = {
            python: 'False|None|True|and|as|assert|async|await|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|nonlocal|not|or|pass|raise|return|try|while|with|yield|self|print|range|len|str|int|float|list|dict|tuple|set|type|isinstance|super',
            javascript: 'async|await|break|case|catch|class|const|continue|debugger|default|delete|do|else|export|extends|false|finally|for|function|if|import|in|instanceof|let|new|null|of|return|static|super|switch|this|throw|true|try|typeof|undefined|var|void|while|yield',
            typescript: 'abstract|as|async|await|break|case|catch|class|const|continue|declare|default|delete|do|else|enum|export|extends|false|finally|for|from|function|if|implements|import|in|instanceof|interface|keyof|let|namespace|never|null|private|protected|public|readonly|return|static|super|switch|this|throw|true|try|type|typeof|undefined|var|void|while',
            json: 'true|false|null',
            bash: 'if|then|else|elif|fi|for|while|do|done|case|esac|in|function|return|exit|local|export|source|alias|cd|pwd|echo|printf|read|test|shift|set|unset',
            shell: 'if|then|else|elif|fi|for|while|do|done|case|esac|in|function|return|exit|local|export|source|alias|cd|pwd|echo|printf|read|test|shift|set|unset'
        };

        function highlightPlainCodeSegment(text, language) {
            const lang = (language || '').toLowerCase();
            let html = escapeHtml(text);
            html = html.replace(/\b(\d+\.?\d*)\b/g, '<span style="color:#b5cea8;">$1</span>');
            const keywords = codeKeywordMap[lang] || '';
            if (keywords) {
                html = html.replace(new RegExp(`\\b(${keywords})\\b`, 'g'), '<span style="color:#c586c0;">$1</span>');
            }
            return html;
        }

        function highlightCodeLine(line, language) {
            const lang = (language || '').toLowerCase();
            const commentMarkers = ['python', 'ruby', 'yaml', 'bash', 'shell'].includes(lang) ? ['#'] : ['//'];
            let html = '';
            let i = 0;

            while (i < line.length) {
                const marker = commentMarkers.find(item => line.startsWith(item, i));
                if (marker) {
                    html += `<span style="color:#6a9955;">${escapeHtml(line.slice(i))}</span>`;
                    break;
                }

                const char = line[i];
                if (char === '"' || char === "'" || char === '`') {
                    const quote = char;
                    let end = i + 1;
                    while (end < line.length) {
                        if (line[end] === '\\') {
                            end += 2;
                            continue;
                        }
                        if (line[end] === quote) {
                            end++;
                            break;
                        }
                        end++;
                    }
                    const rawString = line.slice(i, end);
                    const rest = line.slice(end).trimStart();
                    const color = rest.startsWith(':') ? '#9cdcfe' : '#ce9178';
                    html += `<span style="color:${color};">${escapeHtml(rawString)}</span>`;
                    i = end;
                    continue;
                }

                let next = i + 1;
                while (next < line.length) {
                    const startsComment = commentMarkers.some(item => line.startsWith(item, next));
                    if (startsComment || ['"', "'", '`'].includes(line[next])) break;
                    next++;
                }
                html += highlightPlainCodeSegment(line.slice(i, next), lang);
                i = next;
            }

            return html;
        }

        highlightCode = function(code, language) {
            return highlightCodeLine(code, language);
        };

        /**

                    ${windowDots}<span style="float: right; color: rgb(145, 145, 145); font-size: 12px; letter-spacing: 0.5px; user-select: none; -webkit-user-select: none;">${langLabel}</span>

        function generateSideBySideImagesHTML(images, replaceGifWithPlaceholder = false, withPersonalFrame = false) {
            const count = images.length;
            const equalHeight = typographySettings.imageAlign !== 'width';
            const wechatEditorWidth = 677;
            const wechatBackWidth = 578;
            const widthWeights = images.map((img) => {
                const width = Number(img.width) || 0;
                const height = Number(img.height) || 0;
                return width > 0 && height > 0 ? width / height : 1;
            });
            const totalWeight = widthWeights.reduce((sum, weight) => sum + weight, 0) || count;
            const cellGap = `${getSideBySideCellGap(count)}px`;
            const gapPx = parseFloat(cellGap);
            // 中缝只放在第二张及后续图片之前。border-spacing 会在表格左右也生成间距，
            // 粘贴进公众号后就会表现成与正文相同的 16px 左右缩进，因此不能用它实现并排图间距。
            const gapWidth = gapPx * Math.max(0, count - 1);
            const availableImageWidth = Math.max(1, wechatEditorWidth - gapWidth);
            const availableBackWidth = Math.max(1, wechatBackWidth - gapWidth);
            const getImageWidthRatio = (index) => equalHeight ? widthWeights[index] / totalWeight : 1 / count;
            const getFallbackImageWidth = (index) => Math.max(1, availableImageWidth * getImageWidthRatio(index));
            const getFallbackBackWidth = (index) => Math.max(1, Math.round(availableBackWidth * getImageWidthRatio(index)));
            const getCellWidth = (index) => {
                const imageWidth = availableImageWidth * getImageWidthRatio(index);
                const columnWidth = imageWidth + (index > 0 ? gapPx : 0);
                return `${((columnWidth / wechatEditorWidth) * 100).toFixed(4).replace(/0+$/, '').replace(/\.$/, '')}%`;
            };
            const colgroup = images.map((_, index) => {
                const cellWidth = getCellWidth(index);
                return `<col style="width: ${cellWidth};">`;
            }).join('');
            const cells = images.map((img, index) => {
                const cellWidth = getCellWidth(index);
                const cellPadding = index > 0 ? `padding: 0 0 0 ${cellGap};` : 'padding: 0;';
                const fallbackImageWidth = `${formatCssNumber(getFallbackImageWidth(index))}px`;
                const fallbackImageStyle = equalHeight
                    // 只锁定按原始宽高比推导出的宽度，height 必须保持 auto，才能等高且绝不拉伸。
                    ? `display: block; width: ${fallbackImageWidth} !important; height: auto !important; visibility: visible !important; margin: 0 !important; padding: 0 !important; ${getImageBackdropStyle(img)}`
                    : `display: block; width: 100% !important; height: auto !important; visibility: visible !important; margin: 0 !important; padding: 0 !important; ${getImageBackdropStyle(img)}`;
                if (img.placeholder) {
                    return `<td data-colwidth="${cellWidth}" width="${cellWidth}" style="width: ${cellWidth}; border: 0; ${cellPadding} vertical-align: top; box-sizing: border-box;">
                        <section style="text-align: center; padding: 18px 4px; background: rgb(245, 245, 245); border: 1px dashed rgb(192, 204, 92); color: rgb(153, 153, 153); font-size: 13px; box-sizing: border-box; overflow: hidden;">【${img.text}】</section>
                    </td>`;
                }
                if (replaceGifWithPlaceholder && isGifImageBlock(img)) {
                    const name = img.displayName || img.filename || img.alt || 'GIF动图';
                    const placeholderSrc = createGifPlaceholderImage(name);
                    const gifAdaptiveAttrs = equalHeight
                        ? `data-backw="${getFallbackBackWidth(index)}" data-backh="${Math.round(getFallbackBackWidth(index) * 0.24444444)}" data-original-style="${fallbackImageStyle}"`
                        : 'data-original-style="width: 100%;height: auto !important;"';
                    return `<td data-colwidth="${cellWidth}" width="${cellWidth}" style="width: ${cellWidth}; border: 0; ${cellPadding} vertical-align: top; font-size: 0; line-height: 0; box-sizing: border-box;">
                        <img data-src="${placeholderSrc}" class="rich_pages wxw-img" width="100%" _width="100%" data-ratio="0.24444444" data-s="300,640" data-type="png" data-w="900" ${gifAdaptiveAttrs} style="${fallbackImageStyle}" src="${placeholderSrc}" alt="GIF待替换：${name}">
                    </td>`;
                }
                const adaptiveAttrs = equalHeight
                    ? getWeChatAdaptiveImageAttrs(img, { backWidth: getFallbackBackWidth(index), originalStyle: fallbackImageStyle })
                    : getWeChatAdaptiveImageAttrs(img);
                return `<td data-colwidth="${cellWidth}" width="${cellWidth}" style="width: ${cellWidth}; border: 0; ${cellPadding} vertical-align: top; font-size: 0; line-height: 0; box-sizing: border-box;">
                    <img data-img-filename="${img.filename}" data-src="${img.dataUrl}" class="rich_pages wxw-img" style="${fallbackImageStyle}" src="${img.dataUrl}" alt="${img.alt}" ${adaptiveAttrs}>
                </td>`;
            }).join('');
            const tableHTML = `<table width="100%" style="width: 100%; max-width: ${wechatEditorWidth}px; table-layout: fixed; border: 0; border-collapse: collapse; border-spacing: 0; margin: 0; padding: 0;"><colgroup>${colgroup}</colgroup><tbody><tr>${cells}</tr></tbody></table>`;
            if (!withPersonalFrame) {
                return tableHTML;
            }
            return `<section class="personal-mode-image-group" style="width: 100% !important; border: 2px dashed rgb(192, 204, 92); padding: 8px; background: #ffffff; box-sizing: border-box; visibility: visible !important; margin: 0;">${tableHTML}</section>`;
        }

        function generateSideBySidePreviewFallbackHTML(images, withPersonalFrame = false) {
            // 预览区不能复用微信导出的固定 677px 表格：当图片尚未上传时，
            // 固定宽度会在宽预览内溢出并让占位框看起来向右偏移。
            // 复制到微信仍走 generateSideBySideImagesHTML，保持已验证的导出效果不变。
            const gap = getSideBySideCellGap(images.length);
            const weights = images.map((image) => {
                const width = Number(image.width) || 0;
                const height = Number(image.height) || 0;
                return width > 0 && height > 0 ? Math.max(0.35, width / height) : 1;
            });
            const cells = images.map((image, index) => {
                const weight = formatCssNumber(weights[index]);
                const cellStyle = `flex: ${weight} 1 0; min-width: 0;`;
                if (image.placeholder) {
                    return `<section style="${cellStyle} height: 64px; min-height: 64px; display: flex; align-items: center; justify-content: center; padding: 8px; background: rgb(245, 245, 245); border: 1px dashed rgb(192, 204, 92); color: rgb(153, 153, 153); font-size: 13px; line-height: 1.4; text-align: center; box-sizing: border-box; overflow: hidden;">【${image.text}】</section>`;
                }
                const imageStyle = 'display: block; width: 100% !important; height: auto !important; margin: 0 !important; padding: 0 !important; visibility: visible !important;';
                return `<section style="${cellStyle} display: flex; align-items: flex-start; min-width: 0;"><img data-img-filename="${image.filename}" data-src="${image.dataUrl}" class="rich_pages wxw-img" style="${imageStyle}" src="${image.dataUrl}" alt="${image.alt || image.displayName || ''}"></section>`;
            }).join('');
            const layout = `<section style="display: flex; align-items: flex-start; width: 100%; gap: ${gap}px; margin: 0; padding: 0; box-sizing: border-box;">${cells}</section>`;
            return withPersonalFrame
                ? `<section class="personal-mode-image-group" style="width: 100% !important; border: 2px dashed rgb(192, 204, 92); padding: 8px; background: #ffffff; box-sizing: border-box; visibility: visible !important; margin: 0;">${layout}</section>`
                : layout;
        }

        function generateSideBySidePreviewHTML(images, withPersonalFrame = false) {
            if (images.some((image) => image.placeholder || isGifImageBlock(image))) {
                return generateSideBySidePreviewFallbackHTML(images, withPersonalFrame);
            }
            const record = sideBySideBackdropRecords[getSideBySideBackdropKey(images)];
            const dataUrl = record?.backdropDataUrl || record?.rawDataUrl;
            if (!record || !dataUrl) return generateSideBySidePreviewFallbackHTML(images, withPersonalFrame);
            const width = record.backdropWidth || record.rawWidth;
            const height = record.backdropHeight || record.rawHeight;
            const ratio = width && height ? (height / width).toFixed(8).replace(/0+$/, '').replace(/\.$/, '') : '1';
            const style = 'width: 100% !important; height: auto !important; visibility: visible !important;';
            const imageHTML = `<img data-img-filename="${record.filename}" data-backdrop-context="side-by-side" data-src="${dataUrl}" class="rich_pages wxw-img" style="${style}" src="${dataUrl}" alt="并排图片" data-ratio="${ratio}" data-type="png" data-w="${width}" data-backw="578" data-backh="${Math.round(578 * Number(ratio))}" data-original-style="width:100%;height:auto !important;">`;
            const wrapped = `<section style="text-align: center; margin: 0; padding: 0;">${imageHTML}</section>`;
            return withPersonalFrame
                ? `<section class="personal-mode-image-group" style="width: 100% !important; border: 2px dashed rgb(192, 204, 92); padding: 8px; background: #ffffff; box-sizing: border-box; visibility: visible !important; margin: 0;">${wrapped}</section>`
                : wrapped;
        }

                qrBackh = matchedImg.width && matchedImg.height ? Math.round((matchedImg.height / matchedImg.width) * 578) : 228;

            const qrSection = `<section style="text-align: center;margin-top: 0;margin-right: 0%;margin-left: 0%;box-sizing: border-box;">

        function processInlineFormatting(text, skipWrapper = false, styleNotes = false) {
            let processed = text || '';
            const inlineCodeTokens = [];
            const priceTokens = [];

            // 先保护行内代码（反引号 ` ` 包裹的内容），避免内部内容被自动加空格等规则改写
            processed = processed.replace(/`([^`\n]+)`/g, (match, content) => {
                const token = `%%INLINE_CODE_${inlineCodeTokens.length}%%`;
                inlineCodeTokens.push(
                    `<code style="font-family: Menlo, &quot;Operator Mono&quot;, monospace; background-color: rgb(243, 243, 243); padding: 2px 5px; border-radius: 3px; font-size: 0.85em; color: rgb(232, 62, 140); visibility: visible;"><span leaf="" style="visibility: visible;">${escapeHtml(content)}</span></code>`
                );
                return token;
            });

            // 中英文混排加空格、中文引号转换
            processed = processTextSpacing(processed);
            processed = protectAutoPriceStyles(processed, priceTokens);
            if (styleNotes) {
                processed = styleParentheticalNotes(processed);
            }
            
            // 先处理组合格式 ==**...**== 和 **==...==**（避免被后面的空格处理破坏）
            processed = processed.replace(/==\*\*(.+?)\*\*==/g, (match, content) => {
                if (isPersonalMode) {
                    return `<em style="letter-spacing: normal; background: linear-gradient(transparent 50%, rgb(255, 242, 168) 0px); padding: 0px 2px; color: rgb(51, 51, 51); font-style: normal !important;"><span leaf="" style="font-weight: bold; color: rgb(0, 0, 0);">${content}</span></em>`;
                }
                return `<span textstyle="" style="letter-spacing: normal; color: rgb(51, 173, 255); font-weight: bold;">${content}</span>`;
            });
            processed = processed.replace(/\*\*==(.+?)==\*\*/g, (match, content) => {
                if (isPersonalMode) {
                    return `<em style="letter-spacing: normal; background: linear-gradient(transparent 50%, rgb(255, 242, 168) 0px); padding: 0px 2px; color: rgb(51, 51, 51); font-style: normal !important;"><span leaf="" style="font-weight: bold; color: rgb(0, 0, 0);">${content}</span></em>`;
                }
                return `<span textstyle="" style="letter-spacing: normal; color: rgb(51, 173, 255); font-weight: bold;">${content}</span>`;
            });
            
            // 处理 ==：如果一边是中文，另一边是数字/英文，就在==右侧加空格
            processed = processed.replace(/([\u4e00-\u9fa5\d_a-zA-Z]?)==([\u4e00-\u9fa5\d_a-zA-Z]?)/g, (match, left, right) => {
                const isLeftCN = /[\u4e00-\u9fa5]/.test(left);
                const isLeftEN = /[\d_a-zA-Z]/.test(left);
                const isRightCN = /[\u4e00-\u9fa5]/.test(right);
                const isRightEN = /[\d_a-zA-Z]/.test(right);
                
                // 一边是中文，另一边是数字/英文 → 加空格
                if ((isLeftEN && isRightCN) || (isLeftCN && isRightEN)) {
                    return left + '== ' + right;
                }
                return match;
            });
            
            // 处理 ==文本== - 高亮/标蓝
            processed = processed.replace(/==([^=]+)==/g, (match, content) => {
                const fontWeight = isYuanPriceText(content) ? ' font-weight: bold;' : '';
                if (isPersonalMode) {
                    return `<em style="letter-spacing: normal; background: linear-gradient(transparent 50%, rgb(255, 242, 168) 0px); padding: 0px 2px; color: rgb(51, 51, 51); font-style: normal !important;"><span leaf="" style="color: rgb(0, 0, 0);${fontWeight}">${content}</span></em>`;
                }
                return `<span textstyle="" style="letter-spacing: normal; color: rgb(51, 173, 255);${fontWeight}">${content}</span>`;
            });
            
            // 处理 **文本** - 加粗
            if (isPersonalMode) {
                // 个人模式：仅加粗
                processed = processed.replace(/\*\*(.+?)\*\*/g, (match, content) => {
                    return `<span textstyle="" style="letter-spacing: normal; font-weight: bold; color: rgb(0, 0, 0);">${content}</span>`;
                });
            } else {
                // 默认模式：仅加粗
                processed = processed.replace(/\*\*(.+?)\*\*/g, (match, content) => {
                    return `<span textstyle="" style="letter-spacing: normal; font-weight: bold;">${content}</span>`;
                });
            }
            // 恢复自动价格样式
            processed = processed.replace(/%%AUTO_PRICE_(\d+)%%/g, (match, index) => {
                return priceTokens[Number(index)] || match;
            });
            processed = applyInlineHtmlBoundarySpacing(processed);

            // 恢复行内代码原文
            processed = processed.replace(/%%INLINE_CODE_(\d+)%%/g, (match, index) => {
                return inlineCodeTokens[Number(index)] || match;
            });
            
            // 基础span包装
            if (!skipWrapper && !processed.includes('textstyle=""') && processed) {
                processed = `<span textstyle="" style="letter-spacing: normal;">${processed}</span>`;
            }
            return processed;
        }

        /* ==================== Markdown 解析与渲染 ==================== */
        
        /**
         * 处理标题中的平台标签 [xxx]，将其设置为 15px 黑色
         * @param {string} content - 标题内容
         * @returns {string} 处理后的HTML
         */
        function processPlatformTags(content) {
            // 先用 processInlineFormatting 处理加粗、标蓝等
            let processed = processInlineFormatting(content, true).trim();
            // 平台标签：15px 黑色
            processed = processed.replace(/\[([^\]]+)\]/g, '<span style="font-size: 15px; color: rgb(0, 0, 0);">[$1]</span>');
            return processed;
        }

        function shouldSkipSpacingBetweenBlocks(prevBlock, block) {
            return block.type === 'caption-note'
                && ['referenced-image', 'side-by-side-images', 'image-placeholder'].includes(prevBlock.type);
        }

        function appendRenderedContentBlocks(contentBlocks, renderBlock, spacing) {
            let html = '';
            contentBlocks.forEach((block, index) => {
                let blockHTML = renderBlock(block);
                if (!blockHTML) return;

                if (index > 0) {
                    const prevBlock = contentBlocks[index - 1];
                    if (shouldSkipSpacingBetweenBlocks(prevBlock, block)) {
                        // 图片和说明文本之间不加空行
                    } else if ((block.type === 'h1' || block.type === 'h2') && !isPersonalMode) {
                        html += spacing.doubleBr;
                    } else {
                        html += spacing.singleBr;
                    }
                }

                if (spacing.addScrollAnchors) {
                    blockHTML = blockHTML.replace(
                        /^(\s*<[a-zA-Z][\w:-]*)/,
                        `$1 data-scroll-block-index="${index}"`
                    );
                }
                html += blockHTML;
            });
            return html;
        }

        function getListItemMatch(trimmedLine) {
            const unorderedMatch = trimmedLine.match(/^[-*]\s+(.+)$/);
            if (unorderedMatch) {
                return { type: 'ul', content: unorderedMatch[1].trim() };
            }

            const orderedMatch = trimmedLine.match(/^\d+(?:[.)]\s+|[、）]\s*)(.+)$/);
            if (orderedMatch) {
                return { type: 'ol', content: orderedMatch[1].trim() };
            }

            return null;
        }

        function formatListItemContent(item) {
            const text = String(item || '');
            const colonIndex = text.search(/[:：]/);
            if (colonIndex <= 0) {
                return processInlineFormatting(text, true, true);
            }

            const label = text.slice(0, colonIndex + 1);
            const rest = text.slice(colonIndex + 1);
            // URL 协议本身包含冒号，不能把 https: 误当作列表标签。
            if (/^[a-z][a-z0-9+.-]*:\/\//i.test(text)) {
                return processInlineFormatting(text, true, true);
            }

            const formattedLabel = processInlineFormatting(label, true, true);
            const formattedRest = processInlineFormatting(rest, true, true);
            return `<span textstyle="" style="letter-spacing: normal; font-weight: bold;">${formattedLabel}</span>${formattedRest}`;
        }

        function renderListBlockHTML(block, includePreviewId = false) {
            const itemCount = block.content.length;
            const tagName = block.type === 'ol' ? 'ol' : 'ul';
            const listStyleType = block.type === 'ol' ? 'decimal' : 'disc';
            const listFontFamily = "mp-quote, 'PingFang SC', -apple-system-font, BlinkMacSystemFont, 'Helvetica Neue', 'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', Arial, sans-serif";
            const bodyStyle = getBodyTypographyStyle();
            const idAttr = includePreviewId ? ' id="wechat-list"' : '';
            let listHTML = `<${tagName} style="list-style-type: ${listStyleType}; padding-left: 20px !important; margin: 10px ${typographySettings.marginX}px 10px 0 !important; box-sizing: border-box;" class="list-paddingleft-1"${idAttr}>`;
            block.content.forEach((item, index) => {
                const punct = hasTerminalPunctuation(item) ? '' : ((index === itemCount - 1) ? '。' : '；');
                listHTML += `<li style="list-style-type: ${listStyleType}; margin-bottom: 6px !important; color: ${bodyStyle.color};"><p style="margin: 0px; padding: 0px; box-sizing: border-box; text-align: ${bodyStyle.textAlign}; ${bodyStyle.textJustify} line-height: ${bodyStyle.lineHeight}; font-family: ${listFontFamily}; font-size: ${bodyStyle.fontSize}; letter-spacing: ${bodyStyle.letterSpacing}; color: ${bodyStyle.color};">
                        ${formatListItemContent(item)}${punct}
                </p></li>`;
            });
            listHTML += `</${tagName}>`;
            return listHTML;
        }

        function splitMarkdownTableRow(line) {
            let text = String(line || '').trim();
            if (text.startsWith('|')) text = text.slice(1);
            if (text.endsWith('|')) text = text.slice(0, -1);

            const cells = [];
            let current = '';
            let escaped = false;
            for (const char of text) {
                if (escaped) {
                    current += char;
                    escaped = false;
                    continue;
                }
                if (char === '\\') {
                    escaped = true;
                    continue;
                }
                if (char === '|') {
                    cells.push(current.trim());
                    current = '';
                    continue;
                }
                current += char;
            }
            cells.push(current.trim());
            return cells;
        }

        function parseMarkdownTableAlignments(separatorLine) {
            const cells = splitMarkdownTableRow(separatorLine);
            const alignments = cells.map((cell) => {
                const normalized = cell.replace(/\s+/g, '');
                if (!/^:?-{3,}:?$/.test(normalized)) return null;
                if (normalized.startsWith(':') && normalized.endsWith(':')) return 'center';
                if (normalized.endsWith(':')) return 'right';
                return 'left';
            });
            return alignments.every(Boolean) ? alignments : null;
        }

        function isMarkdownTableStart(rawLines, index) {
            if (index + 1 >= rawLines.length) return false;
            const headerLine = String(rawLines[index] || '').trim();
            const separatorLine = String(rawLines[index + 1] || '').trim();
            if (!headerLine.includes('|') || !separatorLine.includes('|')) return false;
            const headerCells = splitMarkdownTableRow(headerLine);
            const alignments = parseMarkdownTableAlignments(separatorLine);
            return Boolean(alignments && headerCells.length >= 2 && alignments.length >= 2);
        }

        function parseMarkdownTableBlock(rawLines, startIndex) {
            const headers = splitMarkdownTableRow(rawLines[startIndex]);
            const alignments = parseMarkdownTableAlignments(rawLines[startIndex + 1]) || [];
            const columnCount = Math.max(headers.length, alignments.length);
            const rows = [];
            let index = startIndex + 2;

            while (index < rawLines.length) {
                const line = String(rawLines[index] || '').trim();
                if (!line || !line.includes('|') || parseMarkdownTableAlignments(line)) break;
                rows.push(splitMarkdownTableRow(line));
                index++;
            }

            return {
                block: {
                    type: 'markdown-table',
                    headers,
                    alignments,
                    rows,
                    columnCount
                },
                nextIndex: index
            };
        }

        function normalizeTableCell(cells, index) {
            return typeof cells[index] === 'string' ? cells[index] : '';
        }

        function renderMarkdownTableHTML(block) {
            const bodyStyle = getBodyTypographyStyle();
            const fontFamily = isPersonalMode ? "Optima, PingFangSC-light, 'PingFang SC', Georgia, serif" : "mp-quote, 'PingFang SC', -apple-system-font, BlinkMacSystemFont, 'Helvetica Neue', 'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', Arial, sans-serif";
            const borderColor = isPersonalMode ? 'rgb(192, 204, 92)' : 'rgb(226, 232, 240)';
            const headerBg = isPersonalMode ? 'rgb(247, 250, 232)' : 'rgb(247, 249, 252)';
            const textColor = bodyStyle.color || 'rgb(34, 34, 34)';
            const columnCount = Math.max(1, Number(block.columnCount) || block.headers.length || 1);
            const colWidth = `${formatCssNumber(100 / columnCount, 4)}%`;
            const tableTextAlign = typographySettings.tableAlign === 'left' ? 'left' : 'center';

            const renderCell = (content, index, tagName) => {
                const isHeader = tagName === 'th';
                const background = isHeader ? `background-color: ${headerBg};` : 'background-color: rgb(255, 255, 255);';
                const fontWeight = isHeader ? 'font-weight: bold;' : 'font-weight: normal;';
                const cellContent = processInlineFormatting(content || '&nbsp;', true, true);
                return `<${tagName} width="${colWidth}" style="width: ${colWidth}; border: 1px solid ${borderColor}; padding: 8px 10px; ${background} ${fontWeight} text-align: ${tableTextAlign}; vertical-align: top; box-sizing: border-box; color: ${textColor}; font-family: ${fontFamily}; font-size: ${bodyStyle.fontSize}; line-height: 1.6; letter-spacing: ${bodyStyle.letterSpacing}; word-break: break-word; overflow-wrap: break-word;">${cellContent}</${tagName}>`;
            };

            const headerHTML = Array.from({ length: columnCount }, (_, index) => renderCell(normalizeTableCell(block.headers, index), index, 'th')).join('');
            const bodyHTML = block.rows.map((row) => {
                const cells = Array.from({ length: columnCount }, (_, index) => renderCell(normalizeTableCell(row, index), index, 'td')).join('');
                return `<tr>${cells}</tr>`;
            }).join('');

            return `<section style="margin: 10px ${typographySettings.marginX}px 10px 0; padding: 0; overflow-x: auto; -webkit-overflow-scrolling: touch;">
                <table width="100%" style="width: 100%; border-collapse: collapse; table-layout: fixed; margin: 0; padding: 0; border: 1px solid ${borderColor}; box-sizing: border-box;">
                    <thead><tr>${headerHTML}</tr></thead>
                    <tbody>${bodyHTML}</tbody>
                </table>
            </section>`;
        }
        
        /**
         * Markdown转微信预览HTML
         * @param {string} markdown - Markdown文本
         * @returns {string} 微信样式的HTML
         */
        function markdownToWeChatHTML(markdown, includeFixedContent = true) {
            let rawLines = markdown.split('\n');
            let contentBlocks = [];
            let inList = false;
            let currentList = [];
            let currentListType = 'ul';
            let i = 0;
            
            // 获取当前模式对应的空行HTML
            const { singleBr, doubleBr } = getBrHtml(isPersonalMode);
            
            // 第一步：解析内容块
            while (i < rawLines.length) {
                const line = rawLines[i];
                const trimmedLine = line.trim();

                // 代码块（```语言 开始，``` 结束）
                const codeBlockOpen = trimmedLine.match(/^```(\w*)$/);
                if (codeBlockOpen) {
                    if (inList) {
                        contentBlocks.push({ type: currentListType, content: currentList });
                        inList = false;
                        currentList = [];
                        currentListType = 'ul';
                    }
                    const lang = codeBlockOpen[1] || '';
                    const codeLines = [];
                    i++;
                    while (i < rawLines.length) {
                        if (rawLines[i].trim() === '```') { i++; break; }
                        codeLines.push(rawLines[i]);
                        i++;
                    }
                    contentBlocks.push({ type: 'code-block', language: lang, code: codeLines.join('\n') });
                    continue;
                }

                // 多行灰色底框开始（以 ` 开头但不以 ` 结尾）
                if (trimmedLine.startsWith('`') && !trimmedLine.endsWith('`')) {
                    // 如果正在处理列表，先结束列表
                    if (inList) {
                        contentBlocks.push({
                            type: currentListType,
                            content: currentList
                        });
                        inList = false;
                        currentList = [];
                        currentListType = 'ul';
                    }
                    let boxLines = [];

                    // 收集开始行
                    boxLines.push(trimmedLine.slice(1).trim());
                    i++;

                    // 收集中间行
                    while (i < rawLines.length) {
                        const nextLine = rawLines[i].trim();
                        if (nextLine.endsWith('`')) {
                            boxLines.push(nextLine.slice(0, -1).trim());
                            i++;
                            break;
                        } else {
                            boxLines.push(nextLine);
                            i++;
                        }
                    }
                    
                    contentBlocks.push({
                        type: 'box',
                        content: boxLines.join('\n')
                    });
                    continue;
                }



                // 单行灰色底框
                if (trimmedLine.startsWith('`') && trimmedLine.endsWith('`')) {
                    // 如果正在处理列表，先结束列表
                    if (inList) {
                        contentBlocks.push({
                            type: currentListType,
                            content: currentList
                        });
                        inList = false;
                        currentList = [];
                        currentListType = 'ul';
                    }
                    // 保留反引号标记，让渲染时的 processInlineFormatting 能正确处理斜杠保护
                    contentBlocks.push({
                        type: 'box',
                        content: trimmedLine
                    });
                    i++;
                    continue;
                }

                // 大标题 (## )
                if (trimmedLine.startsWith('## ') && !trimmedLine.startsWith('### ')) {
                    // 如果正在处理列表，先结束列表
                    if (inList) {
                        contentBlocks.push({
                            type: currentListType,
                            content: currentList
                        });
                        inList = false;
                        currentList = [];
                        currentListType = 'ul';
                    }
                    contentBlocks.push({
                        type: 'h1',
                        content: trimmedLine.substring(3)
                    });
                    i++;
                    continue;
                }

                // 小标题 (### )
                if (trimmedLine.startsWith('### ')) {
                    // 如果正在处理列表，先结束列表
                    if (inList) {
                        contentBlocks.push({
                            type: currentListType,
                            content: currentList
                        });
                        inList = false;
                        currentList = [];
                        currentListType = 'ul';
                    }
                    contentBlocks.push({
                        type: 'h2',
                        content: trimmedLine.substring(4)
                    });
                    i++;
                    continue;
                }

                // Markdown 表格：表头行 + 分隔行
                if (isMarkdownTableStart(rawLines, i)) {
                    if (inList) {
                        contentBlocks.push({
                            type: currentListType,
                            content: currentList
                        });
                        inList = false;
                        currentList = [];
                        currentListType = 'ul';
                    }
                    const tableResult = parseMarkdownTableBlock(rawLines, i);
                    contentBlocks.push(tableResult.block);
                    i = tableResult.nextIndex;
                    continue;
                }

                // 分隔线（>=3个连续短横线）
                if (/^-{3,}$/.test(trimmedLine)) {
                    // 如果正在处理列表，先结束列表
                    if (inList) {
                        contentBlocks.push({
                            type: currentListType,
                            content: currentList
                        });
                        inList = false;
                        currentList = [];
                        currentListType = 'ul';
                    }
                    contentBlocks.push({
                        type: 'divider'
                    });
                    i++;
                    continue;
                }

                // 列表项：支持无序列表（- / *）和有序列表（1. / 1、/ 1)）
                const listItem = getListItemMatch(trimmedLine);
                if (listItem) {
                    if (!inList || currentListType !== listItem.type) {
                        if (inList) {
                            contentBlocks.push({
                                type: currentListType,
                                content: currentList
                            });
                        }
                        inList = true;
                        currentList = [];
                        currentListType = listItem.type;
                    }
                    currentList.push(listItem.content);
                    i++;
                    continue;
                }

                // 列表中的空行：跳过，但不结束当前列表
                if (inList && !trimmedLine) {
                    i++;
                    continue;
                }

                // 结束列表
                if (inList) {
                    contentBlocks.push({
                        type: currentListType,
                        content: currentList
                    });
                    inList = false;
                    currentList = [];
                    currentListType = 'ul';
                    // 不 continue，让当前行继续被其他块类型处理
                }

                // 普通段落
                if (trimmedLine) {
                    // 检测活动卡片：二维码卡片 + 渐变小长条 + 淘口令
                    const activityCardMatch = trimmedLine.match(/^活动卡片：(.*)$/);
                    if (activityCardMatch) {
                        const activitySpec = parseActivityCardSpec(activityCardMatch[1]);
                        contentBlocks.push({
                            type: 'activity-card',
                            ...activitySpec
                        });
                        i++;
                        continue;
                    }

                    // 检测商品小卡片：仅保留二维码卡片
                    const compactProductCardMatch = trimmedLine.match(/^商品小卡片：(.*)$/);
                    if (compactProductCardMatch) {
                        const productName = normalizeProductImageName(compactProductCardMatch[1]);
                        contentBlocks.push({
                            type: 'product-card',
                            productName: productName,
                            compact: true
                        });
                        i++;
                        continue;
                    }

                    // 检测商品卡片
                    const productCardMatch = trimmedLine.match(/^商品卡片：(.*)$/);
                    if (productCardMatch) {
                        let productName = productCardMatch[1];
                        
                        // 提取淘口令
                        const taoMatch = productName.match(/(77《[^》]+》.*?)(\s+https?:\/\/s\.tb\.cn\/)?$/);
                        if (taoMatch && taoMatch[1]) {
                            currentTaoKouLing = taoMatch[1].trim();
                        }
                        
                        // 去掉图片扩展名和【】用于匹配
                        productName = normalizeProductImageName(productName);
                        
                        contentBlocks.push({
                            type: 'product-card',
                            productName: productName
                        });
                        i++;
                        continue;
                    }

                    // 检测特殊图片语法：不可选中：【图1】、无缝拼接：【图1】｜【图2】｜……
                    const specialImageSyntax = parseSpecialImageSyntax(trimmedLine);
                    if (specialImageSyntax) {
                        if (specialImageSyntax.mode === 'seamless') {
                            const images = specialImageSyntax.refs.map((refText) => {
                                const matched = findImageByReference(refText);
                                if (!matched) return { placeholder: true, text: refText };
                                incrementImageUseCount(matched.filename);
                                return {
                                    filename: matched.filename, dataUrl: matched.dataUrl,
                                    width: matched.width, height: matched.height,
                                    mimeType: matched.mimeType, displayName: matched.displayName, alt: refText
                                };
                            });
                            contentBlocks.push({ type: 'seamless-images', images });
                        } else {
                            const matchedImg = findImageByReference(specialImageSyntax.refText);
                            if (matchedImg) {
                                let caption = null;
                                if (i + 1 < rawLines.length) {
                                    const nextLine = rawLines[i + 1].trim();
                                    const captionMatch = nextLine.match(/^｜｜(.+)｜｜$/);
                                    if (captionMatch) {
                                        caption = captionMatch[1].trim();
                                        i++;
                                    }
                                }
                                contentBlocks.push(buildReferencedImageBlock(matchedImg, specialImageSyntax.refText, {
                                    caption,
                                    specialMode: specialImageSyntax.mode
                                }));
                                incrementImageUseCount(matchedImg.filename);
                            } else {
                                contentBlocks.push({
                                    type: 'image-placeholder',
                                    text: `${specialImageSyntax.label}：${specialImageSyntax.refText}`
                                });
                            }
                        }
                        i++;
                        continue;
                    }

                    // 检测并排图片：【图1】|【图2】 或 【图1】｜【图2】｜【图3】
                    const sideBySideMatch = trimmedLine.match(/^【([^【】]+)】\s*[|｜]\s*【([^【】]+)】(?:\s*[|｜]\s*【([^【】]+)】)?$/);
                    if (sideBySideMatch) {
                        const images = [];
                        for (let j = 1; j <= 3; j++) {
                            if (!sideBySideMatch[j]) continue;
                            const refText = sideBySideMatch[j].trim();
                            const matched = findImageByReference(refText);
                            if (matched) {
                                images.push({
                                    filename: matched.filename, dataUrl: matched.dataUrl,
                                    width: matched.width, height: matched.height,
                                    mimeType: matched.mimeType, displayName: matched.displayName, alt: refText
                                });
                                incrementImageUseCount(matched.filename);
                            } else {
                                images.push({ placeholder: true, text: refText });
                            }
                        }
                        contentBlocks.push({ type: 'side-by-side-images', images });
                        i++;
                        continue;
                    }

                    // 检测【图1】、【动图演示】等图片引用
                    const imageRefMatch = trimmedLine.match(/^【([^【】]+)】$/);
                    if (imageRefMatch) {
                        const refText = imageRefMatch[1].trim();
                        const matchedImg = findImageByReference(refText);
                        if (matchedImg) {
                            // 检查下一行是否是图片标注
                            let caption = null;
                            if (i + 1 < rawLines.length) {
                                const nextLine = rawLines[i + 1].trim();
                                const captionMatch = nextLine.match(/^｜｜(.+)｜｜$/);
                                if (captionMatch) {
                                    caption = captionMatch[1].trim();
                                    i++; // 跳过标注行
                                }
                            }
                            contentBlocks.push({
                                ...buildReferencedImageBlock(matchedImg, refText, { caption })
                            });
                            incrementImageUseCount(matchedImg.filename);
                        } else {
                            contentBlocks.push({
                                type: 'image-placeholder',
                                text: refText
                            });
                        }
                        i++;
                        continue;
                    }
                    
                    // 检测图片标注语法：｜｜文字｜｜（独立一行，作为前一个图片的标注）
                    const imageCaptionMatch = trimmedLine.match(/^｜｜(.+)｜｜$/);
                    if (imageCaptionMatch) {
                        contentBlocks.push({
                            type: 'image-caption',
                            caption: imageCaptionMatch[1].trim()
                        });
                        i++;
                        continue;
                    }
                    
                    // 检测说明文本：▲ 开头（与上方图片紧接，无空行）
                    if (trimmedLine.startsWith('▲ ')) {
                        contentBlocks.push({
                            type: 'caption-note',
                            content: trimmedLine
                        });
                        i++;
                        continue;
                    }
                    
                    contentBlocks.push({
                        type: 'p',
                        content: trimmedLine
                    });
                }
                i++;
            }

            // 处理最后一个列表
            if (inList) {
                contentBlocks.push({
                    type: currentListType,
                    content: currentList
                });
            }

            // 统计一级标题数量
            let h1Counter = 0;
            
            // 第二步：生成块HTML
            function generateBlockHTML(block) {
                switch (block.type) {
                    case 'code-block': {
                        return generateCodeBlockHTML(block.language, block.code);
                    }
                    case 'caption-note': {
                        return `<p style="margin: 0; padding: 0; text-align: center;"><span style="font-size: 12px; color: rgb(136, 136, 136);">${block.content}</span></p>`;
                    }
                    case 'h1': {
                        h1Counter++;
                        
                        // 个人模式：使用虚线样式（只有上下边框）
                        if (isPersonalMode) {
                            // 处理平台标签 [xxx]，使其为 15px 黑色
                            let titleContent = processPlatformTags(block.content);

                            return `<section class="level1-title-dashed personal-mode" style="box-sizing: border-box;font-size: 16px;margin: 20px 0px 20px;float: none !important;padding: 12px 0px;background: transparent;text-align: center;">
                                <section style="display: inline-block;font-weight: 900;color: rgb(43, 43, 43);letter-spacing: 2px;border: none;visibility: visible;text-align: center;box-sizing: border-box;font-size: 20px;border-top: 1.5px dashed rgb(192, 204, 92);border-bottom: 1.5px dashed rgb(192, 204, 92);padding: 8px 20px;min-width: 100px;">
                                    <span leaf="" style="visibility: visible;">${titleContent}</span>
                                </section>
                            </section>`;
                        }
                        
                        // 数码荔枝模式：使用图片
                        const imgIndex = (h1Counter - 1) % titleImages.length;
                        const imgUrl = titleImages[imgIndex];

                        // 处理平台标签 [xxx]，使其为 15px 黑色
                        let titleContent = processPlatformTags(block.content);

                        return `<div class="level1-title">
                            <img src="${imgUrl}" width="50" height="50" alt="标题图标" style="margin-right: 8px;float: none;">
                            <span class="title-text">${titleContent}</span>
                        </div>`;
                    }
                    case 'h2': {
                        // 个人模式小标题：带底色的小标题
                        if (isPersonalMode) {
                            return `<div class="level2-title" style="text-align: center; margin: 20px 0 15px 0;">
                                <section style="display: inline-block; max-width: 92%; padding: 8px 24px; background: linear-gradient(135deg, #c0d860 0%, #9ab94a 100%); color: white; border-radius: 4px; box-sizing: border-box;">
                                    <p style="margin: 0; color: white; font-size: 17px; line-height: 1.8; font-weight: bold; letter-spacing: 2px; text-align: center; word-break: normal; overflow-wrap: break-word;">
                                        ${processInlineFormatting(block.content, true).trim()}
                                    </p>
                                </section>
                            </div>`;
                        }
                        return `<div class="level2-title">
                            <div class="title-box">
                                <div class="title-box-inner">
                                    <div class="title-text">${processInlineFormatting(block.content, true).trim()}</div>
                                </div>
                            </div>
                        </div>`;
                    }
                    case 'product-card': {
                        return generateProductCardHTML(block);
                    }
                    case 'activity-card': {
                        return generateActivityCardHTML(block);
                    }
                    case 'markdown-table': {
                        return renderMarkdownTableHTML(block);
                    }
                    case 'referenced-image': {
                        return generateReferencedImageHTML(block);
                    }
                    case 'seamless-images': {
                        return generateSeamlessImagesHTML(block.images, false);
                    }
                    case 'side-by-side-images': {
                        return generateSideBySidePreviewHTML(block.images, isPersonalMode);
                    }
                    case 'image-placeholder': {
                        return `<div style="text-align: center; padding: 20px; background: #f5f5f5; border: 1px dashed rgb(192, 204, 92); margin: 10px 0; color: #999; font-size: 14px;">
                            【${block.text}】<span style="color: #e74c3c;">（未找到匹配图片）</span>
                        </div>`;
                    }
                    case 'box': {
                        let innerContent = block.content;
                        const lines = innerContent.split('\n');
                        let boxHTML = '<div class="link-box">';

                        // 检查第一行是否是反引号包裹的内联代码格式
                        const inlineCodePattern = /^`([^`]+)`$/;
                        let hasInlineCode = false;
                        let inlineCodeContent = '';

                        if (lines.length === 1) {
                            const match = lines[0].match(inlineCodePattern);
                            if (match) {
                                hasInlineCode = true;
                                inlineCodeContent = match[1];
                            }
                        }

                        // 查找第一行的标签和后续行的URL
                        let label = '';
                        let url = '';
                        let hasUrlInFirstLine = false;
                        let hasLabelWithPath = false;
                        let labelPathContent = '';

                        // 检查第一行是否有标签和URL在同一行
                        const linkReg = /^(.*?)[:：]\s*(http|https):\/\/\S+/;
                        // 检查标签+路径格式（无协议，如：开源地址：github.com/foo/bar）
                        const labelPathReg = /^(.*?)[:：]\s*([^\s]+)$/;
                        const readMoreReg = /阅读原文/;

                        if (lines[0].match(linkReg)) {
                            hasUrlInFirstLine = true;
                            const match = lines[0].match(linkReg);
                            label = match[1].trim();
                            const fullUrl = match[0];
                            url = fullUrl.replace(`${label}：`, '').replace(`${label}:`, '').trim();
                        } else if (!hasInlineCode) {
                            // 检查是否是标签+路径格式（无协议）
                            const labelPathMatch = lines[0].match(labelPathReg);
                            if (labelPathMatch) {
                                const possibleLabel = labelPathMatch[1].trim();
                                const possiblePath = labelPathMatch[2];
                                if (possibleLabel && possiblePath && possiblePath.includes('/')) {
                                    hasLabelWithPath = true;
                                    label = possibleLabel;
                                    labelPathContent = possiblePath;
                                }
                            }
                        }

                        // 查找URL（可能在任意一行）
                        const urlReg = /(http|https):\/\/\S+/;
                        for (let j = 0; j < lines.length; j++) {
                            const urlMatch = lines[j].match(urlReg);
                            if (urlMatch) {
                                url = urlMatch[0];
                                break;
                            }
                        }

                        // 生成内容HTML
                        lines.forEach((line, index) => {
                            let trimmedLine = line.trim();

                            // 如果是反引号包裹的内联代码格式
                            if (hasInlineCode && index === 0) {
                                // 检查内容是否包含带协议的 URL（标签：https://xxx）
                                const urlMatch = inlineCodeContent.match(/^(.*?)[:：]\s*(https?:\/\/\S+)$/);
                                if (urlMatch) {
                                    // 有标签+URL（带协议）：加粗标签，URL 不处理
                                    const label = urlMatch[1].trim();
                                    const url = urlMatch[2];
                                    // 排除 http/https 开头的情况（这种情况没有标签）
                                    if (label === 'http' || label === 'https') {
                                        boxHTML += `<a href="${url}" target="_blank">${url}</a>`;
                                    } else {
                                        const colonMatch = inlineCodeContent.match(/[:：]/);
                                        const originalColon = colonMatch ? colonMatch[0] : ':';
                                        boxHTML += `<span textstyle="" style="letter-spacing: normal; font-weight: bold;">${label}${originalColon}</span>${url}`;
                                    }
                                } else {
                                    // 检查是否有标签+路径格式（标签：xxx/xxx）
                                    const labelPathMatch = inlineCodeContent.match(/^(.*?)[:：]\s*([^\s]+)$/);
                                    if (labelPathMatch) {
                                        const label = labelPathMatch[1].trim();
                                        const path = labelPathMatch[2];
                                        // 排除 http/https 开头的情况（这是纯 URL，没有标签）
                                        if (label === 'http' || label === 'https') {
                                            let protected = inlineCodeContent
                                                .replace(/\//g, '__PROTECTED_SLASH__');
                                            protected = protected
                                                .replace(REGEX_PATTERNS.cnEnBefore, '$1 $2')
                                                .replace(REGEX_PATTERNS.enCnBefore, '$1 $2')
                                                .replace(REGEX_PATTERNS.multiSpace, ' ');
                                            protected = protected
                                                .replace(/__PROTECTED_SLASH__/g, '/');
                                            boxHTML += protected;
                                        } else {
                                            const colonMatch = inlineCodeContent.match(/[:：]/);
                                            const originalColon = colonMatch ? colonMatch[0] : ':';
                                            // 如果路径包含斜杠，说明是路径，需要保护斜杠
                                            if (path.includes('/')) {
                                                boxHTML += `<span textstyle="" style="letter-spacing: normal; font-weight: bold;">${label}${originalColon}</span>${path}`;
                                            } else {
                                                boxHTML += `<span textstyle="" style="letter-spacing: normal; font-weight: bold;">${label}${originalColon}</span>${path}`;
                                            }
                                        }
                                    } else {
                                        // 纯内容（无标签）：保护斜杠
                                        let protected = inlineCodeContent
                                            .replace(/\//g, '__PROTECTED_SLASH__');
                                        protected = protected
                                            .replace(REGEX_PATTERNS.cnEnBefore, '$1 $2')
                                            .replace(REGEX_PATTERNS.enCnBefore, '$1 $2')
                                            .replace(REGEX_PATTERNS.multiSpace, ' ');
                                        protected = protected
                                            .replace(/__PROTECTED_SLASH__/g, '/');
                                        boxHTML += protected;
                                    }
                                }
                                return;
                            }

                            if (index === 0) {
                                if (hasUrlInFirstLine) {
                                    // 第一行有完整标签+URL（带协议）
                                    const match = trimmedLine.match(linkReg);
                                    label = match[1].trim();
                                    url = match[0].replace(`${label}：`, '').replace(`${label}:`, '').trim();
                                    // 排除空标签或 http/https 开头的情况（这种情况没有标签）
                                    if (!label || label === 'http' || label === 'https') {
                                        boxHTML += `<a href="${url}" target="_blank">${url}</a>`;
                                    } else {
                                        const originalColon = match[0].includes(':') && !match[0].includes('：') ? ':' : '：';
                                        boxHTML += `<span textstyle="" style="letter-spacing: normal; font-weight: bold;">${label}${originalColon}</span><a href="${url}" target="_blank">${url}</a>`;
                                    }
                                } else if (hasLabelWithPath) {
                                    // 第一行有标签+路径（无协议）
                                    boxHTML += `<span textstyle="" style="letter-spacing: normal; font-weight: bold;">${label}：</span>${labelPathContent}`;
                                } else if (trimmedLine.endsWith('：') || trimmedLine.endsWith(':')) {
                                    // 第一行只有标签（以冒号结尾的行都加粗）
                                    label = trimmedLine.slice(0, -1); // 去掉冒号作为标签
                                    boxHTML += `<span textstyle="" style="letter-spacing: normal; font-weight: bold;">${trimmedLine}</span>`;
                                } else if (trimmedLine.match(readMoreReg)) {
                                    const cleanContent = trimmedLine.replace(/\s+/g, '');
                                    boxHTML += processInlineFormatting(cleanContent);
                                } else {
                                    boxHTML += processInlineFormatting(trimmedLine);
                                }
                            } else {
                                // 后续行
                                const lineUrlMatch = trimmedLine.match(urlReg);
                                if (lineUrlMatch) {
                                    // 这一行有URL
                                    if (url && index === 1 && label) {
                                        // 如果是第一行后续且有标签，加<br>后直接显示URL
                                        boxHTML += `<br><a href="${lineUrlMatch[0]}" target="_blank">${lineUrlMatch[0]}</a>`;
                                    } else if (url && label) {
                                        // 标签和URL分别在不同行的情况：输出标签（加粗）+ 之前的内容 + URL
                                        boxHTML += `<span textstyle="" style="letter-spacing: normal; font-weight: bold;">${label}：</span>${labelPathContent || ''}<a href="${lineUrlMatch[0]}" target="_blank">${lineUrlMatch[0]}</a>`;
                                    } else if (label) {
                                        // 有标签但URL在后续行：输出标签（加粗）+ URL
                                        boxHTML += `<br><span textstyle="" style="letter-spacing: normal; font-weight: bold;">${label}：</span><a href="${lineUrlMatch[0]}" target="_blank">${lineUrlMatch[0]}</a>`;
                                    } else {
                                        // 当前行是URL但没有标签：直接输出URL（不加处理）
                                        boxHTML += `<br><a href="${lineUrlMatch[0]}" target="_blank">${lineUrlMatch[0]}</a>`;
                                    }
                                } else if (label && labelPathContent) {
                                    // 有标签且有路径内容：输出标签（加粗）+ 路径内容 + 当前行
                                    boxHTML += `<br><span textstyle="" style="letter-spacing: normal; font-weight: bold;">${label}：</span>${labelPathContent}${trimmedLine}`;
                                } else if (label) {
                                    // 有标签但没有路径内容（标签行和内容行分开）：只输出当前行内容（标签已在第一行输出）
                                    boxHTML += `<br>${trimmedLine}`;
                                } else {
                                    boxHTML += '<br>' + processInlineFormatting(trimmedLine);
                                }
                            }
                        });

                        boxHTML += '</div>';
                        return boxHTML;
                    }
                    case 'ul':
                    case 'ol':
                        return renderListBlockHTML(block, true);
                    case 'p': {
                        const bodyStyle = getBodyTypographyStyle();
                        const pFontFamily = isPersonalMode ? "Optima, PingFangSC-light, 'PingFang SC', Georgia, serif" : "mp-quote, 'PingFang SC', -apple-system-font, BlinkMacSystemFont, 'Helvetica Neue', 'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', Arial, sans-serif";
                        return `<p style="margin: ${bodyStyle.margin}; text-align: ${bodyStyle.textAlign}; ${bodyStyle.textJustify} line-height: ${bodyStyle.lineHeight}; font-family: ${pFontFamily}; font-size: ${bodyStyle.fontSize}; letter-spacing: ${bodyStyle.letterSpacing}; color: ${bodyStyle.color};">
                            ${processInlineFormatting(block.content, true, true)}
                        </p>`;
                    }
                    case 'divider': {
                        return `<hr style="border-style: solid; border-width: 1px 0 0; border-color: rgba(0,0,0,0.1); margin: 10px 0;">`;
                    }
                    default:
                        return '';
                }
            }

            // 第三步：拼接HTML并添加空行 - 根据模式选择不同的 header
            let html = '';
            if (includeFixedContent) {
                html += isPersonalMode ? personalHeaderHTML : headerImageHTML;
                // 开头配图下方添加空行（个人模式不需要）
                if (!isPersonalMode) {
                    html += singleBr;
                }
            }

            html += appendRenderedContentBlocks(contentBlocks, generateBlockHTML, {
                singleBr,
                doubleBr,
                addScrollAnchors: true
            });

            // 添加底部（根据模式选择）
            if (includeFixedContent) {
                if (isPersonalMode) {
                    html += personalFooterHTML;
                } else {
                    html += footerHTML;
                }
            }

            return html;
        }

        /**
         * 生成微信编辑器专用完整HTML
         * @param {string} markdown - Markdown文本
         * @returns {string} 适合微信编辑器的完整HTML
         */
        function createWeChatFullHTML(markdown, includeFixedContent = true) {
            let rawLines = markdown.split('\n');
            let contentBlocks = [];
            let inList = false;
            let currentList = [];
            let currentListType = 'ul';
            let i = 0;
            
            // 获取当前模式对应的空行HTML
            const { singleBr, doubleBr } = getBrHtml(isPersonalMode);
            
            // 解析内容块（支持多行灰色底框）
            while (i < rawLines.length) {
                const line = rawLines[i];
                const trimmedLine = line.trim();

                // 代码块（```语言 开始，``` 结束）
                const codeBlockOpen = trimmedLine.match(/^```(\w*)$/);
                if (codeBlockOpen) {
                    if (inList) {
                        contentBlocks.push({ type: currentListType, content: currentList });
                        inList = false;
                        currentList = [];
                        currentListType = 'ul';
                    }
                    const lang = codeBlockOpen[1] || '';
                    const codeLines = [];
                    i++;
                    while (i < rawLines.length) {
                        if (rawLines[i].trim() === '```') { i++; break; }
                        codeLines.push(rawLines[i]);
                        i++;
                    }
                    contentBlocks.push({ type: 'code-block', language: lang, code: codeLines.join('\n') });
                    continue;
                }

                // 多行灰色底框开始（以 ` 开头但不以 ` 结尾）
                if (trimmedLine.startsWith('`') && !trimmedLine.endsWith('`')) {
                    // 如果正在处理列表，先结束列表
                    if (inList) {
                        contentBlocks.push({
                            type: currentListType,
                            content: currentList
                        });
                        inList = false;
                        currentList = [];
                        currentListType = 'ul';
                    }
                    let boxLines = [];

                    // 收集开始行（去掉开头的 `）
                    boxLines.push(trimmedLine.slice(1).trim());
                    i++;

                    // 收集中间行，直到遇到以 ` 结尾的行
                    while (i < rawLines.length) {
                        const nextLine = rawLines[i].trim();
                        if (nextLine.endsWith('`')) {
                            boxLines.push(nextLine.slice(0, -1).trim());
                            i++;
                            break;
                        } else {
                            boxLines.push(nextLine);
                            i++;
                        }
                    }
                    
                    contentBlocks.push({
                        type: 'box',
                        content: boxLines.join('\n')
                    });
                    continue;
                }

                // 单行灰色底框
                if (trimmedLine.startsWith('`') && trimmedLine.endsWith('`')) {
                    // 如果正在处理列表，先结束列表
                    if (inList) {
                        contentBlocks.push({
                            type: currentListType,
                            content: currentList
                        });
                        inList = false;
                        currentList = [];
                        currentListType = 'ul';
                    }
                    // 保留反引号标记，让渲染时的处理逻辑能正确识别并保护斜杠
                    contentBlocks.push({
                        type: 'box',
                        content: trimmedLine
                    });
                    i++;
                    continue;
                }

                // 大标题 (## )
                if (trimmedLine.startsWith('## ') && !trimmedLine.startsWith('### ')) {
                    // 如果正在处理列表，先结束列表
                    if (inList) {
                        contentBlocks.push({
                            type: currentListType,
                            content: currentList
                        });
                        inList = false;
                        currentList = [];
                        currentListType = 'ul';
                    }
                    contentBlocks.push({
                        type: 'h1',
                        content: trimmedLine.substring(3)
                    });
                    i++;
                    continue;
                }

                // 小标题 (### )
                if (trimmedLine.startsWith('### ')) {
                    // 如果正在处理列表，先结束列表
                    if (inList) {
