        /**
         * 切换标记（添加/移除包裹符）
         * @param {string} text - 目标文本
         * @param {string} wrapper - 包裹符（如 "==" 或 "`"）
         * @returns {string} 处理后的文本
         */
        function toggleWrapper(text, wrapper) {
            const wrapperLen = wrapper.length;
            // 检查是否已被包裹
            if (text.startsWith(wrapper) && text.endsWith(wrapper)) {
                // 移除包裹符
                return text.substring(wrapperLen, text.length - wrapperLen);
            } else {
                // 添加包裹符
                return wrapper + text + wrapper;
            }
        }

        function toggleCodeBlock(text) {
            const trimmed = text.trim();
            const codeBlockMatch = trimmed.match(/^```[^\n]*\n([\s\S]*?)\n```$/);
            if (codeBlockMatch) {
                return codeBlockMatch[1];
            }
            return `\`\`\`text\n${text.replace(/^\n+|\n+$/g, '')}\n\`\`\``;
        }

        /**
         * 设置快捷键（Cmd+Z 撤销，Cmd+Y 重做）
         */
         function setupShortcuts() {
             textarea.addEventListener('keydown', function(e) {
                 // 撤销/重做
                 if (e.metaKey) {
                    if (e.key.toLowerCase() === 'z') {
                        e.preventDefault();
                        // Cmd+Z：撤销
                        if (undoStack.length > 1) {
                            redoStack.push(this.value);
                            this.value = undoStack.pop();
                            this.selectionStart = this.selectionEnd = this.value.length;
                            immediateUpdatePreview();
                            showStatus('已撤销上一步操作', 'success');
                        } else {
                            showStatus('没有可撤销的操作', 'error');
                        }
                        return;
                    } else if (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z')) {
                        e.preventDefault();
                        // Cmd+Y / Cmd+Shift+Z：重做
                        if (redoStack.length > 0) {
                            undoStack.push(this.value);
                            this.value = redoStack.pop();
                            this.selectionStart = this.selectionEnd = this.value.length;
                            immediateUpdatePreview();
                            showStatus('已重做上一步操作', 'success');
                        } else {
                            showStatus('没有可重做的操作', 'error');
                        }
                        return;
                    }
                }
        
                // 只处理 Cmd+B（加粗）、Cmd+K（行内代码）、Cmd+Shift+K（代码块）、Cmd+E（高亮）、Cmd+U（加粗+高亮）
                if (!e.metaKey || !['b', 'k', 'u', 'e'].includes(e.key.toLowerCase())) {
                    return;
                }
                
                e.preventDefault();
                
                const start = this.selectionStart;
                const end = this.selectionEnd;
                const selectedText = this.value.substring(start, end);
                
                if (selectedText.length === 0) return;
        
                let newText = '';
                let action = '';
                
                // 匹配快捷键
                if (e.key.toLowerCase() === 'b') {
                    // Cmd+B: 加粗 **文本** / 取消加粗
                    if (selectedText.startsWith('**') && selectedText.endsWith('**')) {
                        newText = selectedText.slice(2, -2);
                        action = '取消加粗';
                    } else {
                        newText = '**' + selectedText + '**';
                        action = '加粗';
                    }
                } else if (e.key.toLowerCase() === 'k' && e.shiftKey) {
                    // Cmd+Shift+K: 代码块 ```text ... ``` / 取消代码块
                    newText = toggleCodeBlock(selectedText);
                    action = newText === selectedText ? '取消代码块' : (selectedText.trim().startsWith('```') ? '取消代码块' : '添加代码块');
                } else if (e.key.toLowerCase() === 'k') {
                    // Cmd+K: 行内代码 `文本` / 移除行内代码
                    if (selectedText.startsWith('`') && selectedText.endsWith('`') && !selectedText.startsWith('```')) {
                        newText = selectedText.slice(1, -1);
                        action = '取消行内代码';
                    } else {
                        newText = '`' + selectedText + '`';
                        action = '添加行内代码';
                    }
                } else if (e.key.toLowerCase() === 'u') {
                    // Cmd+U: 加粗+高亮 **==文本==** / 取消
                    if (selectedText.startsWith('**==') && selectedText.endsWith('==**')) {
                        newText = selectedText.slice(4, -4);
                        action = '取消加粗高亮';
                    } else {
                        newText = '**==' + selectedText + '==**';
                        action = '加粗高亮';
                    }
                } else if (e.key.toLowerCase() === 'e') {
                    // Cmd+E: 高亮 ==文本== / 取消高亮
                    if (selectedText.startsWith('==') && selectedText.endsWith('==')) {
                        newText = selectedText.slice(2, -2);
                        action = '取消高亮';
                    } else {
                        newText = '==' + selectedText + '==';
                        action = '高亮';
                    }
                }
        
                // 记录到撤销栈
                undoStack.push(this.value);
                redoStack.length = 0;
                if (undoStack.length > 50) undoStack.shift();
                
                // 2. 标记为快捷键操作
                this.dataset.isShortcutAction = 'true';
                
                // 3. 修改文本
                const beforeText = this.value.substring(0, start);
                const afterText = this.value.substring(end);
                this.value = beforeText + newText + afterText;
                this.selectionStart = this.selectionEnd = start + newText.length;
                
                // 更新预览
                saveDraftNow();
                updatePreview();
                
                // 提示
                showStatus(`已${action}选中文本`, 'success');
            });
        }
