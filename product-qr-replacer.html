<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>二维码批量替换工具 - 最终平衡版</title>
    <script src="assets/vendor/jsQR.min.js"></script>
    <script src="assets/vendor/qrcode.min.js"></script>
    <style>
        :root { --primary: #007bff; --success: #28a745; --warning: #ffc107; --bg: #f5f7fa; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        .header-box { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; margin-bottom: 20px; padding-bottom: 10px; }
        .config-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; background: #eee; margin-right: 5px; }

        /* 上传及批量操作区 */
        .action-bar { display: flex; gap: 15px; margin-bottom: 30px; }
        .upload-area { 
            flex: 2; border: 2px dashed var(--primary); background: #f8fbff; 
            padding: 20px; text-align: center; cursor: pointer; border-radius: 8px;
        }
        .btn-batch { 
            flex: 1; background: #6c757d; color: white; border: none; 
            border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold;
            display: none; /* 有图片时才显示 */
            transition: 0.3s;
        }
        .btn-batch.visible { display: block; background: #000; }
        .btn-batch:hover { opacity: 0.8; }

        /* 列表项布局：平分 1:1 */
        .preview-item { 
            display: flex; background: #fff; border: 1px solid #e8e8e8; 
            border-radius: 12px; margin-bottom: 30px; overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .img-container { flex: 1; background: #fafafa; border-right: 1px solid #eee; padding: 15px; display: flex; align-items: center; justify-content: center; }
        .img-container img { width: 100%; max-height: 500px; object-fit: contain; }

        .info-container { flex: 1; padding: 30px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
        
        .url-box { background: #f9f9f9; border-radius: 8px; padding: 15px; border-left: 5px solid #ddd; margin-bottom: 15px; }
        .url-title { font-size: 12px; font-weight: bold; color: #888; margin-bottom: 6px; }
        .url-content { font-family: monospace; font-size: 14px; word-break: break-all; color: var(--primary); }
        
        .btn-single-download { 
            background: var(--success); color: white; border: none; padding: 10px 20px; 
            border-radius: 6px; cursor: pointer; font-size: 14px; align-self: flex-start;
            transition: 0.2s;
        }
        .btn-single-download:hover { background: #218838; }
        
        .template-tag { font-size: 11px; color: white; padding: 2px 8px; border-radius: 4px; vertical-align: middle; }
    </style>
</head>
<body>

    <div class="container">
    <div class="header-box">
        <div>
            <h2>二维码替换器</h2>
            <p style="color: #999; font-size: 12px; margin: 4px 0 0 0;">把商品 / 活动卡片内的二维码，替换为带当日追踪参数的版本</p>
        </div>
        <div>
            <span class="config-badge">Search: 827,191 | 182px</span>
            <span class="config-badge">Product(旧): 760,140 | 216px</span>
            <span class="config-badge" style="background: #28a745; color: white;">Product(新): 738,148 | 203px</span>
        </div>
    </div>
    
    <div class="action-bar">
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <strong>点击上传图片</strong> (支持批量)
            <input type="file" id="fileInput" multiple accept="image/*" style="display:none">
        </div>
        <button id="batchDownloadBtn" class="btn-batch" onclick="downloadAll()">一键下载所有图片</button>
    </div>

    <div id="resultArea"></div>
</div>

<script>
    const TEMPLATES = {
        SEARCH: { x: 827, y: 191, size: 182, label: 'Search List 模板', color: '#ffc107' },
        PRODUCT: { x: 760, y: 140, size: 216, label: 'Products 模板（旧版）', color: '#007bff' },
        PRODUCT_NEW: { x: 738, y: 148, size: 203, label: 'Products 模板（新版）', color: '#28a745' }
    };

    // 存储所有已处理的图片数据用于批量下载
    let processedImages = [];

    function getTodayStamp() {
        const d = new Date();
        const yy = String(d.getFullYear()).slice(-2);
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `p${yy}${mm}${dd}`;
    }

    function getNewData(originalUrl, imageWidth, imageHeight) {
        const todayStamp = getTodayStamp();
        const targetCid = "53qvofdc";
        if (originalUrl.includes('search_list')) {
            if (/([?&]hmpl=)p\d+/i.test(originalUrl)) {
                return { url: originalUrl.replace(/([?&]hmpl=)p\d+/i, `$1${todayStamp}`), config: TEMPLATES.SEARCH };
            }
            const url = new URL(originalUrl);
            url.searchParams.set('cid', targetCid);
            url.searchParams.set('hmsr', 'wechat');
            url.searchParams.set('hmpl', todayStamp);
            return { url: url.toString(), config: TEMPLATES.SEARCH };
        } else if (originalUrl.includes('products')) {
            const baseUrl = originalUrl.split('?')[0];
            // 根据图片尺寸判断新版或旧版卡片
            const isNewCard = imageWidth <= 1000 && imageHeight <= 420;
            const config = isNewCard ? TEMPLATES.PRODUCT_NEW : TEMPLATES.PRODUCT;
            return { url: `${baseUrl}?cid=${targetCid}&hmsr=wechat&hmpl=${todayStamp}`, config };
        }
        if (/([?&]hmpl=)p\d+/i.test(originalUrl)) {
            return { url: originalUrl.replace(/([?&]hmpl=)p\d+/i, `$1${todayStamp}`), config: null };
        }
        return { url: originalUrl, config: null };
    }

    function clampNumber(value, min, max) {
        return Math.min(max, Math.max(min, value));
    }

    function getQrBoxFromLocation(location, imageWidth, imageHeight) {
        if (!location) return null;
        const points = [
            location.topLeftCorner,
            location.topRightCorner,
            location.bottomRightCorner,
            location.bottomLeftCorner
        ].filter(Boolean);
        if (points.length < 4) return null;

        const minX = Math.min(...points.map(point => point.x));
        const maxX = Math.max(...points.map(point => point.x));
        const minY = Math.min(...points.map(point => point.y));
        const maxY = Math.max(...points.map(point => point.y));
        const rawSize = Math.max(maxX - minX, maxY - minY);
        if (!Number.isFinite(rawSize) || rawSize < 24) return null;

        // 识别角点外扩一点，把旧二维码静区一起覆盖掉。
        const padding = Math.max(3, Math.round(rawSize * 0.035));
        const centerX = (minX + maxX) / 2;
        const centerY = (minY + maxY) / 2;
        const size = Math.round(rawSize + padding * 2);
        return {
            x: Math.round(clampNumber(centerX - size / 2, 0, Math.max(0, imageWidth - size))),
            y: Math.round(clampNumber(centerY - size / 2, 0, Math.max(0, imageHeight - size))),
            size: Math.round(Math.min(size, imageWidth, imageHeight)),
            label: '智能识别位置',
            color: '#6f42c1'
        };
    }

    function rgbToHex(color) {
        const toHex = (value) => clampNumber(Math.round(value), 0, 255).toString(16).padStart(2, '0');
        return `#${toHex(color.r)}${toHex(color.g)}${toHex(color.b)}`;
    }

    function getColorLuminance(color) {
        return 0.299 * color.r + 0.587 * color.g + 0.114 * color.b;
    }

    function averageColorSamples(samples, fallback) {
        if (!samples.length) return fallback;
        const total = samples.reduce((acc, color) => {
            acc.r += color.r;
            acc.g += color.g;
            acc.b += color.b;
            return acc;
        }, { r: 0, g: 0, b: 0 });
        return {
            r: Math.round(total.r / samples.length),
            g: Math.round(total.g / samples.length),
            b: Math.round(total.b / samples.length)
        };
    }

    function getQrReplacementColors(ctx, box, canvasWidth, canvasHeight) {
        const x = clampNumber(Math.round(box.x), 0, canvasWidth - 1);
        const y = clampNumber(Math.round(box.y), 0, canvasHeight - 1);
        const width = clampNumber(Math.round(box.size), 1, canvasWidth - x);
        const height = clampNumber(Math.round(box.size), 1, canvasHeight - y);
        const imageData = ctx.getImageData(x, y, width, height);
        const data = imageData.data;
        const sampleStep = Math.max(1, Math.floor((width * height) / 22000));
        const samples = [];

        for (let i = 0; i < data.length; i += 4 * sampleStep) {
            if (data[i + 3] < 128) continue;
            const color = { r: data[i], g: data[i + 1], b: data[i + 2] };
            samples.push({ ...color, luminance: getColorLuminance(color) });
        }

        if (!samples.length) {
            return {
                dark: { r: 0, g: 0, b: 0 },
                light: { r: 255, g: 255, b: 255 }
            };
        }

        samples.sort((a, b) => a.luminance - b.luminance);
        const sliceSize = Math.max(8, Math.round(samples.length * 0.16));
        const dark = averageColorSamples(samples.slice(0, sliceSize), { r: 0, g: 0, b: 0 });
        const light = averageColorSamples(samples.slice(-sliceSize), { r: 255, g: 255, b: 255 });
        const contrast = Math.abs(getColorLuminance(light) - getColorLuminance(dark));

        return {
            dark: contrast >= 45 ? dark : { r: 0, g: 0, b: 0 },
            light: contrast >= 45 ? light : { r: 255, g: 255, b: 255 }
        };
    }

    async function drawReplacementQr(ctx, newUrl, box, canvasWidth, canvasHeight) {
        const colors = getQrReplacementColors(ctx, box, canvasWidth, canvasHeight);
        const qrCanvas = document.createElement('canvas');
        await QRCode.toCanvas(qrCanvas, newUrl, {
            margin: 1,
            width: box.size,
            errorCorrectionLevel: 'H',
            color: {
                dark: rgbToHex(colors.dark),
                light: rgbToHex(colors.light)
            }
        });

        ctx.fillStyle = rgbToHex(colors.light);
        ctx.fillRect(box.x, box.y, box.size, box.size);
        ctx.drawImage(qrCanvas, box.x, box.y, box.size, box.size);
    }

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        if (files.length > 0) {
            document.getElementById('batchDownloadBtn').classList.add('visible');
        }
        for (const file of files) {
            await processImage(file);
        }
    });

    async function processImage(file) {
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = async () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    const result = getNewData(code.data, img.width, img.height);
                    if (result.url !== code.data) {
                        const detectedBox = getQrBoxFromLocation(code.location, img.width, img.height);
                        const box = detectedBox || result.config;
                        if (!box) return;
                        await drawReplacementQr(ctx, result.url, box, img.width, img.height);
                        
                        const finalDataUrl = canvas.toDataURL('image/png');
                        const finalFileName = `final_${file.name.split('.')[0]}.png`;
                        
                        processedImages.push({ url: finalDataUrl, name: finalFileName });
                        renderRow(finalDataUrl, file.name, code.data, result.url, box, finalFileName);
                    }
                }
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    function renderRow(dataUrl, fileName, oldUrl, newUrl, config, finalFileName) {
        const row = document.createElement('div');
        row.className = 'preview-item';
        row.innerHTML = `
            <div class="img-container">
                <img src="${dataUrl}">
            </div>
            <div class="info-container">
                <div style="margin-bottom:20px">
                    <div style="font-weight:bold; font-size:16px; margin-bottom:8px">
                        📄 ${fileName} 
                        <span class="template-tag" style="background:${config.color}">${config.label}</span>
                    </div>
                    <div class="url-box">
                        <div class="url-title">原始链接:</div>
                        <div class="url-content">${oldUrl}</div>
                    </div>
                    <div class="url-box" style="border-left-color: var(--success)">
                        <div class="url-title">更新后链接:</div>
                        <div class="url-content">${newUrl}</div>
                    </div>
                </div>
                <button class="btn-single-download" onclick="downloadImage('${dataUrl}', '${finalFileName}')">
                    保存单张图片
                </button>
            </div>
        `;
        document.getElementById('resultArea').prepend(row);
    }

    window.downloadImage = (dataUrl, name) => {
        const link = document.createElement('a');
        link.download = name;
        link.href = dataUrl;
        link.click();
    };

    window.downloadAll = () => {
        if (processedImages.length === 0) return;
        processedImages.forEach((item, index) => {
            // 使用 setTimeout 错开下载请求，防止浏览器拦截
            setTimeout(() => {
                downloadImage(item.url, item.name);
            }, index * 200); 
        });
    };
</script>

</body>
</html>
